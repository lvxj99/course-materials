<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">DPO：把奖励差，改写成策略概率比之差</title><desc id="desc">DPO 把 KL 奖励最优策略关系代入偏好模型，使用同题比较消去未知归一化常数。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="660" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 12</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >DPO：把奖励差，改写成策略概率比之差</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >从固定奖励下的 KL 正则化最优解出发，再连接偏好模型</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<text x="50" y="219" font-size="19" fill="#26343b" text-anchor="start" font-weight="400" >① 理想分布优化</text>
<rect x="300" y="185" width="648" height="66" rx="6" fill="#e4f1f0" stroke="#d9dfdf" />
<text x="624" y="224" font-size="23" fill="#26343b" text-anchor="middle" font-weight="400" >maxπ  Eπ[r] − β KL(π || πref)</text>
<line x1="625" y1="251" x2="625" y2="293" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<text x="50" y="327" font-size="19" fill="#26343b" text-anchor="start" font-weight="400" >② 重排最优解</text>
<rect x="300" y="293" width="648" height="66" rx="6" fill="#eaf0f8" stroke="#d9dfdf" />
<text x="624" y="332" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >r(x,y) = β log(π*(y|x) / πref(y|x)) + β log Z(x)</text>
<line x1="625" y1="359" x2="625" y2="401" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<text x="50" y="435" font-size="19" fill="#26343b" text-anchor="start" font-weight="400" >③ 同题比较消去 Z(x)</text>
<rect x="300" y="401" width="648" height="66" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="624" y="440" font-size="23" fill="#26343b" text-anchor="middle" font-weight="400" >P(yw ≻ yl | x) = σ(β Δθ)</text>
<text x="500" y="530" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >Δθ = log(πθ(yw|x)/πref(yw|x)) − log(πθ(yl|x)/πref(yl|x))</text>
<line x1="40" y1="588" x2="960" y2="588" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="617" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >损失 L = −log σ(βΔθ)；Δθ 衡量胜者相对败者的概率比，比参考策略提高了多少。</text>
<text x="40" y="642" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >同一题的 Z(x) 对两个回答相同，相减后消失；于是可以直接用偏好数据训练策略。</text></svg>
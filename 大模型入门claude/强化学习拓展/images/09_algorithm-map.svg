<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >算法演进：三种问题，反复连接</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >顺着三列阅读：估计未来 → 改变行动 → 控制更新</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<text x="60" y="179" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >怎样估计未来？</text>
<text x="382" y="179" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >怎样改变行动？</text>
<text x="704" y="179" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >怎样控制偏离？</text>
<rect x="45" y="207" width="265" height="63" rx="6" fill="#eaf0f8" stroke="#4c75a0" />

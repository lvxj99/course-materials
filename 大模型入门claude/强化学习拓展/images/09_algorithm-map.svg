<path d="M821,382 L821,437 L755,437 L755,481" stroke="#b76343" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b76343)"/>
<rect x="101" y="485" width="290" height="69" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="246" y="509.75" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >Critic 路线</text>
<text x="246" y="541.25" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >PPO 式 RLHF / RLVR</text>
<rect x="610" y="485" width="290" height="69" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="755" y="509.75" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >组内比较路线</text>
<text x="755" y="541.25" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >GRPO 等</text>
<line x1="40" y1="608" x2="960" y2="608" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="637" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >DPO 从 KL 正则化目标推导偏好损失，直接学习同题回答之间的比较。</text>
<text x="40" y="662" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >连续控制、模型规划与离线 RL 则沿着不同任务需求发展出各自的方法。</text></svg>
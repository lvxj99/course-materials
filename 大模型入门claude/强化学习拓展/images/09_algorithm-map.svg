<rect x="689" y="319" width="265" height="63" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="821.5" y="356.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >概率比 / 裁剪 / KL</text>

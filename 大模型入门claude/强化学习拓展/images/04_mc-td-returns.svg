<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc"><title id="title">MC、TD 与多步：奖励怎样传回前面？</title><desc id="desc">从目标公式到三步算例：MC 使用完整回报，TD 每轮把已学到的后继价值向前传递。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="950" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 04</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >MC、TD 与多步：奖励怎样传回前面？</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >观测奖励用橙色；尚未展开的未来用价值估计表示</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<text x="53" y="234" font-size="23" fill="#26343b" text-anchor="start" font-weight="400" >TD(0)</text>
<rect x="208" y="201" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="288" y="235.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >rₜ₊₁</text>
<text x="379" y="238" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="390" y="201" width="160" height="57" rx="6" fill="#e4f1f0" stroke="#d9dfdf" />
<text x="470" y="235.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >γ V(sₜ₊₁)</text>
<text x="53" y="343" font-size="23" fill="#26343b" text-anchor="start" font-weight="400" >3-step</text>
<rect x="208" y="310" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="288" y="344.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >rₜ₊₁</text>
<text x="379" y="347" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="390" y="310" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="470" y="344.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >γ rₜ₊₂</text>
<text x="561" y="347" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="572" y="310" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="652" y="344.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >γ² rₜ₊₃</text>
<text x="743" y="347" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="754" y="310" width="160" height="57" rx="6" fill="#e4f1f0" stroke="#d9dfdf" />
<text x="834" y="344.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >γ³ V(sₜ₊₃)</text>
<text x="53" y="452" font-size="23" fill="#26343b" text-anchor="start" font-weight="400" >MC</text>
<rect x="208" y="419" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="288" y="453.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >rₜ₊₁</text>
<text x="379" y="456" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="390" y="419" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="470" y="453.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >γ rₜ₊₂</text>
<text x="561" y="456" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="572" y="419" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="652" y="453.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >…</text>
<text x="743" y="456" font-size="23" fill="#647079" text-anchor="middle" font-weight="400" >+</text>
<rect x="754" y="419" width="160" height="57" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="834" y="453.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >到真实终止</text>
<line x1="53" y1="505" x2="947" y2="505" stroke="#d9dfdf" stroke-width="1" />
<text x="53" y="538" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >看一个完整例子：a → b → c → 终止，奖励依次为 0、0、1</text>
<text x="53" y="571" font-size="18" fill="#647079" text-anchor="start" font-weight="400" >γ = 0.9；初始价值全为 0；步长 α = 1；每轮按 a、b、c 顺序更新</text>
<text x="405" y="617" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >V(a)</text>
<text x="605" y="617" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >V(b)</text>
<text x="805" y="617" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >V(c)</text>
<text x="72" y="666" font-size="19" fill="#b76343" text-anchor="start" font-weight="400" >MC：一轮完整回报</text>
<rect x="332" y="641" width="146" height="37" rx="6" fill="#f6ece8" stroke="#d9dfdf" />
<text x="405" y="665.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0.81</text>
<rect x="532" y="641" width="146" height="37" rx="6" fill="#f6ece8" stroke="#d9dfdf" />
<text x="605" y="665.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0.9</text>
<rect x="732" y="641" width="146" height="37" rx="6" fill="#f6ece8" stroke="#d9dfdf" />
<text x="805" y="665.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >1</text>
<text x="72" y="715" font-size="19" fill="#227d82" text-anchor="start" font-weight="400" >TD：第 1 轮之后</text>
<rect x="332" y="690" width="146" height="37" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="405" y="714.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0</text>
<rect x="532" y="690" width="146" height="37" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="605" y="714.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0</text>
<rect x="732" y="690" width="146" height="37" rx="6" fill="#e4eff0" stroke="#d9dfdf" />
<text x="805" y="714.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >1</text>
<text x="72" y="764" font-size="19" fill="#227d82" text-anchor="start" font-weight="400" >TD：第 2 轮之后</text>
<rect x="332" y="739" width="146" height="37" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="405" y="763.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0</text>
<rect x="532" y="739" width="146" height="37" rx="6" fill="#e4eff0" stroke="#d9dfdf" />
<text x="605" y="763.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0.9</text>
<rect x="732" y="739" width="146" height="37" rx="6" fill="#e4eff0" stroke="#d9dfdf" />
<text x="805" y="763.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >1</text>
<text x="72" y="813" font-size="19" fill="#227d82" text-anchor="start" font-weight="400" >TD：第 3 轮之后</text>
<rect x="332" y="788" width="146" height="37" rx="6" fill="#e4eff0" stroke="#d9dfdf" />
<text x="405" y="812.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0.81</text>
<rect x="532" y="788" width="146" height="37" rx="6" fill="#e4eff0" stroke="#d9dfdf" />
<text x="605" y="812.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >0.9</text>
<rect x="732" y="788" width="146" height="37" rx="6" fill="#e4eff0" stroke="#d9dfdf" />
<text x="805" y="812.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >1</text>
<line x1="40" y1="878" x2="960" y2="878" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="907" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >MC 等到结局后，一轮就能算出所有回报；一步 TD 让已经学到的价值每轮向前传一站。</text>
<text x="40" y="932" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >上表是确定性三步轨迹的实际计算。多步 TD 则一次使用更多步奖励，连接这两种做法。</text></svg>
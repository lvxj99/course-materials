<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" role="img" aria-labelledby="title desc"><title id="title">DQN：预测在学习，目标慢一点变化</title><desc id="desc">当前 Q 网络拟合从慢目标网络计算的 TD 目标；训练目标停止梯度，经验由回放池提供。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="665" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 05</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >DQN：预测在学习，目标慢一点变化</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >经验回放减少相关性；目标网络降低目标快速漂移</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="52" y="185" width="205" height="69" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="154.5" y="210.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >环境交互</text>
<text x="154.5" y="240.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >收集转移样本</text>
<line x1="257" y1="220" x2="344" y2="220" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="351" y="185" width="235" height="69" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="468.5" y="211.25" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >经验回放池 D</text>
<text x="468.5" y="239.75" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >(s, a, r, s′, done)</text>
<line x1="586" y1="220" x2="670" y2="220" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="678" y="185" width="271" height="69" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="813.5" y="225.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >随机抽取 minibatch</text>
<path d="M814,254 L814,300 L260,300 L260,341" stroke="#4c75a0" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-4c75a0)"/>
<rect x="79" y="346" width="361" height="70" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="259.5" y="370.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >当前网络 Qθ(s, a)</text>
<text x="259.5" y="403.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >梯度更新 θ</text>
<line x1="814" y1="254" x2="814" y2="345" stroke="#4c75a0" stroke-width="1.7" marker-end="url(#arrow-4c75a0)"/>
<rect x="594" y="346" width="355" height="70" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="771.5" y="372.75" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >目标网络 Qθ̄(s′, a′)</text>
<text x="771.5" y="401.25" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >y = r + γ(1−d) max Qθ̄</text>
<path d="M260,416 L260,479 L443,479" stroke="#227d82" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<path d="M771,416 L771,479 L657,479" stroke="#b76343" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b76343)"/>
<rect x="447" y="447" width="207" height="64" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="550.5" y="485" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >(Qθ − stopgrad(y))²</text>
<path d="M447,479 L351,479 L351,416" stroke="#227d82" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)" stroke-dasharray="5 5"/>
<text x="233" y="522" font-size="17" fill="#227d82" text-anchor="middle" font-weight="400" >反向传播只更新当前预测</text>
<path d="M440,380 L594,380" stroke="#647079" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-647079)" stroke-dasharray="5 5"/>
<text x="517" y="345" font-size="16" fill="#647079" text-anchor="middle" font-weight="400" >定期 / 缓慢同步</text>
<line x1="40" y1="593" x2="960" y2="593" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="622" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >本次更新把目标 y 当作固定答案，梯度只调整当前网络的预测。</text>
<text x="40" y="647" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >隔一段时间再同步目标网络，让预测逐渐追上目标，而目标也有序地向前移动。</text></svg>
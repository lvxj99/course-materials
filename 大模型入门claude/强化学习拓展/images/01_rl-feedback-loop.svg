<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">强化学习：行动产生数据，数据改变策略</title><desc id="desc">行动、环境反馈与学习更新构成闭环。参数更新与部署时执行策略可以分开。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="600" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 01</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >强化学习：行动产生数据，数据改变策略</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >奖励评价后果；策略决定在当前情境中怎样行动</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="80" y="225" width="220" height="105" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="190" y="252" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >策略 πθ</text>
<text x="190" y="283.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >输入状态 / 历史</text>
<text x="190" y="315" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >选择动作</text>
<rect x="663" y="225" width="250" height="105" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="788" y="252" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >环境</text>
<text x="788" y="283.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >执行转移</text>
<text x="788" y="315" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >返回奖励与新状态</text>
<line x1="300" y1="253" x2="663" y2="253" stroke="#227d82" stroke-width="2.5" marker-end="url(#arrow-227d82)"/>
<text x="482" y="230" font-size="21" fill="#227d82" text-anchor="middle" font-weight="400" >动作 aₜ</text>
<path d="M663,303 L491,303 L491,382 L190,382 L190,330" stroke="#4c75a0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-4c75a0)"/>
<text x="491" y="421" font-size="21" fill="#4c75a0" text-anchor="middle" font-weight="400" >经验 (sₜ, aₜ, rₜ₊₁, sₜ₊₁)</text>
<rect x="635" y="432" width="278" height="57" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="774" y="466.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >学习器：更新 θ</text>
<path d="M491,382 L774,382 L774,432" stroke="#b76343" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b76343)"/>
<path d="M635,460 L80,460 L80,330" stroke="#b76343" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b76343)" stroke-dasharray="5 5"/>
<line x1="40" y1="528" x2="960" y2="528" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="557" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >蓝色回路是与环境交互；橙色虚线是训练更新。部署时可固定参数，只运行交互回路。</text>
<text x="40" y="582" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >反馈可能延迟，且当前策略决定下一批会遇到什么数据。</text></svg>
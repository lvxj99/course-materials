<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc"><title id="title">完整后训练闭环：从尝试到反馈，再到更新</title><desc id="desc">沿着一批回答，连接采样、打分、优势估计、策略更新与新题目评测。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="670" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 14</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >完整后训练闭环：从尝试到反馈，再到更新</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >采样 → 打分 → 比较表现 → 调整概率 → 再试一次</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="47" y="205" width="195" height="78" rx="6" fill="#eaf0f8" stroke="#d9dfdf" />
<text x="144.5" y="235" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >Prompt 分布</text>
<text x="144.5" y="265" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >按题取样</text>
<line x1="242" y1="244" x2="287" y2="244" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="287" y="205" width="195" height="78" rx="6" fill="#eaf0f8" stroke="#d9dfdf" />
<text x="384.5" y="235" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >Rollout</text>
<text x="384.5" y="265" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >记录行为概率</text>
<line x1="482" y1="244" x2="527" y2="244" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="527" y="205" width="195" height="78" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="624.5" y="235" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >Reward</text>
<text x="624.5" y="265" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >规则 / 模型评分</text>
<line x1="722" y1="244" x2="767" y2="244" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="767" y="205" width="195" height="78" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="864.5" y="235" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >优势估计</text>
<text x="864.5" y="265" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >GAE 或组内比较</text>
<path d="M864,283 L864,354 L731,354 L731,390" stroke="#227d82" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<rect x="574" y="395" width="312" height="78" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="730" y="425" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >更新 Actor / 可选 Critic</text>
<text x="730" y="455" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >裁剪、KL、掩码与归一化</text>
<path d="M574,434 L265,434 L265,322 L385,322 L385,283" stroke="#227d82" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="421" y="419" font-size="20" fill="#227d82" text-anchor="middle" font-weight="400" >同步新策略，再采样</text>
<line x1="731" y1="473" x2="731" y2="533" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="386" y="536" width="549" height="48" rx="6" fill="#f0edf6" stroke="#7d6a9b" />
<text x="660.5" y="566" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >独立题目 + 固定推理预算 + 失败样本审计</text>
<text x="59" y="566" font-size="22" fill="#7d6a9b" text-anchor="start" font-weight="400" >评估</text>
<line x1="40" y1="598" x2="960" y2="598" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="627" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >训练题目提供反馈；新题目帮助我们看清学到的方法能否迁移。</text>
<text x="40" y="652" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >采样和训练分开运行时，保存采样版本及其概率，便于计算本轮更新使用的比率。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">两状态 MDP：现在提交，还是继续完善？</title><desc id="desc">两状态任务完整标出奖励、概率与终止，支持手算价值函数。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="660" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 02</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >两状态 MDP：现在提交，还是继续完善？</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >奖励与概率是明确设定的教学环境；γ = 0.9</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<circle cx="226" cy="332" r="70" fill="#e4f1f0" stroke="#227d82" stroke-width="2"/>
<text x="226" y="326" font-size="32" fill="#227d82" text-anchor="middle" font-weight="400" >s₀</text>
<text x="226" y="360" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >粗稿</text>
<circle cx="729" cy="332" r="70" fill="#eaf0f8" stroke="#4c75a0" stroke-width="2"/>
<text x="729" y="326" font-size="32" fill="#4c75a0" text-anchor="middle" font-weight="400" >s₁</text>
<text x="729" y="360" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >已完善</text>
<line x1="296" y1="332" x2="659" y2="332" stroke="#227d82" stroke-width="2.5" marker-end="url(#arrow-227d82)"/>
<text x="477" y="307" font-size="21" fill="#227d82" text-anchor="middle" font-weight="400" >完善：r = −1，P = 0.8</text>
<path d="M190 271 C70 190 355 190 260 271" stroke="#227d82" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="226" y="180" font-size="18" fill="#227d82" text-anchor="middle" font-weight="400" >完善失败：r = −1，P = 0.2</text>
<path d="M693 271 C573 190 858 190 763 271" stroke="#4c75a0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-4c75a0)"/>
<text x="729" y="180" font-size="18" fill="#4c75a0" text-anchor="middle" font-weight="400" >再次完善：r = −1，P = 1</text>
<rect x="386" y="474" width="220" height="64" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="496" y="512" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >终止 ⊥：V = 0</text>
<line x1="265" y1="390" x2="418" y2="474" stroke="#b76343" stroke-width="2" marker-end="url(#arrow-b76343)"/>
<line x1="690" y1="390" x2="573" y2="474" stroke="#b76343" stroke-width="2" marker-end="url(#arrow-b76343)"/>
<text x="280" y="445" font-size="20" fill="#b76343" text-anchor="middle" font-weight="400" >提交：+2</text>
<text x="713" y="445" font-size="20" fill="#b76343" text-anchor="middle" font-weight="400" >提交：+8</text>
<line x1="40" y1="588" x2="960" y2="588" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="617" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >动作由 Agent 选择；成功还是失败由转移概率决定。图中每个状态—动作的概率和为 1。</text>
<text x="40" y="642" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >立即提交粗稿得 2；先完善一次再提交，期望折扣回报为 −1 + 0.9(0.8×8 + 0.2×2) = 5.12。</text></svg>
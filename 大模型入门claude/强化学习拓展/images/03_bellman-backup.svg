<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Bellman 备份：用下一状态价值概括未来</title><desc id="desc">Bellman 方程把递归的期望未来压缩为一个可解方程；解析值约为 5.804878。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="620" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 03</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >Bellman 备份：用下一状态价值概括未来</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >固定策略：粗稿继续完善，完善后提交</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="52" y="266" width="150" height="91" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="127" y="300.25" font-size="23" fill="#26343b" text-anchor="middle" font-weight="400" >V(s₀)</text>
<text x="127" y="334.75" font-size="23" fill="#26343b" text-anchor="middle" font-weight="400" >未知量</text>
<line x1="202" y1="294" x2="379" y2="221" stroke="#4c75a0" stroke-width="2" marker-end="url(#arrow-4c75a0)"/>
<line x1="202" y1="332" x2="379" y2="408" stroke="#b76343" stroke-width="2" marker-end="url(#arrow-b76343)"/>
<text x="284" y="226" font-size="21" fill="#4c75a0" text-anchor="middle" font-weight="400" >0.8</text>
<text x="284" y="411" font-size="21" fill="#b76343" text-anchor="middle" font-weight="400" >0.2</text>
<rect x="387" y="176" width="226" height="88" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="500" y="208.75" font-size="23" fill="#26343b" text-anchor="middle" font-weight="400" >成功 → s₁</text>
<text x="500" y="243.25" font-size="23" fill="#26343b" text-anchor="middle" font-weight="400" >V(s₁) = 8</text>
<rect x="387" y="368" width="226" height="88" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="500" y="402.25" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >失败 → s₀</text>
<text x="500" y="433.75" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >V(s₀) 仍待求</text>
<text x="660" y="224" font-size="24" fill="#4c75a0" text-anchor="start" font-weight="400" >−1 + 0.9 × 8</text>
<text x="660" y="415" font-size="23" fill="#b76343" text-anchor="start" font-weight="400" >−1 + 0.9 × V(s₀)</text>
<rect x="72" y="482" width="856" height="54" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="500" y="516" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >V(s₀) = −1 + 0.9[0.8×8 + 0.2V(s₀)] = 5.804878…</text>
<line x1="40" y1="548" x2="960" y2="548" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="577" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >两个分支都支付当前成本 −1；概率加权后的成本仍为 −1。</text>
<text x="40" y="602" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >失败分支上的价值递归已经包含之后所有可能的再次尝试。</text></svg>
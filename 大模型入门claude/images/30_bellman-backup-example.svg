<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC','Hiragino Sans GB',sans-serif" role="img"><title>贝尔曼递推示例</title><desc>从后继状态的价值回推动作价值，再按策略加权得到状态价值。</desc><defs><marker id="ah7B4FC91_0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 L2.6,5 Z" fill="#7B4FC9"/></marker></defs><rect width="1060" height="560" fill="#FFFFFF"/><text x="30.0" y="80.0" font-size="13.5" fill="#6B7280" text-anchor="start" dominant-baseline="central" font-weight="bold">状态</text>

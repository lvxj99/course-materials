<text x="520.0" y="310.0" font-size="14.5" fill="#2A9D66" text-anchor="middle" dominant-baseline="central" font-weight="bold">训练目标是干净的 <tspan font-family="'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif" font-style="italic">x</tspan> ✓</text>
<path d="M340,256.0 L340,270 L860,270 L900,178" stroke="#9CA3AF" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
<line x1="591.0" y1="261.0" x2="609.0" y2="279.0" stroke="#D64545" stroke-width="2.6" stroke-linecap="round"/>
<line x1="591.0" y1="279.0" x2="609.0" y2="261.0" stroke="#D64545" stroke-width="2.6" stroke-linecap="round"/>
<text x="618.0" y="256.0" font-size="13" fill="#D64545" text-anchor="start" dominant-baseline="central">不是去拟合 <tspan font-family="'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif" font-style="italic">x̃</tspan></text>
<text x="520.0" y="370.0" font-size="13" fill="#6B7280" text-anchor="middle" dominant-baseline="central">噪声每次都不一样，干净结构却是稳定的：模型只能靠学到“笔画该长什么样”来恢复图像。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC','Hiragino Sans GB',sans-serif" role="img"><title>去噪自编码器</title><desc>输入是加噪图像，训练目标却是干净图像。</desc><defs><marker id="ah1F29371_0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 L2.6,5 Z" fill="#1F2937"/></marker><marker id="ahD645451_0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 L2.6,5 Z" fill="#D64545"/></marker><marker id="ah2A9D661_1" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 L2.6,5 Z" fill="#2A9D66"/></marker></defs><rect width="1040" height="420" fill="#FFFFFF"/><image x="40.0" y="76.0" width="128.0" height="128.0" href="data:image/png;base64," preserveAspectRatio="none" style="image-rendering:pixelated;image-rendering:crisp-edges"/>

<path d="M178.0,140.0 L268.0,140.0" stroke="#1F2937" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah1F29371_0)"/>
<text x="223.0" y="122.0" font-size="13.5" fill="#1F2937" text-anchor="middle" dominant-baseline="central" font-weight="bold">+ 随机噪声</text>

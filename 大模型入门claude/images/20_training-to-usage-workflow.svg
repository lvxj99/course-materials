<text x="550.0" y="534.0" font-size="12.5" fill="#6B7280" text-anchor="middle" dominant-baseline="central">后训练的几种方法可以组合：SFT 先教基本行为，偏好优化调整回答质量，可验证奖励提升可判定任务的正确率。</text></svg>

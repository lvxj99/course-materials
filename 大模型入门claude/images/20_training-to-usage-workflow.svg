<text x="44.0" y="390.0" font-size="13.5" fill="#1F2937" text-anchor="start" dominant-baseline="central" font-weight="bold">基础模型：顺着往下续写</text>
<text x="44.0" y="416.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">请解释这段 merge 代码。</text>
<text x="44.0" y="437.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">请解释这段 pivot 代码。</text>
<text x="44.0" y="458.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">第 3 章 习题……</text>
<text x="44.0" y="488.0" font-size="12" fill="#6B7280" text-anchor="start" dominant-baseline="central">像在续写一份习题集</text>
<rect x="310.0" y="368.0" width="220.0" height="140.0" rx="10" fill="#FDEBD8" stroke="#E07B24" stroke-width="1.1" />
<text x="324.0" y="390.0" font-size="13.5" fill="#1F2937" text-anchor="start" dominant-baseline="central" font-weight="bold">指令模型：开始回答问题</text>
<text x="324.0" y="416.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">这行代码先按 a 分组，</text>
<text x="324.0" y="437.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">再对每组的其余列求和，</text>
<text x="324.0" y="458.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">返回一个新表。</text>
<text x="324.0" y="488.0" font-size="12" fill="#6B7280" text-anchor="start" dominant-baseline="central">学会了“问—答”的格式</text>
<rect x="590.0" y="368.0" width="240.0" height="140.0" rx="10" fill="#ECE4FA" stroke="#7B4FC9" stroke-width="1.1" />
<text x="604.0" y="390.0" font-size="13.5" fill="#1F2937" text-anchor="start" dominant-baseline="central" font-weight="bold">可用模型：回答更好、更对</text>
<text x="604.0" y="416.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">先说结论，再给一个小例子；</text>
<text x="604.0" y="437.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">指出 a 会变成索引，</text>
<text x="604.0" y="458.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">代码示例能直接运行。</text>
<text x="604.0" y="488.0" font-size="12" fill="#6B7280" text-anchor="start" dominant-baseline="central">偏好管表达，验证管正确</text>

<text x="860.0" y="79.0" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central" font-weight="bold">可用模型</text>
<text x="30.0" y="136.0" font-size="13" fill="#6B7280" text-anchor="start" dominant-baseline="central" font-weight="bold">数据长什么样</text>
<rect x="30.0" y="148.0" width="220.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
<text x="42.0" y="170.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central" font-family="'Cascadia Mono','Consolas','Menlo','DejaVu Sans Mono',monospace">df.groupby("a").sum() 会把</text>
<text x="42.0" y="192.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">相同 a 值的行合并，再对</text>
<text x="42.0" y="214.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">其余列</text>

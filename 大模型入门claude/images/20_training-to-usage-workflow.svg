<text x="648.0" y="169.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">回答 A 优于 回答 B</text>
<rect x="590.0" y="198.0" width="240.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
<rect x="602.0" y="208.0" width="36.0" height="22.0" rx="8.461538461538462" fill="#D9F1E5" stroke="#2A9D66" stroke-width="1.1" />
<text x="620.0" y="219.0" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central">验证</text>
<text x="648.0" y="219.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">答案对比 / 测试运行：</text>
<text x="786.0" y="219.0" font-size="15" fill="#2A9D66" text-anchor="start" dominant-baseline="central" font-weight="bold">✓</text>
<text x="804.0" y="219.0" font-size="15" fill="#D64545" text-anchor="start" dominant-baseline="central" font-weight="bold">✗</text>
<rect x="890.0" y="148.0" width="180.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
<text x="906.0" y="166.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">· 提示（prompt）</text>
<text x="906.0" y="186.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">· few-shot 示例</text>
<text x="906.0" y="206.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">· 检索资料（RAG）</text>
<text x="906.0" y="226.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">· 更多推理时计算</text>

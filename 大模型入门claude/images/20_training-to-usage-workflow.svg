<rect x="963.0" y="431.0" width="34.0" height="26.0" rx="4" fill="#2A9D66" stroke="none" stroke-width="1.2" />
<text x="980.0" y="476.0" font-size="12.5" fill="#1F2937" text-anchor="middle" dominant-baseline="central">换提示、加资料、多想，</text>

<text x="138.0" y="214.0" font-size="12.5" fill="#1F2937" text-anchor="middle" dominant-baseline="central">求和</text>
<text x="166.0" y="214.0" font-size="12" fill="#C98A00" text-anchor="start" dominant-baseline="central">← 下一个 token</text>
<rect x="310.0" y="148.0" width="220.0" height="92.0" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
<rect x="322.0" y="161.0" width="36.0" height="22.0" rx="8.461538461538462" fill="#EEF0F3" stroke="#6B7280" stroke-width="1.1" />
<text x="340.0" y="172.0" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central">指令</text>
<text x="368.0" y="172.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">解释下面这段 groupby 代码</text>
<rect x="322.0" y="199.0" width="36.0" height="22.0" rx="8.461538461538462" fill="#FDEBD8" stroke="#E07B24" stroke-width="1.1" />
<text x="340.0" y="210.0" font-size="12" fill="#1F2937" text-anchor="middle" dominant-baseline="central">示范</text>
<text x="368.0" y="203.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">这行代码按 a 分组，</text>
<text x="368.0" y="223.0" font-size="12.5" fill="#1F2937" text-anchor="start" dominant-baseline="central">对每组其余列求和……</text>
<rect x="590.0" y="148.0" width="240.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
<rect x="602.0" y="158.0" width="36.0" height="22.0" rx="8.461538461538462" fill="#ECE4FA" stroke="#7B4FC9" stroke-width="1.1" />

<text x="140.0" y="305.2" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="central">交叉熵，自监督</text>
<rect x="310.0" y="270.0" width="220.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#E07B24" stroke-width="1.2" />
<text x="420.0" y="288.6" font-size="13.5" fill="#1F2937" text-anchor="middle" dominant-baseline="central" font-weight="bold">模仿示范答案</text>

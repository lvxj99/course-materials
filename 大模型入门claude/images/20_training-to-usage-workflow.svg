<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="556" viewBox="0 0 1100 556" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC','Hiragino Sans GB',sans-serif" role="img"><title>从预训练、后训练到使用</title><desc>每个训练阶段用不同数据与信号更新权重，使用阶段权重固定。</desc><defs><marker id="ah1F29371_0" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9.0" markerHeight="9.0" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.8 L9.6,5 L0,9.2 L2.6,5 Z" fill="#1F2937"/></marker></defs><rect width="1100" height="556" fill="#FFFFFF"/><path d="M30.0,44.0 L30.0,36.0 L830.0,36.0 L830.0,44.0" stroke="#D64545" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<text x="430.0" y="26.0" font-size="14.5" fill="#D64545" text-anchor="middle" dominant-baseline="central" font-weight="bold">训练：用数据和反馈更新权重</text>

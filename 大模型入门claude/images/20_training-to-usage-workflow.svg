<text x="710.0" y="288.6" font-size="13.5" fill="#1F2937" text-anchor="middle" dominant-baseline="central" font-weight="bold">更好 / 更对的回答更常出现</text>
<text x="710.0" y="305.2" font-size="12" fill="#6B7280" text-anchor="middle" dominant-baseline="central">RLHF+PPO、DPO；RLVR+GRPO</text>

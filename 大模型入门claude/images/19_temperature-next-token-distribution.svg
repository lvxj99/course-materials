<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC','Hiragino Sans GB',sans-serif" role="img"><title>温度与截断采样</title><desc>温度缩放 logits 改变分布的集中程度；top-k 固定候选个数，top-p 固定累计概率。</desc><rect width="1080" height="470" fill="#FFFFFF"/><rect x="20.0" y="20.0" width="540.0" height="430.0" rx="12" fill="#F6F7F9" stroke="#7B4FC9" stroke-width="1.1" />

<text x="901.6" y="490.8" font-size="13.5" fill="#7B4FC9" text-anchor="end" dominant-baseline="central" font-weight="bold"><tspan font-family="'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif" font-style="italic">o</tspan><tspan font-size="9.7" dy="3.8">t</tspan><tspan dy="-3.8" font-size="13.5">​</tspan></text>
<text x="818.0" y="440.0" font-size="12.5" fill="#6B7280" text-anchor="end" dominant-baseline="central">几何直觉：权重非负、和为 1，</text>
<text x="818.0" y="458.1" font-size="12.5" fill="#6B7280" text-anchor="end" dominant-baseline="central">所以输出 <tspan font-family="'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif" font-style="italic">o</tspan><tspan font-size="9.0" dy="3.5">t</tspan><tspan dy="-3.5" font-size="12.5">​</tspan> 是各 Value 的</text>
<text x="818.0" y="476.2" font-size="12.5" fill="#6B7280" text-anchor="end" dominant-baseline="central">加权平均，落在它们围成的区域内。</text></svg>

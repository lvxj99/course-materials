<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">一次注意力读取，究竟汇总了什么？</title><desc id="desc">同一个 Query 与三个 Key 的缩放点积分数为 ln 6、ln 3 和 0。指数化后得到 6∶3∶1，三个 Value 的加权和为 [0.7, 0.7]。</desc><rect x="0" y="0" width="1000" height="410" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">一次注意力读取，究竟汇总了什么？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.4</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="111" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">被读位置</text><text x="198" y="111" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">缩放点积分数</text><text x="407" y="111" font-size="19" font-weight="650" fill="#146f65" text-anchor="start">softmax 权重</text><text x="610" y="111" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">Value 向量</text><text x="820" y="111" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">加权贡献</text><path d="M49 124 L950 124" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="158" font-size="19" font-weight="400" fill="#192d38" text-anchor="start">位置 1</text><text x="210" y="158" font-size="21" font-weight="400" fill="#192d38" text-anchor="start">ln 6</text><rect x="407" y="146" width="94" height="12" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="407" y="146" width="56.4" height="12" rx="2" fill="#146f65" stroke="none" stroke-width="0"/><text x="513" y="158" font-size="19" font-weight="650" fill="#146f65" text-anchor="start">0.6</text><text x="617" y="158" font-size="20" font-weight="400" fill="#192d38" text-anchor="start">[1,  0]</text><text x="820" y="158" font-size="20" font-weight="400" fill="#192d38" text-anchor="start">[0.6,  0.0]</text><path d="M49 172 L950 172" fill="none" stroke="#e3e9e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="210" font-size="19" font-weight="400" fill="#192d38" text-anchor="start">位置 2</text><text x="210" y="210" font-size="21" font-weight="400" fill="#192d38" text-anchor="start">ln 3</text><rect x="407" y="198" width="94" height="12" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="407" y="198" width="28.2" height="12" rx="2" fill="#146f65" stroke="none" stroke-width="0"/><text x="513" y="210" font-size="19" font-weight="650" fill="#146f65" text-anchor="start">0.3</text><text x="617" y="210" font-size="20" font-weight="400" fill="#192d38" text-anchor="start">[0,  2]</text><text x="820" y="210" font-size="20" font-weight="400" fill="#192d38" text-anchor="start">[0.0,  0.6]</text><path d="M49 224 L950 224" fill="none" stroke="#e3e9e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="262" font-size="19" font-weight="400" fill="#192d38" text-anchor="start">位置 3</text><text x="210" y="262" font-size="21" font-weight="400" fill="#192d38" text-anchor="start">0</text><rect x="407" y="250" width="94" height="12" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="407" y="250" width="9.4" height="12" rx="2" fill="#146f65" stroke="none" stroke-width="0"/><text x="513" y="262" font-size="19" font-weight="650" fill="#146f65" text-anchor="start">0.1</text><text x="617" y="262" font-size="20" font-weight="400" fill="#192d38" text-anchor="start">[1,  1]</text><text x="820" y="262" font-size="20" font-weight="400" fill="#192d38" text-anchor="start">[0.1,  0.1]</text><path d="M49 276 L950 276" fill="none" stroke="#e3e9e8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="318" font-size="19" font-weight="400" fill="#536670" text-anchor="start">同一个 Query 比较三个 Key</text><text x="607" y="318" font-size="19" font-weight="600" fill="#192d38" text-anchor="start">输出向量</text><rect x="775" y="287" width="171" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="860.5" y="317.48" font-size="22" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="164">[0.7,  0.7]</text><path d="M34 356 L966 356" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="373" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="389" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">Query 和 Key 决定各位置的权重。沿每一行乘上对应的 Value，再把结果按分量相加。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="546" viewBox="0 0 1000 546" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">翻译时，解码器怎样找到原文？</title><desc id="desc">右列的因果自注意力只读已经给出的译文。交叉注意力另外接收整句原文的表示，为当前译文位置提取信息。</desc><rect x="0" y="0" width="1000" height="546" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">翻译时，解码器怎样找到原文？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.2</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="67" y="99" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">原文 · 编码器</text><text x="628" y="99" font-size="20" font-weight="650" fill="#35638a" text-anchor="start">译文 · 解码器</text><text x="67" y="129" font-size="19" font-weight="400" fill="#192d38" text-anchor="start">I  love  machine  learning</text><text x="628" y="129" font-size="19" font-weight="400" fill="#192d38" text-anchor="start">〈起始〉 我  喜欢  …</text><rect x="67" y="145" width="301" height="35" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="217.5" y="168.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="294">词嵌入 ＋ 位置编码</text><rect x="628" y="145" width="301" height="35" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="778.5" y="168.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="294">右移的译文嵌入 ＋ 位置编码</text><path d="M217 181 L217 201" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="217,208 213.6,200 220.4,200" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M778 181 L778 201" fill="none" stroke="#536670" stroke-width=
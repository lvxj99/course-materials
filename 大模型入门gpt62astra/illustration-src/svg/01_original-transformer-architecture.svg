x="35" y="509" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="525" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">每个注意力或前馈子层都先把输入加回，再做 LayerNorm。这是原始 Transformer 的 Post-Norm。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="493" viewBox="0 0 1000 493" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">RAG 怎样把答案连回资料中的原句？</title><desc id="desc">上排用一份虚构规范说明离线建索引，下排追踪一次提问。回答中的“10 分钟”来自检索命中的 §3.2。读者可以回到这个条款核对数字。</desc><rect x="0" y="0" width="1000" height="493" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">RAG 怎样把答案连回资料中的原句？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 11.5</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="106" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">离线 · 整理资料</text><text x="43" y="277" font-size="20" font-weight="650" fill="#35638a" text-anchor="start">在线 · 回答当前问题</text><rect x="45" y="125" width="183" height="91" rx="4" fill="#ffffff" stroke="#c9d4d5" stroke-width="1.4"/><text x="58" y="154" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">《示例规范》v2</text><path d="M59 171 L135 171" fill="none" stroke="#c9d4d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M59 181 L194 181" fill="none" stroke="#c9d4d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M59 191 L167 191" fill="none" stroke="#c9d4d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M233 171 L265 171" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="272,171 264,174.4 264,167.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="282" y="149" font-size="17" font-weight="400" fill="#536670" text-anchor="start">§2.1  温度校准流程</text><text x="282" y="190" font-size="17" font-weight="600" fill="#146f65" text-anchor="start">§3.2  A 样品保温 10 分钟</text><path d="M507 171 L553 171" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="560,171 552,174.4 552,167.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="565" y="147" width="143" height="47" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="636.5" y="176.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="136">按片段建索引</text><path d="M712 171 L752 171" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="759,171 751,174.4 751,167.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="764" y="145" width="183" height="51" rx="5" fill="#e2f1ec" stroke="#146f65" stroke-width="1.3"/><text x="855.5" y="176.62" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="176">可更新的索引</text><path d="M856 198 L856 248 L368 248 L368 292.3" fill="none" stroke="#146f65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><polygon points="368,299 364.795,291.3 371.205,291.3" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="575" y="238" font-size="15" font-weight="400" fill="#146f65" text-anchor="start">供在线检索</text><rect x="44" y="307" width="195" height="60" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="141.5" y="342.78" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="188">A 样品应保温多久？</text><path d="M242 337 L269 337" fill="none" stroke="#35638a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="276,337 268,340.4 268,333.6" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="280" y="302" width="175" height="70" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="367.5" y="343.12" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="168">检索命中 §3.2</text><path d="M458 337 L485 337" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="492,337 484,340.4 484,333.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="496" y="297" width="227" height="80" rx="5" fill="#e7eff7" stroke="none" stroke-width="0"/><text x="510" y="327" font-size="17" font-weight="600" fill="#35638a" text-anchor="start">上下文 = 问题 ＋</text><text x="510" y="354" font-size="17" font-weight="400" fill="#35638a" text-anchor="start">“A 样品保温 10 分钟”</text><path d="M727 337 L752 337" fill="none" stroke="#35638a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="759,337 751,340.4 751,333.6" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="764" y="297" width="183" height="80" rx="5" fill="#f8ebdf" stroke="none" stroke-width="0"/><text x="856" y="326" font-size="16" font-weight="400" fill="#a14b2a" text-anchor="middle">模型生成回答</text><text x="856" y="355" font-size="18" font-weight="650" fill="#a14b2a" text-anchor="middle">10 分钟［§3.2］</text><path d="M142 369 L142 405 L609 405 L609 386.6" fill="none" stroke="#35638a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><polygon points="609,380 612.14,387.6 605.86,387.6" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="293" y="395" font-size="15" font-weight="400" fill="#35638a" text-anchor="start">原问题随片段一起送入</text><path d="M34 439 L966 439" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="456" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="472" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">文档更新时重新处理受影响的索引条目。提问时把命中的原文与问题一起交给模型，读者可以按条款号核对。</text></svg>
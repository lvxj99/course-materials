<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">每一步只选一个新 token</title><desc id="desc">按词切分的示例，依次选出“我”“喜欢”“学习”和 EOS。蓝框是已有内容，橙框是本步新选中的 token。</desc><rect x="0" y="0" width="1000" height="442" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">每一步只选一个新 token</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.11</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="106" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">生成步</text><text x="179" y="106" font-size="20" font-weight="650" fill="#35638a" text-anchor="start">已经给定的前缀</text><text x="680" y="106" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="start">橙框标出本步的选择</text><text x="49" y="160" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">第 1 步</text><rect x="182" y="135" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="230.5" y="159.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">BOS</text><path d="M282 153 L319 153" fill="none" stroke="#a14b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="326,153 318,156.4 318,149.6" fill="#a14b2a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="330" y="135" width="97" height="37" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="378.5" y="159.62" font-size="18" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="90">我</text><text x="49" y="214" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">第 2 步</text><rect x="182" y="189" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="230.5" y="213.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">BOS</text><rect x="298" y="189" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="346.5" y="213.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">我</text><path d="M398 207 L435 207" fill="none" stroke="#a14b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="442,207 434,210.4 434,203.6" fill="#a14b2a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="446" y="189" width="97" height="37" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="494.5" y="213.62" font-size="18" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="90">喜欢</text><text x="49" y="268" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">第 3 步</text><rect x="182" y="243" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="230.5" y="267.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">BOS</text><rect x="298" y="243" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="346.5" y="267.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">我</text><rect x="414" y="243" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="462.5" y="267.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">喜欢</text><path d="M514 261 L551 261" fill="none" stroke="#a14b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="558,261 550,264.4 550,257.6" fill="#a14b2a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="562" y="243" width="97" height="37" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="610.5" y="267.62" font-size="18" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="90">学习</text><text x="49" y="322" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">第 4 步</text><rect x="182" y="297" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="230.5" y="321.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">BOS</text><rect x="298" y="297" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="346.5" y="321.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">我</text><rect x="414" y="297" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="462.5" y="321.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">喜欢</text><rect x="530" y="297" width="97" height="37" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="578.5" y="321.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="90">学习</text><path d="M630 315 L667 315" fill="none" stroke="#a14b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="674,315 666,318.4 666,311.6" fill="#a14b2a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="678" y="297" width="97" height="37" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="726.5" y="321.62" font-size="18" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="90">EOS</text><text x="787" y="322" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="start">停止</text><text x="47" y="364" font-size="17" font-weight="400" fill="#536670" text-anchor="start">BOS 表示开始，EOS 表示结束。示例采用按词切分的词表。</text><path d="M34 388 L966 388" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="405" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="421" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">当步选出的 token 会进入下一步的前缀。选到结束标记 EOS，或达到长度上限时，生成停止。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="461" viewBox="0 0 1000 461" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">把位置加进向量，或把位置转成角度</title><desc id="desc">左图取正弦位置编码的第一对分量。右图让两个原始单位向量同向，每前进一格多转 20°。两个位置一同平移，夹角仍为 40°。</desc><rect x="0" y="0" width="1000" height="461" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">把位置加进向量，或把位置转成角度</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.8</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M504 88 L504 381" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="107" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">加法位置编码</text><text x="529" y="107" font-size="20" font-weight="650" fill="#35638a" text-anchor="start">旋转位置编码 RoPE</text><text x="40" y="142" font-size="17" font-weight="400" fill="#536670" text-anchor="start">同一个词的内容向量取 [0.20, 0.70]。</text><text x="529" y="142" font-size="17" font-weight="400" fill="#536670" text-anchor="start">令原始 Q、K 都朝右，每个位置转 20°。</text><text x="46" y="193" font-size="17" font-weight="600" fill="#192d38" text-anchor="start">位置</text><text x="137" y="193" font-size="17" font-weight="600" fill="#192d38" text-anchor="start">位置向量 p</text><text x="310" y="193" font-size="17" font-weight="600" fill="#192d38" text-anchor="start">相加后的输入</text><text x="48" y="237" font-size="18" font-weight="600" fill="#192d38" text-anchor="start">t = 0</text><text x="134" y="237" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">[0.00, 1.00]</text><rect x="305" y="211" width="164" height="39" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="387" y="236.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="157">[0.20, 1.70]</text><text x="48" y="290" font-size="18" font-weight="600" fill="#192d38" text-anchor="start">t = 2</text><text x="134" y="290" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">[0.91, -0.42]</text><rect x="305" y="264" width="164" height="39" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="387" y="289.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="157">[1.11, 0.28]</text><text x="43" y="359" font-size="17" font-weight="400" fill="#536670" text-anchor="start">第一对维度取 [sin(t), cos(t)]。</text><circle cx="638" cy="244" r="61" fill="none" stroke="#c9d4d5" stroke-width="1.2"/><path d="M572 244 L704 244" fill="none" stroke="#e3e9e8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M638 308 L638 180" fill="none" stroke="#e3e9e8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M663.3717007612195 234.76545613020696 A27 27 0 0 0 651.5 220.61731409782016" fill="none" stroke="#a14b2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M638 244 L685.924 226.557" fill="none" stroke="#146f65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="693.442,223.821 686.37,230.705 683.599,223.093" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M638 244 L663.5 199.833" fill="none" stroke="#35638a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="667.5,192.905 666.507,202.724 659.493,198.674" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><circle cx="638" cy="244" r="3" fill="#192d38" stroke="none" stroke-width="1"/><text x="638" y="332" font-size="17" font-weight="600" fill="#192d38" text-anchor="middle">Q 在 1，K 在 3</text><text x="638" y="359" font-size="17" font-weight="400" fill="#a14b2a" text-anchor="middle">夹角 40°</text><circle cx="847" cy="244" r="61" fill="none" stroke="#c9d4d5" stroke-width="1.2"/><path d="M781 244 L913 244" fill="none" stroke="#e3e9e8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M847 308 L847 180" fill="none" stroke="#e3e9e8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M860.5 220.61731409782016 A27 27 0 0 0 842.3114992029929 217.4101906686704" fill="none" stroke="#a14b2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M847 244 L872.5 199.833" fill="none" stroke="#146f65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="876.5,192.905 875.507,202.724 868.493,198.674" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M847 244 L838.144 193.775" fill="none" stroke="#35638a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="836.755,185.896 842.306,194.056 834.329,195.463" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><circle cx="847" cy="244" r="3" fill="#192d38" stroke="none" stroke-width="1"/><text x="847" y="332" font-size="17" font-weight="600" fill="#192d38" text-anchor="middle">Q 在 3，K 在 5</text><text x="847" y="359" font-size="17" font-weight="400" fill="#a14b2a" text-anchor="middle">夹角 40°</text><path d="M623 385 L644 385" fill="none" stroke="#146f65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="391" font-size="16" font-weight="400" fill="#146f65" text-anchor="start">Q</text><path d="M760 385 L781 385" fill="none" stroke="#35638a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="789" y="391" font-size="16" font-weight="400" fill="#35638a" text-anchor="start">K</text><path d="M34 407 L966 407" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="424" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="440" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">绝对位置编码改变输入向量。RoPE 在 Q 和 K 的成对维度上做旋转，让点积感知两个位置之差。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="401" viewBox="0 0 1000 401" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">一个 Transformer Block 怎样更新表示？</title><desc id="desc">沿绿色支路读取多头注意力的输入与输出，再沿蓝色支路读 FFN。这里画的是 Pre-Norm，归一化分别位于两个子层之前。</desc><rect x="0" y="0" width="1000" height="401" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">一个 Transformer Block 怎样更新表示？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.9</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="107" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">Pre-Norm · 从左向右读</text><text x="250" y="148" font-size="17" font-weight="400" fill="#146f65" text-anchor="middle">保留输入 H</text><text x="658" y="148" font-size="17" font-weight="400" fill="#35638a" text-anchor="middle">保留中间表示 U</text><path d="M83 226 L83 161 L408 161 L408 199.7" fill="none" stroke="#146f65" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="408,207 404.405,198.7 411.595,198.7" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M509 226 L509 161 L821 161 L821 199.7" fill="none" stroke="#35638a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="821,207 817.405,198.7 824.595,198.7" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="37" y="233" font-size="24" font-weight="650" fill="#192d38" text-anchor="start">H</text><path d="M60 226 L106 226" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="113,226 105,229.4 105,222.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="116" y="205" width="85" height="42" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="158.5" y="232.12" font-size="18" font-weight="600" fill="#536670" text-anchor="middle" data-limit="78">Norm</text><path d="M204 226 L219 226" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="226,226 218,229.4 218,222.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="229" y="205" width="129" height="42" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="293.5" y="232.12" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="122">多头注意力</text><path d="M361 226 L381 226" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="388,226 380,229.4 380,222.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><circle cx="408" cy="226" r="17" fill="#ffffff" stroke="#146f65" stroke-width="2"/><text x="408" y="232" font-size="24" font-weight="400" fill="#146f65" text-anchor="middle">+</text><path d="M426 226 L458 226" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="465,226 457,229.4 457,222.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="479" y="233" font-size="21" font-weight="650" fill="#192d38" text-anchor="middle">U</text><path d="M495 226 L522 226" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="529,226 521,229.4 521,222.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="532" y="205" width="85" height="42" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="574.5" y="232.12" font-size="18" font-weight="600" fill="#536670" text-anchor="middle" data-limit="78">Norm</text><path d="M620 226 L637 226" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="644,226 636,229.4 636,222.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="647" y="205" width="124" height="42" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="709" y="231.78" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="117">逐位置 FFN</text><path d="M774 226 L794 226" fill="none" stroke="#35638a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="801,226 793,229.4 793,222.6" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><circle cx="821" cy="226" r="17" fill="#ffffff" stroke="#35638a" stroke-width="2"/><text x="821" y="232" font-size="24" font-weight="400" fill="#35638a" text-anchor="middle">+</text><path d="M840 226 L866 226" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="873,226 865,229.4 865,222.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="882" y="232" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">下一层 H</text><text x="249" y="292" font-size="18" font-weight="400" fill="#146f65" text-anchor="middle">不同位置之间交换信息</text><text x="669" y="292" font-size="18" font-weight="400" fill="#35638a" text-anchor="middle">各位置分别变换特征</text><text x="480" y="329" font-size="17" font-weight="400" fill="#536670" text-anchor="middle">输入、中间表示和输出都是 T × d。</text><path d="M34 347 L966 347" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="364" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="380" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">两条上方支路都传递原表示。下方计算给出更新量，两者在加号处汇合。每次相加前后的形状相同。</text></svg>
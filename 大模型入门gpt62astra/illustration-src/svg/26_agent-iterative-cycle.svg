<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">工具返回的结果，怎样改变 Agent 的下一步？</title><desc id="desc">示例任务是求表中有效温度的平均值。第一次读表发现一个空值，第二次据此选取 80 和 84 计算，得到 82 ℃。两轮工具调用由实际观察连接。</desc><rect x="0" y="0" width="1000" height="465" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">工具返回的结果，怎样改变 Agent 的下一步？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 11.6</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="105" font-size="18" font-weight="650" fill="#146f65" text-anchor="start">任务目标</text><text x="143" y="105" font-size="18" font-weight="400" fill="#192d38" text-anchor="start">计算表中有效温度的平均值，并报告单位。</text><text x="44" y="156" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">感知当前状态</text><text x="284" y="156" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">判断并规划</text><text x="527" y="156" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">执行工具</text><text x="769" y="156" font-size="19" font-weight="650" fill="#a14b2a" text-anchor="start">观察工具返回</text><rect x="44" y="176" width="186" height="44" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="137" y="203.44" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="179">收到一份温度表</text><path d="M233 198 L272 198" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="279,198 271,201.4 271,194.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="284" y="176" width="186" height="44" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="377" y="203.44" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="179">先弄清表中有哪些值</text><path d="M473 198 L515 198" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="522,198 514,201.4 514,194.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="527" y="176" width="186" height="44" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="620" y="203.44" font-size="16" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="179">读取温度列</text><path d="M716 198 L757 198" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="764,198 756,201.4 756,194.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="769" y="176" width="186" height="44" rx="5" fill="#f8ebdf" stroke="none" stroke-width="1.3"/><text x="862" y="203.44" font-size="16" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="179">80、空值、84 ℃</text><rect x="44" y="284" width="186" height="44" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="137" y="311.44" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="179">发现一个空值</text><path d="M233 306 L272 306" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="279,306 271,309.4 271,302.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="284" y="284" width="186" height="44" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="377" y="311.44" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="179">选取两个有效数值</text><path d="M473 306 L515 306" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="522,306 514,309.4 514,302.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="527" y="284" width="186" height="44" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="620" y="311.44" font-size="16" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="179">计算 (80 + 84) / 2</text><path d="M716 306 L757 306" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="764,306 756,309.4 756,302.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="769" y="284" width="186" height="44" rx="5" fill="#f8ebdf" stroke="none" stroke-width="1.3"/><text x="862" y="311.44" font-size="16" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="179">82 ℃</text><path d="M862 223 L862 253 L137 253 L137 272.9" fill="none" stroke="#a14b2a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><polygon points="137,280 133.535,271.9 140.465,271.9" fill="#a14b2a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="396" y="239" width="209" height="25" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="500" y="258" font-size="16" font-weight="400" fill="#a14b2a" text-anchor="middle">返回值成为下一轮输入</text><path d="M862 331 L862 358 L704 358" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="697,358 705,354.6 705,361.4" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="685" y="364" font-size="17" font-weight="600" fill="#146f65" text-anchor="end">目标已满足，提交结果并结束。</text><path d="M34 411 L966 411" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="428" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="444" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">工具返回值进入下一轮观察。算出的平均值已经满足目标，系统便可结束循环并把结果交给读者。</text></svg>
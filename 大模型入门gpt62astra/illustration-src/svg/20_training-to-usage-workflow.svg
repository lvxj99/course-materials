<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">从训练到使用，同一道题扮演什么角色？</title><desc id="desc">沿“3×4”这个例子看不同信号。语料提供下一个 token，示范提供目标回答，偏好比较或可验证规则提供后训练反馈。后训练方法可按任务组合。</desc><rect x="0" y="0" width="1000" height="465" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">从训练到使用，同一道题扮演什么角色？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 10.1</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="105" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">训练 · 更新参数</text><text x="791" y="105" font-size="20" font-weight="650" fill="#35638a" text-anchor="start">使用 · 固定参数</text><path d="M763 91 L763 374" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><text x="43" y="156" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">预训练</text><text x="266" y="156" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">指令微调</text><text x="509" y="156" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">偏好或可验证反馈</text><text x="788" y="156" font-size="20" font-weight="650" fill="#35638a" text-anchor="start">推理</text><rect x="43" y="177" width="168" height="47" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="127" y="206.96" font-size="19" font-weight="600" fill="#536670" text-anchor="middle" data-limit="161">前缀  3 × 4 =</text><text x="46" y="255" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">语料的下一项为 12</text><rect x="266" y="177" width="188" height="47" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="360" y="206.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="181">问  3 × 4 等于几？</text><rect x="266" y="233" width="188" height="42" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="360" y="259.44" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="181">示范  等于 12</text><rect x="509" y="177" width="210" height="43" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="614" y="203.94" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="203">偏好对 · 哪个回答更清晰</text><rect x="509" y="230" width="210" height="43" rx="5" fill="#f8ebdf" stroke="none" stroke-width="1.3"/><text x="614" y="256.94" font-size="16" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="203">规则 · 数值是否等于 12</text><rect x="788" y="177" width="167" height="45" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="871.5" y="205.28" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="160">新问题  5 × 4？</text><rect x="788" y="237" width="167" height="39" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="871.5" y="262.28" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="160">生成回答  20</text><path d="M214 200 L252 200" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="259,200 251,203.4 251,196.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M457 200 L494 200" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="501,200 493,203.4 493,196.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M722 200 L750 200" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="757,200 749,203.4 749,196.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M871 224 L871 228" fill="none" stroke="#35638a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="871,235 867.6,227 874.4,227" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="43" y="323" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">真实后续</text><text x="43" y="353" font-size="17" font-weight="400" fill="#536670" text-anchor="start">学习续写规律</text><text x="266" y="323" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">示范答案</text><text x="266" y="353" font-size="17" font-weight="400" fill="#536670" text-anchor="start">学习按指令回答</text><text x="509" y="323" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">比较或测试结果</text><text x="509" y="353" font-size="17" font-weight="400" fill="#536670" text-anchor="start">改变回答的倾向</text><text x="788" y="323" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">当前上下文</text><text x="788" y="353" font-size="17" font-weight="400" fill="#536670" text-anchor="start">决定本次任务</text><path d="M34 411 L966 411" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="428" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="444" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">预训练、指令微调和反馈训练把信息写进参数。使用时，当前问题进入上下文，模型凭已有参数生成答案。</text></svg>
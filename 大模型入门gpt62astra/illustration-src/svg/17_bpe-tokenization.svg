<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">BPE 怎样从字母中学到一个子词？</title><desc id="desc">low 出现 4 次、lower 出现 2 次、lot 出现 1 次。首轮 l 和 o 相邻 7 次，下一轮 lo 和 w 相邻 6 次。绿色框标出本轮刚形成的 token。</desc><rect x="0" y="0" width="1000" height="425" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">BPE 怎样从字母中学到一个子词？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 9.1</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">语料与词频</text><text x="191" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">初始符号</text><text x="475" y="110" font-size="18" font-weight="650" fill="#146f65" text-anchor="start">第 1 轮合并</text><text x="761" y="110" font-size="18" font-weight="650" fill="#146f65" text-anchor="start">第 2 轮合并</text><path d="M45 126 L951 126" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="172" font-size="18" font-weight="600" fill="#192d38" text-anchor="start">low  ×  4</text><rect x="191" y="148" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="204.5" y="171.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">l</text><rect x="222" y="148" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="235.5" y="171.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">o</text><rect x="253" y="148" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="266.5" y="171.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">w</text><rect x="475" y="148" width="35" height="35" rx="4" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="492.5" y="171.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="28">lo</text><rect x="514" y="148" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="527.5" y="171.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">w</text><rect x="761" y="148" width="45" height="35" rx="4" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="783.5" y="171.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="38">low</text><text x="47" y="228" font-size="18" font-weight="600" fill="#192d38" text-anchor="start">lower  ×  2</text><rect x="191" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="204.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">l</text><rect x="222" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="235.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">o</text><rect x="253" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="266.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">w</text><rect x="284" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="297.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">e</text><rect x="315" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="328.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">r</text><rect x="475" y="204" width="35" height="35" rx="4" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="492.5" y="227.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="28">lo</text><rect x="514" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="527.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">w</text><rect x="545" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="558.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">e</text><rect x="576" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="589.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">r</text><rect x="761" y="204" width="45" height="35" rx="4" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="783.5" y="227.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="38">low</text><rect x="810" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="823.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">e</text><rect x="841" y="204" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="854.5" y="227.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">r</text><text x="47" y="284" font-size="18" font-weight="600" fill="#192d38" text-anchor="start">lot  ×  1</text><rect x="191" y="260" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="204.5" y="283.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">l</text><rect x="222" y="260" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="235.5" y="283.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">o</text><rect x="253" y="260" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="266.5" y="283.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">t</text><rect x="475" y="260" width="35" height="35" rx="4" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="492.5" y="283.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="28">lo</text><rect x="514" y="260" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="527.5" y="283.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">t</text><rect x="761" y="260" width="35" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="778.5" y="283.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="28">lo</text><rect x="800" y="260" width="27" height="35" rx="4" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="813.5" y="283.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="20">t</text><text x="48" y="337" font-size="17" font-weight="400" fill="#536670" text-anchor="start">统计时计入词频</text><text x="473" y="337" font-size="17" font-weight="400" fill="#146f65" text-anchor="start">l + o 共出现 7 次</text><text x="759" y="337" font-size="17" font-weight="400" fill="#146f65" text-anchor="start">lo + w 共出现 6 次</text><path d="M34 371 L966 371" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="388" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="404" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">每一轮都按词频重新统计相邻符号对。在这个小语料里，先学得 lo，再把 lo 和 w 合并成 low。</text></svg>
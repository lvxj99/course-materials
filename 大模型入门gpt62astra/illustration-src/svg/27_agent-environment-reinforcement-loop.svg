<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435" viewBox="0 0 1000 435" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">走一步之后，奖励和新状态从哪里来？</title><desc id="desc">格子例中，从第 2 格向右走到第 3 格，当前奖励为 0。再向右进入终点才得到 +1。动作发生在 t，图中的反馈记为 rₜ₊₁，与后文回报公式一致。</desc><rect x="0" y="0" width="1000" height="435" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">走一步之后，奖励和新状态从哪里来？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 8.8</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="110" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">智能体</text><text x="694" y="110" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">环境</text><rect x="43" y="137" width="237" height="118" rx="8" fill="#e2f1ec" stroke="#146f65" stroke-width="1.4"/><text x="63" y="176" font-size="19" font-weight="600" fill="#146f65" text-anchor="start">读取状态 sₜ</text><text x="63" y="219" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">按策略 π(a | sₜ) 选动作</text><rect x="689" y="137" width="266" height="118" rx="8" fill="#e7eff7" stroke="#35638a" stroke-width="1.4"/><text x="708" y="176" font-size="19" font-weight="600" fill="#35638a" text-anchor="start">执行动作，更新位置</text><text x="708" y="219" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">返回状态和这一步的奖励</text><path d="M285 161 L676.5 161" fill="none" stroke="#146f65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="684,161 675.5,164.725 675.5,157.275" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="481" y="145" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle">动作 aₜ · 向右走</text><path d="M684 229 L292.5 229" fill="none" stroke="#35638a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="285,229 293.5,225.275 293.5,232.725" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><text x="484" y="216" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle">新状态 sₜ₊₁，奖励 rₜ₊₁</text><text x="48" y="322" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">一次转移</text><rect x="177" y="296" width="108" height="43" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="231" y="323.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="101">第 1 格</text><rect x="294" y="296" width="108" height="43" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="348" y="323.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="101">起点 2</text><rect x="411" y="296" width="108" height="43" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="465" y="323.28" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="101">到达 3</text><rect x="528" y="296" width="108" height="43" rx="5" fill="#f8ebdf" stroke="none" stroke-width="1.3"/><text x="582" y="323.28" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="101">终点 4</text><text x="682" y="313" font-size="18" font-weight="600" fill="#192d38" text-anchor="start">本步奖励 0</text><text x="682" y="345" font-size="16" font-weight="400" fill="#536670" text-anchor="start">下步若进入终点，奖励 +1。</text><path d="M34 381 L966 381" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="398" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="414" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">策略根据当前状态选择动作，环境在动作之后给出奖励和新状态。反复交互形成一条轨迹。</text></svg>
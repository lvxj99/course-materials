<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="438" viewBox="0 0 1000 438" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">token 的编号怎样变成输入向量？</title><desc id="desc">示例词表把“温度上升”切成两个 token，编号依次为 2 和 0。按这个顺序读取嵌入表的第 2 行和第 0 行，得到右侧的 2×3 矩阵。行号从 0 开始。</desc><rect x="0" y="0" width="1000" height="438" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">token 的编号怎样变成输入向量？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 9.2</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="105" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">文字 → token → ID</text><text x="48" y="165" font-size="29" font-weight="650" fill="#192d38" text-anchor="start">温度上升</text><rect x="46" y="199" width="77" height="38" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="84.5" y="224.12" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="70">温度</text><rect x="132" y="199" width="77" height="38" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="170.5" y="224.12" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="70">上升</text><path d="M84 241 L84 256" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="84,263 80.6,255 87.4,255" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="59" y="267" width="50" height="35" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="84" y="290.62" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="43">2</text><path d="M170 241 L170 256" fill="none" stroke="#35638a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="170,263 166.6,255 173.4,255" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="145" y="267" width="50" height="35" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="170" y="290.62" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="43">0</text><text x="45" y="352" font-size="16" font-weight="400" fill="#536670" text-anchor="start">本图采用一个示例词表。</text><path d="M250 92 L250 367" fill="none" stroke="#e3e9e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="277" y="105" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">嵌入表 E</text><text x="301" y="153" font-size="16" font-weight="600" fill="#536670" text-anchor="middle">ID</text><text x="365" y="153" font-size="16" font-weight="600" fill="#536670" text-anchor="middle">token</text><text x="447" y="153" font-size="16" font-weight="600" fill="#536670" text-anchor="middle">维 1</text><text x="505" y="153" font-size="16" font-weight="600" fill="#536670" text-anchor="middle">维 2</text><text x="563" y="153" font-size="16" font-weight="600" fill="#536670" text-anchor="middle">维 3</text><rect x="277" y="170" width="314" height="40" rx="3" fill="#e7eff7" stroke="none" stroke-width="0"/><text x="301" y="196" font-size="17" font-weight="650" fill="#35638a" text-anchor="middle">0</text><text x="365" y="196" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">上升</text><text x="447" y="196" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.1</text><text x="505" y="196" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.8</text><text x="563" y="196" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">−0.2</text><rect x="277" y="222" width="314" height="40" rx="3" fill="#eff2f1" stroke="none" stroke-width="0"/><text x="301" y="248" font-size="17" font-weight="650" fill="#536670" text-anchor="middle">1</text><text x="365" y="248" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">下降</text><text x="447" y="248" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.3</text><text x="505" y="248" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">−0.7</text><text x="563" y="248" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.2</text><rect x="277" y="274" width="314" height="40" rx="3" fill="#e2f1ec" stroke="none" stroke-width="0"/><text x="301" y="300" font-size="17" font-weight="650" fill="#146f65" text-anchor="middle">2</text><text x="365" y="300" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">温度</text><text x="447" y="300" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.6</text><text x="505" y="300" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.1</text><text x="563" y="300" font-size="17" font-weight="400" fill="#192d38" text-anchor="middle">0.4</text><path d="M615 92 L615 367" fill="none" stroke="#e3e9e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="645" y="105" font-size="20" font-weight="650" fill="#146f65" text-anchor="start">按 ID 顺序排列的输入 X</text><text x="648" y="203" font-size="18" font-weight="650" fill="#146f65" text-anchor="start">E[2]</text><rect x="718" y="174" width="68" height="43" rx="1" fill="#e2f1ec" stroke="#ffffff" stroke-width="1.5"/><text x="752" y="201.96" font-size="19" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="64">0.6</text><rect x="788" y="174" width="68" height="43" rx="1" fill="#e2f1ec" stroke="#ffffff" stroke-width="1.5"/><text x="822" y="201.96" font-size="19" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="64">0.1</text><rect x="858" y="174" width="68" height="43" rx="1" fill="#e2f1ec" stroke="#ffffff" stroke-width="1.5"/><text x="892" y="201.96" font-size="19" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="64">0.4</text><text x="648" y="275" font-size="18" font-weight="650" fill="#35638a" text-anchor="start">E[0]</text><rect x="718" y="246" width="68" height="43" rx="1" fill="#e7eff7" stroke="#ffffff" stroke-width="1.5"/><text x="752" y="273.96" font-size="19" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="64">0.1</text><rect x="788" y="246" width="68" height="43" rx="1" fill="#e7eff7" stroke="#ffffff" stroke-width="1.5"/><text x="822" y="273.96" font-size="19" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="64">0.8</text><rect x="858" y="246" width="68" height="43" rx="1" fill="#e7eff7" stroke="#ffffff" stroke-width="1.5"/><text x="892" y="273.96" font-size="19" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="64">−0.2</text><text x="644" y="352" font-size="16" font-weight="400" fill="#536670" text-anchor="start">序列长度 T = 2，向量维数 d = 3。</text><path d="M34 384 L966 384" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="401" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="417" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">token ID 是查表用的行号。按原序取出对应向量并堆成矩阵，两个 token 就得到两行表示。</text></svg>
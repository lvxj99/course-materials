ke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="276" font-size="18" font-weight="600" fill="#146f65" text-anchor="start">E3</text><rect x="286" y="262" width="95" height="15" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="286" y="262" width="22.8" height="15" rx="2" fill="#146f65" stroke="none" stroke-width="0"/><text x="394" y="276" font-size="18" font-weight="400" fill="#146f65" text-anchor="start">0.24</text><path d="M447 269 L503.8 269" fill="none" stroke="#146f65" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="511,269 502.8,272.53 502.8,265.47" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="516" y="250" width="149" height="39" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="590.5" y="275.28" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="142">专家 E3 · 执行</text><text x="682" y="275" font-size="16" font-weight="400" fill="#146f65" text-anchor="start">0, 2</text><path d="M723 269 L754 269 L754 244 L795 244" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="802,244 794,247.4 794,240.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M208 325 L226 325" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="331" font-size="18" font-weight="600" fill="#536670" text-anchor="start">E4</text><rect x="286" y="317" width="95" height="15" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="286" y="317" width="7.6" height="15" rx="2" fill="#adbaba" stroke="none" stroke-width="0"/><text x="394" y="331" font-size="18" font-weight="400" fill="#536670" text-anchor="start">0.08</text><rect x="516" y="305" width="149" height="39" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="590.5" y="330.28" font-size="17" font-weight="600" fill="#536670" text-anchor="middle" data-limit="142">专家 E4 · 跳过</text><rect x="807" y="196" width="145" height="62" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="879.5" y="234.14" font-size="21" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="138">[1.4, 0.6]</text><text x="806" y="287" font-size="16" font-weight="400" fill="#a14b2a" text-anchor="start">0.70 E1 + 0.30 E3</text><text x="44" y="379" font-size="17" font-weight="400" fill="#536670" text-anchor="start">所有专家的参数都保存在模型中，路由选择按 token 进行。</text><path d="M34 403 L966 403" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="420" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="436" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">本例只执行 E1 和 E3。按选中专家的归一化权重混合输出，再把这个 token 的新向量传给下一层。</text></svg>
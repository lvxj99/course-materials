<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="457" viewBox="0 0 1000 457" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">一个 token 在 MoE 层到底调用了谁？</title><desc id="desc">路由器给四个专家打分，Top-2 选出 0.56 和 0.24。重新归一化得到 0.70 和 0.30，因此 [2,0] 与 [0,2] 的加权结果为 [1.4,0.6]。</desc><rect x="0" y="0" width="1000" height="457" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">一个 token 在 MoE 层到底调用了谁？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 11.3</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="109" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">当前 token</text><text x="235" y="109" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">路由器分数</text><text x="522" y="109" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">本步的专家网络</text><text x="804" y="109" font-size="19" font-weight="650" fill="#192d38" text-anchor="start">加权汇总</text><rect x="42" y="218" width="106" height="47" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="95" y="247.96" font-size="19" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="99">向量 h</text><path d="M152 241 L196 241" fill="none" stroke="#35638a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="203,241 195,244.4 195,237.6" fill="#35638a" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M208 159 L208 324" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 160 L226 160" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="166" font-size="18" fo
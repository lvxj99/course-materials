<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">KV cache 在哪一步省下了计算？</title><desc id="desc">沿一列向下看，同一位置的 K、V 在后续步中被复用。最后一列选出的词要到下一次送入模型时，才会在本层拥有自己的缓存条目。</desc><rect x="0" y="0" width="1000" height="455" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">KV cache 在哪一步省下了计算？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.12</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">本层的一次前向计算</text><text x="307" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">缓存中的位置</text><text x="832" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">选出的下个词</text><text x="339" y="146" font-size="18" font-weight="400" fill="#192d38" text-anchor="middle">我</text><text x="440" y="146" font-size="18" font-weight="400" fill="#192d38" text-anchor="middle">喜欢</text><text x="541" y="146" font-size="18" font-weight="400" fill="#192d38" text-anchor="middle">机器</text><text x="642" y="146" font-size="18" font-weight="400" fill="#192d38" text-anchor="middle">学习</text><text x="743" y="146" font-size="18" font-weight="400" fill="#192d38" text-anchor="middle">。</text><text x="41" y="183" font-size="20" font-weight="600" fill="#192d38" text-anchor="start">预填充</text><text x="41" y="208" font-size="16" font-weight="400" fill="#536670" text-anchor="start">一次读入三个提示词</text><rect x="294" y="164" width="90" height="46" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="339" y="192.78" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="83">K1  V1</text><rect x="395" y="164" width="90" height="46" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="440" y="192.78" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="83">K2  V2</text><rect x="496" y="164" width="90" height="46" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="541" y="192.78" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="83">K3  V3</text><path d="M590 187 L819 187" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="826,187 818,190.4 818,183.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="832" y="164" width="99" height="46" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="881.5" y="193.12" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="92">学习</text><text x="41" y="252" font-size="20" font-weight="600" fill="#192d38" text-anchor="start">解码第 1 步</text><text x="41" y="277" font-size="16" font-weight="400" fill="#536670" text-anchor="start">新输入为“学习”</text><rect x="294" y="233" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="339" y="261.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K1  V1</text><rect x="395" y="233" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="440" y="261.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K2  V2</text><rect x="496" y="233" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="541" y="261.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K3  V3</text><rect x="597" y="233" width="90" height="46" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="642" y="261.78" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="83">K4  V4</text><path d="M691 256 L819 256" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="826,256 818,259.4 818,252.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="832" y="233" width="99" height="46" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="881.5" y="262.12" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="92">。</text><text x="41" y="321" font-size="20" font-weight="600" fill="#192d38" text-anchor="start">解码第 2 步</text><text x="41" y="346" font-size="16" font-weight="400" fill="#536670" text-anchor="start">新输入为“。”</text><rect x="294" y="302" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="339" y="330.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K1  V1</text><rect x="395" y="302" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="440" y="330.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K2  V2</text><rect x="496" y="302" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="541" y="330.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K3  V3</text><rect x="597" y="302" width="90" height="46" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="642" y="330.78" font-size="17" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="83">K4  V4</text><rect x="698" y="302" width="90" height="46" rx="5" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1.3"/><text x="743" y="330.78" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="83">K5  V5</text><path d="M792 325 L819 325" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="826,325 818,328.4 818,321.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="832" y="302" width="99" height="46" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="881.5" y="331.12" font-size="18" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="92">EOS</text><rect x="294" y="373" width="15" height="15" rx="0" fill="#f8ebdf" stroke="#a14b2a" stroke-width="1"/><text x="318" y="386" font-size="16" font-weight="400" fill="#a14b2a" text-anchor="start">本步新算并写入</text><rect x="531" y="373" width="15" height="15" rx="0" fill="#e2f1ec" stroke="#146f65" stroke-width="1"/><text x="555" y="386" font-size="16" font-weight="400" fill="#146f65" text-anchor="start">从历史缓存读取</text><path d="M34 401 L966 401" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="418" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="434" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">预填充并行处理提示。逐步解码时，只为新位置计算 Q、K、V，并用新 Q 读取本层截至当前位置的全部 K、V。</text></svg>
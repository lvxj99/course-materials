<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="471" viewBox="0 0 1000 471" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">同一个上下文窗口里，谁占了多少位置？</title><desc id="desc">上排的输入和输出预留刚好占满窗口。下排把检索片段从 3,072 增到 4,096，合计变成 9,216。若其余输入都要保留，输出预留只能降到 1,536。</desc><rect x="0" y="0" width="1000" height="471" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">同一个上下文窗口里，谁占了多少位置？</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 11.4</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="47" y="91" width="15" height="15" rx="0" fill="#dbe4e9" stroke="#5f798a" stroke-width="1"/><text x="71" y="105" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">系统提示</text><rect x="226" y="91" width="15" height="15" rx="0" fill="#d8e7f4" stroke="#4875a2" stroke-width="1"/><text x="250" y="105" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">对话历史</text><rect x="405" y="91" width="15" height="15" rx="0" fill="#c3e2d7" stroke="#146f65" stroke-width="1"/><text x="429" y="105" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">检索片段</text><rect x="584" y="91" width="15" height="15" rx="0" fill="#e9dfec" stroke="#7c648c" stroke-width="1"/><text x="608" y="105" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">当前问题</text><rect x="763" y="91" width="15" height="15" rx="0" fill="#f3ddcb" stroke="#a14b2a" stroke-width="1"/><text x="787" y="105" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">输出预留</text><text x="47" y="157" font-size="20" font-weight="650" fill="#192d38" text-anchor="start">原请求</text><text x="47" y="268" font-size="20" font-weight="650" fill="#192d38" text-anchor="start">再加入 1,024 个检索 token</text><rect x="48" y="176" width="49.889" height="42" rx="0" fill="#dbe4e9" stroke="#ffffff" stroke-width="2"/><text x="72.944" y="203" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">512</text><rect x="97.889" y="176" width="149.667" height="42" rx="0" fill="#d8e7f4" stroke="#ffffff" stroke-width="2"/><text x="172.722" y="203" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">1,536</text><rect x="247.556" y="176" width="299.333" height="42" rx="0" fill="#c3e2d7" stroke="#ffffff" stroke-width="2"/><text x="397.222" y="203" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">3,072</text><rect x="546.889" y="176" width="49.889" height="42" rx="0" fill="#e9dfec" stroke="#ffffff" stroke-width="2"/><text x="571.833" y="203" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">512</text><rect x="596.778" y="176" width="249.444" height="42" rx="0" fill="#f3ddcb" stroke="#ffffff" stroke-width="2"/><text x="721.5" y="203" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">2,560</text><rect x="48" y="286" width="49.889" height="42" rx="0" fill="#dbe4e9" stroke="#ffffff" stroke-width="2"/><text x="72.944" y="313" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">512</text><rect x="97.889" y="286" width="149.667" height="42" rx="0" fill="#d8e7f4" stroke="#ffffff" stroke-width="2"/><text x="172.722" y="313" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">1,536</text><rect x="247.556" y="286" width="399.111" height="42" rx="0" fill="#c3e2d7" stroke="#ffffff" stroke-width="2"/><text x="447.111" y="313" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">4,096</text><rect x="646.667" y="286" width="49.889" height="42" rx="0" fill="#e9dfec" stroke="#ffffff" stroke-width="2"/><text x="671.611" y="313" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">512</text><rect x="696.556" y="286" width="249.444" height="42" rx="0" fill="#f3ddcb" stroke="#ffffff" stroke-width="2"/><text x="821.278" y="313" font-size="16" font-weight="600" fill="#192d38" text-anchor="middle">2,560</text><path d="M846.222 148 L846.222 337" fill="none" stroke="#a14b2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="839.222" y="149" font-size="18" font-weight="650" fill="#a14b2a" text-anchor="end">窗口上限 8,192</text><path d="M846.2222222222222 340v8H946v-8" fill="none" stroke="#a14b2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="896.111" y="372" font-size="16" font-weight="650" fill="#a14b2a" text-anchor="middle">超出 1,024</text><text x="48" y="395" font-size="16" font-weight="400" fill="#536670" text-anchor="start">图中单位均为 token。输出预留表示本次允许生成的最大长度。</text><path d="M34 417 L966 417" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="434" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="450" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">在 8,192 个 token 的窗口里多放 1,024 个检索 token，就必须从其他部分腾出同样多的位置。</text></svg>
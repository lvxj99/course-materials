size="26" font-weight="400" fill="#192d38" text-anchor="middle">=</text><text x="43" y="330" font-size="17" font-weight="400" fill="#536670" text-anchor="start">例中所有位置都可见，分数矩阵为 QKᵀ / √2。</text><path d="M34 355 L966 355" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="372" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="388" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">权重矩阵的每一行对应一个查询位置。它有几行，输出就有几个位置。Value 的列数决定输出宽度。</text></svg>
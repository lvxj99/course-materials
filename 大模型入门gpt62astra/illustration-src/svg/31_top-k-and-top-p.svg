<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="471" viewBox="0 0 1000 471" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">top-k 数个数，top-p 累加概率</title><desc id="desc">分别使用 top-k（k = 2）和 top-p（p = 0.80）。集中分布的 A 已占 82%，单独就达到 top-p 阈值。平缓分布前三项只有 71%，加上 D 才达到 87%。top-k 在两种情况下都保留两个词。</desc><rect x="0" y="0" width="1000" height="471" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">top-k 数个数，top-p 累加概率</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 9.4</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="108" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">候选词</text><text x="170" y="108" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">按概率降序排列</text><text x="558" y="108" font-size="19" font-weight="650" fill="#35638a" text-anchor="start">top-k · k = 2</text><text x="755" y="108" font-size="19" font-weight="650" fill="#a14b2a" text-anchor="start">top-p · p = 0.80</text><text x="40" y="185" font-size="19" font-weight="600" fill="#192d38" text-anchor="start">集中分布</text><text x="197" y="156" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">A</text><rect x="168" y="165" width="59" height="35" rx="1" fill="#77aaa4" stroke="#ffffff" stroke-width="1.5"/><text x="197.5" y="187.94" font-size="16" font-weight="500" fill="#ffffff" text-anchor="middle" data-limit="55">0.82</text><text x="264" y="156" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">B</text><rect x="235" y="165" width="59" height="35" rx="1" fill="#e3ebe9" stroke="#ffffff" stroke-width="1.5"/><text x="264.5" y="187.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.08</text><text x="331" y="156" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">C</text><rect x="302" y="165" width="59" height="35" rx="1" fill="#e8eeec" stroke="#ffffff" stroke-width="1.5"/><text x="331.5" y="187.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.05</text><text x="398" y="156" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">D</text><rect x="369" y="165" width="59" height="35" rx="1" fill="#ebefee" stroke="#ffffff" stroke-width="1.5"/><text x="398.5" y="187.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.03</text><text x="465" y="156" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">E</text><rect x="436" y="165" width="59" height="35" rx="1" fill="#ecf0ef" stroke="#ffffff" stroke-width="1.5"/><text x="465.5" y="187.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.02</text><rect x="556" y="164" width="131" height="39" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="621.5" y="189.28" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="124">A、B</text><text x="556" y="229" font-size="16" font-weight="400" fill="#35638a" text-anchor="start">保留 2 项</text><rect x="751" y="164" width="195" height="39" rx="5" fill="#f8ebdf" stroke="none" stroke-width="1.3"/><text x="848.5" y="189.28" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="188">A</text><text x="751" y="229" font-size="16" font-weight="400" fill="#a14b2a" text-anchor="start">累计 82%，保留 1 项</text><path d="M40 245 L950 245" fill="none" stroke="#e3e9e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="308" font-size="19" font-weight="600" fill="#192d38" text-anchor="start">平缓分布</text><text x="197" y="279" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">A</text><rect x="168" y="288" width="59" height="35" rx="1" fill="#c7dad8" stroke="#ffffff" stroke-width="1.5"/><text x="197.5" y="310.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.27</text><text x="264" y="279" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">B</text><rect x="235" y="288" width="59" height="35" rx="1" fill="#ccddda" stroke="#ffffff" stroke-width="1.5"/><text x="264.5" y="310.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.24</text><text x="331" y="279" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">C</text><rect x="302" y="288" width="59" height="35" rx="1" fill="#d2e0de" stroke="#ffffff" stroke-width="1.5"/><text x="331.5" y="310.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.20</text><text x="398" y="279" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">D</text><rect x="369" y="288" width="59" height="35" rx="1" fill="#d8e4e2" stroke="#ffffff" stroke-width="1.5"/><text x="398.5" y="310.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.16</text><text x="465" y="279" font-size="16" font-weight="400" fill="#536670" text-anchor="middle">E</text><rect x="436" y="288" width="59" height="35" rx="1" fill="#dce7e5" stroke="#ffffff" stroke-width="1.5"/><text x="465.5" y="310.94" font-size="16" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="55">0.13</text><rect x="556" y="287" width="131" height="39" rx="5" fill="#e7eff7" stroke="none" stroke-width="1.3"/><text x="621.5" y="312.28" font-size="17" font-weight="600" fill="#35638a" text-anchor="middle" data-limit="124">A、B</text><text x="556" y="352" font-size="16" font-weight="400" fill="#35638a" text-anchor="start">保留 2 项</text><rect x="751" y="287" width="195" height="39" rx="5" fill="#f8ebdf" stroke="none" stroke-width="1.3"/><text x="848.5" y="312.28" font-size="17" font-weight="600" fill="#a14b2a" text-anchor="middle" data-limit="188">A、B、C、D</text><text x="751" y="352" font-size="16" font-weight="400" fill="#a14b2a" text-anchor="start">累计 87%，保留 4 项</text><text x="44" y="391" font-size="17" font-weight="400" fill="#536670" text-anchor="start">平缓分布采用 top-p 后，A 的采样概率为 0.27 / 0.87 ≈ 31%。</text><path d="M34 417 L966 417" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="434" width="4" height="19" rx="0" fill="#146f65" stroke="none" stroke-width="1"/><text x="51" y="450" font-size="18" font-weight="530" fill="#192d38" text-anchor="start" data-limit="914">top-p 按概率从高到低累加，保留首次达到阈值的最短前缀。两种截断都要把保留的概率重新归一化。</text></svg>
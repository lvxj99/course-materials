<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">温度改变的是概率分布的形状</title><desc id="desc">假设在温度 1 时，“上升、下降、波动”的概率分别为 0.7、0.2、0.1。每一列都用同一组 logits 除以该列温度，再做 softmax。三个图共用 0–100% 的刻度。</desc><rect x="0" y="0" width="1000" height="416" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">温度改变的是概率分布的形状</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 9.3</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="104" font-size="17" font-weight="400" fill="#536670" text-anchor="start">上下文为“温度正在…”，假设只有以下三个候选词。</text><text x="42" y="150" font-size="22" font-weight="650" fill="#146f65" text-anchor="start">τ = 0.5</text><text x="127" y="150" font-size="18" font-weight="400" fill="#536670" text-anchor="start">低温</text><text x="42" y="192" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">上升</text><rect x="103" y="175" width="176" height="19" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="103" y="175" width="159.704" height="19" rx="2" fill="#146f65" stroke="none" stroke-width="0"/><text x="341" y="192" font-size="17" font-weight="600" fill="#192d38" text-anchor="end">90.7%</text><text x="42" y="238" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">下降</text><rect x="103" y="221" width="176" height="19" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="103" y="221" width="13.037" height="19" rx="2" fill="#558497" stroke="none" stroke-width="0"/><text x="341" y="238" font-size="17" font-weight="600" fill="#192d38" text-anchor="end">7.4%</text><text x="42" y="284" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">波动</text><rect x="103" y="267" width="176" height="19" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="103" y="267" width="3.259" height="19" rx="2" fill="#8999a2" stroke="none" stroke-width="0"/><text x="341" y="284" font-size="17" font-weight="600" fill="#192d38" text-anchor="end">1.9%</text><path d="M103 309 L279 309" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M103 306 L103 313" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="333" font-size="14" font-weight="400" fill="#536670" text-anchor="middle">0%</text><path d="M191 306 L191 313" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="191" y="333" font-size="14" font-weight="400" fill="#536670" text-anchor="middle">50%</text><path d="M279 306 L279 313" fill="none" stroke="#c9d4d5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="279" y="333" font-size="14" font-weight="400" fill="#536670" text-anchor="middle">100%</text><text x="361" y="150" font-size="22" font-weight="650" fill="#146f65" text-anchor="start">τ = 1</text><text x="446" y="150" font-size="18" font-weight="400" fill="#536670" text-anchor="start">基准</text><text x="361" y="192" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">上升</text><rect x="422" y="175" width="176" height="19" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="422" y="175" width="123.2" height="19" rx="2" fill="#146f65" stroke="none" stroke-width="0"/><text x="660" y="192" font-size="17" font-weight="600" fill="#192d38" text-anchor="end">70.0%</text><text x="361" y="238" font-size="17" font-weight="400" fill="#192d38" text-anchor="start">下降</text><rect x="422" y="221" width="176" height="19" rx="2" fill="#eff2f1" stroke="none" stroke-width="0"/><rect x="422" y="221" width="35.2" height="19" rx="2
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="418" viewBox="0 0 1000 418" role="img" aria-labelledby="title desc" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Cambria Math, sans-serif"><title id="title">两个头可以从同一句话读出不同的信息</title><desc id="desc">例中仅展开一个查询位置。两个头分配不同的示意权重，各自得到一个二维向量。拼接得到四个分量，输出投影再混合这四个分量。</desc><rect x="0" y="0" width="1000" height="418" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="34" y="45" font-size="31" font-weight="700" fill="#192d38" text-anchor="start" data-limit="840">两个头可以从同一句话读出不同的信息</text><text x="966" y="43" font-size="17" font-weight="600" fill="#536670" text-anchor="end" data-limit="100">图 7.7</text><path d="M34 65 L966 65" fill="none" stroke="#c9d4d5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="39" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">同一输入</text><text x="210" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">各头独立投影</text><text x="420" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">三个位置的权重</text><text x="641" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">读取结果</text><text x="829" y="110" font-size="18" font-weight="650" fill="#192d38" text-anchor="start">拼接并投影</text><rect x="42" y="191" width="105" height="52" rx="5" fill="#eff2f1" stroke="none" stroke-width="1.3"/><text x="94.5" y="223.8" font-size="20" font-weight="600" fill="#536670" text-anchor="middle" data-limit="98">输入 X</text><path d="M148 217 L172 217 L172 166" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 217 L172 265 L195 265" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="202,265 194,268.4 194,261.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><path d="M172 166 L195 166" fill="none" stroke="#536670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="202,166 194,169.4 194,162.6" fill="#536670" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="206" y="144" width="160" height="43" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="286" y="170.94" font-size="16" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="153">头 1 的 Q / K / V</text><path d="M368 165 L404 165" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="411,165 403,168.4 403,161.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="416" y="144" width="49" height="43" rx="1" fill="#7caea8" stroke="#ffffff" stroke-width="1.5"/><text x="440.5" y="171.28" font-size="17" font-weight="500" fill="#ffffff" text-anchor="middle" data-limit="45">0.6</text><rect x="467" y="144" width="49" height="43" rx="1" fill="#b9d3cf" stroke="#ffffff" stroke-width="1.5"/><text x="491.5" y="171.28" font-size="17" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="45">0.3</text><rect x="518" y="144" width="49" height="43" rx="1" fill="#e2ece9" stroke="#ffffff" stroke-width="1.5"/><text x="542.5" y="171.28" font-size="17" font-weight="500" fill="#192d38" text-anchor="middle" data-limit="45">0.1</text><path d="M572 165 L620 165" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="627,165 619,168.4 619,161.6" fill="#146f65" stroke="none" stroke-width="1" stroke-linejoin="round"/><rect x="631" y="144" width="120" height="43" rx="5" fill="#e2f1ec" stroke="none" stroke-width="1.3"/><text x="691" y="171.62" font-size="18" font-weight="600" fill="#146f65" text-anchor="middle" data-limit="113">[0.7, 0.7]</text><path d="M753 165 L781 165 L781 202 L805 202" fill="none" stroke="#146f65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="812,202 804,205.4 804,198.6" fill="#146f65" stroke="none" stroke-width=
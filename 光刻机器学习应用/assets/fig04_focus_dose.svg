<title id="title">Focus 与 Dose：多测一个信号，何时才有帮助？</title><desc id="desc">左图用二次离焦和线性剂量的教学模型展示同一CD对应多个Focus Dose组合。右图在原点附近用两个线性响应的等值线交点说明局部可辨识性。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"><title>光刻机器学习：沿工艺链看输入、输出与反馈</title><desc>读图顺序：先沿上方工艺流程向右，再看量测结果怎样回到后续工艺。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1200" height="100%" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183247} .small{font-size:18px}.body{font-size:21px}.head{font-size:24px;font-weight:600}</style><text x="40" y="48" font-size="30" text-anchor="start" font-weight="700">光刻机器学习：沿工艺链看输入、输出与反馈</text><text x="40" y="84" font-size="19" text-anchor="start" font-weight="400" style="fill:#526477">读图顺序：先沿上方工艺流程向右，再看量测结果怎样回到后续工艺。</text><rect x="40" y="150" width="192" height="100" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="136.0" y="182" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">设计版图</text><text x="136.0" y="214" font-size="18" text-anchor="middle" font-weight="400">目标边缘与结构</text><line x1="234" y1="200" x2="266" y2="200" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><rect x="272" y="150" width="192" height="100" rx="12" fill="#eef4ff" stroke="#dbe3ec"/><text x="368.0" y="182" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">计算光刻</text><text x="368.0" y="214" font-size="18" text-anchor="middle" font-weight="400">OPC / ILT / SMO</text><line x1="466" y1="200" x2="498" y2="200" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><rect x="504" y="150" width="192" height="100" rx="12" fill="#eef4ff" stroke="#dbe3ec"/><text x="600.0" y="182" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">曝光</text><text x="600.0" y="214" font-size="18" text-anchor="middle" font-weight="400">对准、调焦、剂量</text><line x1="698" y1="200" x2="730" y2="200" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><rect x="736" y="150" width="192" height="100" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="832.0" y="182" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">烘烤与显影</text><text x="832.0" y="214" font-size="18" text-anchor="middle" font-weight="400">光刻胶形成图形</text><line x1="930" y1="200" x2="962" y2="200" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><rect x="968" y="150" width="192" height="100" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="1064.0" y="182" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">实际量测</text><text x="1064.0" y="214" font-size="18" text-anchor="middle" font-weight="400">CD / Overlay / 缺陷</text><text x="40" y="126" font-size="20" text-anchor="start" font-weight="600" style="fill:#526477">实际工艺</text><rect x="40" y="320" width="285" height="122" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="182.5" y="352" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">设计与仿真数据</text><text x="182.5" y="384" font-size="18" text-anchor="middle" font-weight="400">学习：掩模初始解、快速仿真</text><text x="182.5" y="412" font-size="18" text-anchor="middle" font-weight="400">输出：更快的优化过程</text><rect x="370" y="320" width="320" height="122" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="530.0" y="352" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">当前晶圆的状态数据</text><text x="530.0" y="384" font-size="18" text-anchor="middle" font-weight="400">Alignment / Leveling / 设备信号</text><text x="530.0" y="412" font-size="18" text-anchor="middle" font-weight="400">输出：曝光前的位置与状态估计</text><rect x="735" y="320" width="425" height="122" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="947.5" y="352" font-size="23" text-anchor="middle" font-weight="650" style="fill:#183247">量测与完整工艺历史</text><text x="947.5" y="384" font-size="18" text-anchor="middle" font-weight="400">图像 / 光谱 / Scanner 与 Track 时序</text><text x="947.5" y="412" font-size="18" text-anchor="middle" font-weight="400">输出：尺寸、位置、偏差与空间指纹</text><path d="M183 320 V282 H368 V252" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/><path d="M530 320 V282 H600 V252" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1064" y1="252" x2="1064" y2="318" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/><rect x="370" y="505" width="525" height="100" rx="12" fill="#ecf8f4" stroke="#dbe3ec"/><text x="632.5" y="537" font-size="23" text-anchor="middle" font-weight="650" style="fill:#0f766e">可执行的工艺调整</text><text x="632.5" y="569" font-size="18" text-anchor="middle" font-weight="400">选择能生效的晶圆与层次，计算设备支持的修正</text><path d="M945 443 V555 H898" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/><path d="M370 554 H343 V470 H714 V280 H650 V252" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/><text x="40" y="550" font-size="21" text-anchor="start" font-weight="650" style="fill:#0f766e">数据驱动的反馈</text><text x="40" y="580" font-size="18" text-anchor="start" font-weight="400" style="fill:#526477">量测返回后，更新后续曝光</text><text x="40" y="651" font-size="18" text-anchor="start" font-weight="400" style="fill:#526477">数据还可用于重新校准成像与工艺模型；反馈生效时点见图 6。</text></svg>
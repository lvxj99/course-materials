<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img"><title>同样输出 Overlay，IBO 与 DBO 读取的信号不同</title><desc>左：从两层图像估计相对位置。右：从叠层光栅的衍射响应反演相对位移。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1200" height="100%" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183247} .small{font-size:18px}.body{font-size:21px}.head{font-size:24px;font-weight:600}</style><text x="40" y="48" font-size="30" text-anchor="start" font-weight="700">同样输出 Overlay，IBO 与 DBO 读取的信号不同</text><text x="40" y="84" font-size="19" text-anchor="start" font-weight="400" style="fill:#526477">左：从两层图像估计相对位置。右：从叠层光栅的衍射响应反演相对位移。</text><rect x="35" y="115" width="550" height="585" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><rect x="615" y="115" width="550" height="585" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="65" y="155" font-size="25" text-anchor="start" font-weight="650">IBO：图像位置之差</text><text x="645" y="155" font-size="25" text-anchor="start" font-weight="650">DBO：设计偏置 + 级次强度差</text><text x="65" y="193" font-size="19" text-anchor="start" font-weight="400" style="fill:#526477">示意图像：两层标记的投影</text><rect x="144" y="231" width="280" height="220" rx="0" fill="#eff6ff" stroke="#2563eb"/><rect x="161" y="248" width="246" height="186" rx="0" fill="#f7f9fc" stroke="#2563eb"/><rect x="230" y="282" width="145" height="120" rx="0" fill="#fff3dd" stroke="#d97706"/><rect x="246" y="298" width="113" height="88" rx="0" fill="#f7f9fc" stroke="#d97706"/><line x1="284" y1="214" x2="284" y2="480" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/><line x1="302.5" y1="264" x2="302.5" y2="480" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/><text x="120" y="487" font-size="18" text-anchor="start" font-weight="400" style="fill:#2563eb">下层中心 x_b</text><text x="322" y="487" font-size="18" text-anchor="start" font-weight="400" style="fill:#d97706">上层中心 x_t</text><line x1="284" y1="511" x2="302.5" y2="511" stroke="#183247" stroke-width="2"/><path d="M297 506 L302.5 511 L297 516" fill="none" stroke="#183247" stroke-width="2.5"/><text x="322" y="519" font-size="22" text-anchor="start" font-weight="600">O = x_t − x_b</text><text x="65" y="562" font-size="19" text-anchor="start" font-weight="400">ML 的位置：找标、分层、选焦点、估计位置</text><text x="65" y="596" font-size="19" text-anchor="start" font-weight="400">图像处理引入的误差：δO = δx_t − δx_b</text><text x="65" y="630" font-size="18" text-anchor="start" font-weight="400" style="fill:#526477">两层共同移动会抵消；差分移动改变 Overlay。</text><text x="65" y="670" font-size="17" text-anchor="start" font-weight="400" style="fill:#526477">颜色表示两层，位移为放大的原理示意。</text><text x="758" y="203" font-size="18" text-anchor="middle" font-weight="400">+d 子目标：O + d</text><rect x="664" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="681" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="698" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="715" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="732" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="749" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="766" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="783" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="800" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="817" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><line x1="656" y1="315" x2="845" y2="315" stroke="#dbe3ec" stroke-width="2"/><text x="1010" y="203" font-size="18" text-anchor="middle" font-weight="400">−d 子目标：O − d</text><rect x="916" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="907" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="950" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="941" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="984" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="975" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="1018" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="1009" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><rect x="1052" y="274" width="19" height="29" rx="0" fill="#dbeafe" stroke="#2563eb"/><rect x="1043" y="229" width="19" height="29" rx="0" fill="#ffedd5" stroke="#d97706"/><line x1="908" y1="315" x2="1097" y2="315" stroke="#dbe3ec" stroke-width="2"/><text x="645" y="353" font-size="21" text-anchor="start" font-weight="400">每个子目标测量 A = I₊₁ − I₋₁</text><line x1="675" y1="466" x2="830" y2="466" stroke="#526477" stroke-width="2"/><rect x="685" y="386.64" width="48" height="79.36" rx="2" fill="#7dd3c7" stroke="none"/><text x="709" y="490" font-size="18" text-anchor="middle" font-weight="400">I₊₁</text><rect x="767" y="417.36" width="48" height="48.64" rx="2" fill="#cbd5e1" stroke="none"/><text x="791" y="490" font-size="18" text-anchor="middle" font-weight="400">I₋₁</text><text x="750" y="525" font-size="21" text-anchor="middle" font-weight="600">A₊ = +0.24</text><line x1="925" y1="466" x2="1080" y2="466" stroke="#526477" stroke-width="2"/><rect x="935" y="412.24" width="48" height="53.76" rx="2" fill="#7dd3c7" stroke="none"/><text x="959" y="490" font-size="18" text-anchor="middle" font-weight="400">I₊₁</text><rect x="1017" y="391.76" width="48" height="74.24" rx="2" fill="#cbd5e1" stroke="none"/><text x="1041" y="490" font-size="18" text-anchor="middle" font-weight="400">I₋₁</text><text x="1000" y="525" font-size="21" text-anchor="middle" font-weight="600">A₋ = −0.16</text><text x="645" y="570" font-size="24" text-anchor="start" font-weight="600">O = d (A₊ + A₋) / (A₊ − A₋)</text><text x="645" y="608" font-size="19" text-anchor="start" font-weight="400">本例 d = 10 nm，代入得到 O = 2 nm。</text><text x="645" y="643" font-size="18" text-anchor="start" font-weight="400" style="fill:#526477">ML 可联合利用像素、波长和结构敏感特征。</text><text x="645" y="675" font-size="17" text-anchor="start" font-weight="400" style="fill:#526477">A 的负号表示强度之差；两路光强均为正。</text><text x="40" y="742" font-size="18" text-anchor="start" font-weight="400" style="fill:#526477">原理依据：S37；右侧强度为线性模型算例。图中子目标与强度图不按实物比例绘制。</text></svg>
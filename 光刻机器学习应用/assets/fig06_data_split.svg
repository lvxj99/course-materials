<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">训练集怎样拆，决定测试结果回答什么问题</title><desc id="desc">上图展示同一Mark重复图像被随机分入训练集和测试集造成信息泄漏。下图按批次与时间整体留出训练、校准、最终测试，并只用训练数据拟合预处理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#60778a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1200" height="740" rx="0" fill="white" stroke="none" stroke-width="1"/>
<text x="40" y="53" font-size="29" fill="#183247" font-weight="700" text-anchor="start" >训练集怎样拆，决定测试结果回答什么问题</text>
<text x="40" y="89" font-size="19" fill="#60778a" font-weight="400" text-anchor="start" >目标：预测后续批次。划分单位应覆盖整片晶圆，并保留时间顺序。</text>
<rect x="40" y="122" width="1120" height="223" rx="14" fill="#fff3df" stroke="none" stroke-width="1"/>
<text x="62" y="157" font-size="24" fill="#d97706" font-weight="700" text-anchor="start" >随机拆图片</text>
<text x="62" y="198" font-size="21" fill="#183247" font-weight="600" text-anchor="start" >同一 Mark</text>
<text x="62" y="231" font-size="19" fill="#60778a" font-weight="400" text-anchor="start" >同一片 Wafer</text>
<line x1="242" y1="218" x2="310" y2="218" stroke="#60778a" stroke-width="1.8" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="330" y="177" width="100" height="76" rx="8" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="345" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>
<rect x="360" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>
<rect x="375" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>
<rect x="390" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>
<rect x="405" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="380" y="245" font-size="13" fill="#60778a" font-weight="400" text-anchor="middle" >重复采集 A</text>
<rect x="330" y="264" width="100" height="33" rx="5" fill="#eaf1ff" stroke="none" stroke-width="1"/>
<text x="380" y="288" font-size="18" fill="#2563eb" font-weight="600" text-anchor="middle" >训练</text>
<rect x="510" y="177" width="100" height="76" rx="8" fill="white" stroke="#2563eb" stroke-width="1.8"/>
<rect x="525" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>

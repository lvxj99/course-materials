<text x="345" y="486" font-size="20" fill="#2563eb" font-weight="600" text-anchor="start" >训练</text>
<rect x="348" y="508" width="66" height="54" rx="6" fill="white" stroke="#2563eb" stroke-width="1"/>
<text x="381" y="542" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle" >W1</text>
<rect x="424" y="508" width="66" height="54" rx="6" fill="white" stroke="#2563eb" stroke-width="1"/>
<text x="457" y="542" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle" >W2</text>
<rect x="500" y="508" width="66" height="54" rx="6" fill="white" stroke="#2563eb" stroke-width="1"/>
<text x="533" y="542" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle" >W3</text>
<rect x="610" y="420" width="265" height="166" rx="14" fill="#e7f5f1" stroke="none" stroke-width="1"/>
<text x="630" y="453" font-size="21" fill="#183247" font-weight="600" text-anchor="start" >Lot 3</text>
<text x="630" y="486" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start" >校准 / 调参</text>
<rect x="633" y="508" width="66" height="54" rx="6" fill="white" stroke="#0f766e" stroke-width="1"/>
<text x="666" y="542" font-size="18" fill="#0f766e" font-weight="400" text-anchor="middle" >W1</text>
<rect x="709" y="508" width="66" height="54" rx="6" fill="white" stroke="#0f766e" stroke-width="1"/>
<text x="742" y="542" font-size="18" fill="#0f766e" font-weight="400" text-anchor="middle" >W2</text>
<rect x="785" y="508" width="66" height="54" rx="6" fill="white" stroke="#0f766e" stroke-width="1"/>
<text x="818" y="542" font-size="18" fill="#0f766e" font-weight="400" text-anchor="middle" >W3</text>
<rect x="895" y="420" width="265" height="166" rx="14" fill="#fff3df" stroke="none" stroke-width="1"/>
<text x="915" y="453" font-size="21" fill="#183247" font-weight="600" text-anchor="start" >Lot 4</text>
<text x="915" y="486" font-size="20" fill="#d97706" font-weight="600" text-anchor="start" >最终测试</text>
<rect x="918" y="508" width="66" height="54" rx="6" fill="white" stroke="#d97706" stroke-width="1"/>
<text x="951" y="542" font-size="18" fill="#d97706" font-weight="400" text-anchor="middle" >W1</text>
<rect x="994" y="508" width="66" height="54" rx="6" fill="white" stroke="#d97706" stroke-width="1"/>
<text x="1027" y="542" font-size="18" fill="#d97706" font-weight="400" text-anchor="middle" >W2</text>
<rect x="1070" y="508" width="66" height="54" rx="6" fill="white" stroke="#d97706" stroke-width="1"/>

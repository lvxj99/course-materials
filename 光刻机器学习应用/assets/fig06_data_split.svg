<text x="40" y="618" font-size="19" fill="#183247" font-weight="400" text-anchor="start" >同一 Wafer 的重复图像与重叠 ROI 留在同一组；最终测试集只用于最后评价。</text>
<rect x="40" y="641" width="1120" height="58" rx="14" fill="#f5f8fb" stroke="none" stroke-width="1"/>
<text x="60" y="677" font-size="20" fill="#0f766e" font-weight="600" text-anchor="start" >归一化 / 特征选择 / 降维：仅在训练集拟合 → 固定参数后应用于校准集和测试集</text>
<text x="40" y="727" font-size="17" fill="#60778a" font-weight="400" text-anchor="start" >示意划分。若实际目标是跨设备或跨结构迁移，还需按对应设备或结构族留出。</text>
</g></svg>
<rect x="585" y="191" width="7" height="39" rx="1" fill="#2563eb" stroke="none" stroke-width="1"/>
<text x="560" y="245" font-size="13" fill="#60778a" font-weight="400" text-anchor="middle" >重复采集 B</text>
<rect x="510" y="264" width="100" height="33" rx="5" fill="#eaf1ff" stroke="none" stroke-width="1"/>
<text x="560" y="288" font-size="18" fill="#2563eb" font-weight="600" text-anchor="middle" >训练</text>
<rect x="690" y="177" width="100" height="76" rx="8" fill="white" stroke="#d97706" stroke-width="1.8"/>
<rect x="705" y="191" width="7" height="39" rx="1" fill="#d97706" stroke="none" stroke-width="1"/>
<rect x="720" y="191" width="7" height="39" rx="1" fill="#d97706" stroke="none" stroke-width="1"/>
<rect x="735" y="191" width="7" height="39" rx="1" fill="#d97706" stroke="none" stroke-width="1"/>
<rect x="750" y="191" width="7" height="39" rx="1" fill="#d97706" stroke="none" stroke-width="1"/>
<rect x="765" y="191" width="7" height="39" rx="1" fill="#d97706" stroke="none" stroke-width="1"/>
<text x="740" y="245" font-size="13" fill="#60778a" font-weight="400" text-anchor="middle" >重复采集 C</text>
<rect x="690" y="264" width="100" height="33" rx="5" fill="white" stroke="none" stroke-width="1"/>
<text x="740" y="288" font-size="18" fill="#d97706" font-weight="600" text-anchor="middle" >测试</text>
<text x="848" y="206" font-size="20" fill="#183247" font-weight="400" text-anchor="start" >相同结构与采集背景</text>
<text x="848" y="240" font-size="20" fill="#183247" font-weight="400" text-anchor="start" >已进入训练集</text>
<text x="62" y="328" font-size="18" fill="#d97706" font-weight="400" text-anchor="start" >测试可能只是再次识别熟悉的样本，无法代表新批次的表现。</text>
<text x="40" y="393" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start" >按 Lot / 时间整体留出</text>
<line x1="575" y1="385" x2="1135" y2="385" stroke="#60778a" stroke-width="1.6" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="850" y="373" font-size="17" fill="#60778a" font-weight="400" text-anchor="middle" >生产时间 →</text>
<rect x="40" y="420" width="265" height="166" rx="14" fill="#eaf1ff" stroke="none" stroke-width="1"/>
<text x="60" y="453" font-size="21" fill="#183247" font-weight="600" text-anchor="start" >Lot 1</text>
<text x="60" y="486" font-size="20" fill="#2563eb" font-weight="600" text-anchor="start" >训练</text>

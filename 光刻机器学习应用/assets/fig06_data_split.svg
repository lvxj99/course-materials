<text x="172" y="542" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle" >W2</text>
<rect x="215" y="508" width="66" height="54" rx="6" fill="white" stroke="#2563eb" stroke-width="1"/>
<text x="248" y="542" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle" >W3</text>
<rect x="325" y="420" width="265" height="166" rx="14" fill="#eaf1ff" stroke="none" stroke-width="1"/>

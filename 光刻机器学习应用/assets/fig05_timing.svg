<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img"><title>预测与反馈的关键：数据什么时候真正到达</title><desc>教学时间表 · 横向按事件顺序排列，间距不代表实际时长。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1200" height="100%" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183247} .small{font-size:18px}.body{font-size:21px}.head{font-size:24px;font-weight:600}</style><text x="40" y="48" font-size="30" text-anchor="start" font-weight="700">预测与反馈的关键：数据什么时候真正到达</text><text x="40" y="84" font-size="19" text-anchor="start" font-weight="400" style="fill:#526477">教学时间表 · 横向按事件顺序排列，间距不代表实际时长。</text><text x="110" y="140" font-size="22" text-anchor="middle" font-weight="600">09:00</text><line x1="110" y1="158" x2="110" y2="575" stroke="#dbe3ec" stroke-width="1" stroke-dasharray="6 5"/><text x="300" y="140" font-size="22" text-anchor="middle" font-weight="600">09:05</text><line x1="300" y1="158" x2="300" y2="575" stroke="#dbe3ec" stroke-width="1" stroke-dasharray="6 5"/><text x="490" y="140" font-size="22" text-anchor="middle" font-weight="600">09:20</text><line x1="490" y1="158" x2="490" y2="575" stroke="#dbe3ec" stroke-width="1" stroke-dasharray="6 5"/><text x="680" y="140" font-size="22" text-anchor="middle" font-weight="600">10:00</text><line x1="680" y1="158" x2="680" y2="575" stroke="#dbe3ec" stroke-width="1" stroke-dasharray="6 5"/><text x="870" y="140" font-size="22" text-anchor="middle" font-weight="600">13:00</text><line x1="870" y1="158" x2="870" y2="575" stroke="#dbe3ec" stroke-width="1" stroke-dasharray="6 5"/><text x="1060" y="140" font-size="22" text-anchor="middle" font-weight="600">14:00</text><line x1="1060" y1="158" x2="1060" y2="575" stroke="#dbe3ec" stroke-width="1" stroke-dasharray="6 5"/><line x1="70" y1="175" x2="1130" y2="175" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="214" font-size="19" text-anchor="start" font-weight="650">当前晶圆 Wₙ</text><rect x="35" y="235" width="150" height="56" rx="12" fill="#f1f5f9" stroke="#dbe3ec"/><text x="110" y="270" font-size="21" text-anchor="middle" font-weight="600" style="fill:#2563eb">对准完成</text><rect x="225" y="235" width="150" height="56" rx="12" fill="#f1f5f9" stroke="#dbe3ec"/><text x="300" y="270" font-size="21" text-anchor="middle" font-weight="600" style="fill:#2563eb">曝光</text><rect x="415" y="235" width="150" height="56" rx="12" fill="#f1f5f9" stroke="#dbe3ec"/><text x="490" y="270" font-size="21" text-anchor="middle" font-weight="600" style="fill:#d97706">显影完成</text><rect x="795" y="235" width="150" height="56" rx="12" fill="#f1f5f9" stroke="#dbe3ec"/><text x="870" y="270" font-size="21" text-anchor="middle" font-weight="600" style="fill:#0f766e">量测返回</text><line x1="185" y1="263" x2="224" y2="263" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><line x1="375" y1="263" x2="414" y2="263" stroke="#526477" stroke-width="2" marker-end="url(#arr)"/><line x1="565" y1="263" x2="793" y2="263" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/><text x="675" y="247" font-size="17" text-anchor="middle" font-weight="400" style="fill:#526477">等待加工与量测</text><text x="40" y="339" font-size="19" text-anchor="start" font-weight="650">模型可用的信息</text><rect x="40" y="360" width="340" height="135" rx="12" fill="#eef4ff" stroke="#dbe3ec"/><text x="210.0" y="392" font-size="23" text-anchor="middle" font-weight="650" style="fill:#2563eb">曝光前预测</text><text x="210.0" y="424" font-size="18" text-anchor="middle" font-weight="400">已返回的前层量测与历史数据</text><text x="210.0" y="452" font-size="18" text-anchor="middle" font-weight="400">当前 Alignment / Leveling</text><text x="210.0" y="480" font-size="18" text-anchor="middle" font-weight="400">当前可用的设备状态</text><rect x="416" y="360" width="340" height="135" rx="12" fill="#fff7ed" stroke="#dbe3ec"/><text x="586.0" y="392" font-size="23" text-anchor="middle" font-weight="650" style="fill:#d97706">显影后虚拟量测</text><text x="586.0" y="424" font-size="18" text-anchor="middle" font-weight="400">加入本片曝光和 Track 时序</text><text x="586.0" y="452" font-size="18" text-anchor="middle" font-weight="400">提前估计本层 CD / Overlay</text><text x="586.0" y="480" font-size="18" text-anchor="middle" font-weight="400">用于安排复查和后续控制</text><rect x="792" y="360" width="368" height="135" rx="12" fill="#ecf8f4" stroke="#dbe3ec"/><text x="976.0" y="392" font-size="23" text-anchor="middle" font-weight="650" style="fill:#0f766e">实测反馈</text><text x="976.0" y="424" font-size="18" text-anchor="middle" font-weight="400">13:00 才收到本层真实量测</text><text x="976.0" y="452" font-size="18" text-anchor="middle" font-weight="400">更新预测偏差与控制状态</text><text x="976.0" y="480" font-size="18" text-anchor="middle" font-weight="400">用于此后仍能调整的晶圆</text><text x="40" y="550" font-size="19" text-anchor="start" font-weight="650">后续晶圆</text><rect x="578" y="527" width="206" height="62" rx="12" fill="#fff7ed" stroke="#dbe3ec"/><text x="681" y="553" font-size="17" text-anchor="middle" font-weight="400">Wₙ₊₁ 已在 10:00 曝光</text><text x="681" y="578" font-size="16" text-anchor="middle" font-weight="400" style="fill:#526477">当时用不到 13:00 的结果</text><rect x="957" y="527" width="206" height="62" rx="12" fill="#ecf8f4" stroke="#dbe3ec"/><text x="1060" y="553" font-size="17" text-anchor="middle" font-weight="400">Wₙ₊₂ 在 14:00 曝光</text><text x="1060" y="578" font-size="16" text-anchor="middle" font-weight="400" style="fill:#526477">可采用 13:00 返回的反馈</text><path d="M870 292 V318 H1180 V510 H1060 V525" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="629" width="1120" height="77" rx="12" fill="#f7f9fc" stroke="#dbe3ec"/><text x="65" y="660" font-size="21" text-anchor="start" font-weight="600">历史回放的做法：在每次决策时刻截取当时已经到达的数据，再计算预测与修正。</text><text x="65" y="690" font-size="18" text-anchor="start" font-weight="400" style="fill:#526477">同时保存工艺发生时间和数据到达时间，便能区分本片前馈、结果预报与后续晶圆反馈。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">策略梯度：平均方向不变，采样波动可以变小</title><desc id="desc">直接求导、无基线 REINFORCE 与减基线估计具有相同期望，方差不同。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="620" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 06</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >策略梯度：平均方向不变，采样波动可以变小</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >两动作 bandit：P(A)=0.3，奖励 A=1、B=0；θ 是 A 的 logit</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<text x="63" y="183" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >不使用 baseline</text>
<text x="540" y="183" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >减去 baseline b = 0.3</text>
<rect x="63" y="209" width="393" height="104" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="259.5" y="250.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >A：0.7（概率 0.3）</text>
<text x="259.5" y="283.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >B：0.0（概率 0.7）</text>
<text x="259" y="359" font-size="25" fill="#227d82" text-anchor="middle" font-weight="400" >期望梯度 = 0.21</text>
<text x="259" y="407" font-size="22" fill="#647079" text-anchor="middle" font-weight="400" >梯度估计方差 = 0.1029</text>
<rect x="540" y="209" width="393" height="104" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="736.5" y="250.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >A：0.49（概率 0.3）</text>
<text x="736.5" y="283.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >B：0.09（概率 0.7）</text>
<text x="736" y="359" font-size="25" fill="#227d82" text-anchor="middle" font-weight="400" >期望梯度 = 0.21</text>
<text x="736" y="407" font-size="22" fill="#647079" text-anchor="middle" font-weight="400" >梯度估计方差 = 0.0336</text>
<rect x="110" y="455" width="780" height="52" rx="6" fill="#e4f1f0" stroke="#d9dfdf" />
<text x="500" y="488" font-size="23" fill="#227d82" text-anchor="middle" font-weight="400" >直接求导：dJ/dθ = p(1 − p) = 0.3 × 0.7 = 0.21</text>
<line x1="40" y1="548" x2="960" y2="548" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="577" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >单样本估计为 (R − b) ∂logπ(a)/∂θ；同一状态下，各个动作减去相同的基线。</text>
<text x="40" y="602" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >失败样本也能提供方向：降低 B 的概率，同样会提高 A 的概率。两种估计平均都指向 0.21。</text></svg>
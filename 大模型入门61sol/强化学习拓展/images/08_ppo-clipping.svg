<text x="40" y="587" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >最大化该目标：正优势动作增概率，负优势动作减概率；反方向恶化仍会受到惩罚。</text>
<text x="40" y="612" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >平段让这个样本停止追加鼓励；其他样本仍可通过共享参数改变它的概率。</text></svg>
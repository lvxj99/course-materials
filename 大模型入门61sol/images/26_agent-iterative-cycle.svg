<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Agent：让工具结果决定下一步</title><desc id="desc">模型根据目标与当前观测选择工具动作，执行环境返回结果，再检查证据、更新上下文并继续，直到满足完成条件。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="640" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 26</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >Agent：让工具结果决定下一步</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >模型提出动作，执行器操作环境，再把观测写回上下文</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="45" y="278" width="147" height="76" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="118.5" y="309.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >目标与约束</text>
<text x="118.5" y="334.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >读取任务</text>
<line x1="192" y1="316" x2="236" y2="316" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="243" y="263" width="196" height="106" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="341" y="297" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >理解当前状态</text>
<text x="341" y="322" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >推理 / 制定计划</text>
<text x="341" y="347" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >选择下一步</text>
<line x1="439" y1="316" x2="479" y2="316" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="486" y="278" width="169" height="76" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="570.5" y="309.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >调用工具</text>
<text x="570.5" y="334.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >明确参数</text>
<line x1="655" y1="316" x2="697" y2="316" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="704" y="263" width="242" height="106" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="825" y="297" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >执行器 + 环境</text>
<text x="825" y="322" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >读取文件 / 运行代码</text>
<text x="825" y="347" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >返回结果或错误</text>
<path d="M824,369 L824,451 L341,451 L341,369" stroke="#b76343" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b76343)"/>
<text x="581" y="487" font-size="21" fill="#b76343" text-anchor="middle" font-weight="400" >观察 → 检查证据 → 更新上下文</text>
<path d="M341,263 L341,204 L767,204" stroke="#227d82" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<rect x="773" y="178" width="174" height="51" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="860" y="209.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >满足完成条件</text>
<text x="535" y="189" font-size="17" fill="#227d82" text-anchor="middle" font-weight="400" >检查后可以结束</text>
<text x="497" y="549" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >循环可以重试、修正计划，或在信息不足时请求人工判断</text>
<line x1="40" y1="568" x2="960" y2="568" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="597" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >普通 Agent 循环通过上下文与外部状态继续任务，通常不会在每一步更新模型权重。</text>
<text x="40" y="622" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >工具调用要经过实际执行；生成一段“已完成”的文字本身并不意味着任务已经完成。</text></svg>
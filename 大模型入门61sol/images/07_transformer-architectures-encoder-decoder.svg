<text x="824" y="481" font-size="18" fill="#647079" text-anchor="middle" font-weight="400" >提示与回答处于同一序列</text>
<line x1="40" y1="553" x2="960" y2="553" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="582" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >这里比较典型注意力拓扑；具体模型还会改变归一化、位置编码、FFN 等组件。</text>
<text x="40" y="607" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >右侧因果结构适合自回归生成；并不意味着网络能同时知道尚未生成的后续 token。</text></svg>
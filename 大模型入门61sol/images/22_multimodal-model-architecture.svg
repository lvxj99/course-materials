<text x="492" y="578" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >特征投影对齐维度，联合训练学习模态之间的对应关系</text>
<line x1="40" y1="588" x2="960" y2="588" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="617" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >视频通常还需要时间信息；有些架构用交叉注意力而非把所有模态直接拼接。</text>
<text x="40" y="642" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >生成语音或图像通常还需专门的输出头、解码器或生成模块，此图聚焦多模态理解。</text></svg>
<text x="500" y="469" font-size="18" fill="#647079" text-anchor="middle" font-weight="400" >A 的每一行是一次读取：行和为 1，屏蔽位置的权重为 0</text>
<line x1="40" y1="513" x2="960" y2="513" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="542" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >行 = 发起读取的位置；列 = 被读取的位置。这里展示带因果掩码的 A。</text>
<text x="40" y="567" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >交叉注意力中，Q 有 T 行，K、V 有 S 行，权重矩阵相应为 T × S。</text></svg>
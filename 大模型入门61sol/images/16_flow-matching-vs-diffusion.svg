<text x="548" y="490" font-size="18" fill="#647079" text-anchor="start" font-weight="400" >模型拟合指定概率路径的速度场</text>
<text x="548" y="519" font-size="18" fill="#647079" text-anchor="start" font-weight="400" >选定起点后，按 ODE 数值积分</text>
<rect x="83" y="559" width="834" height="48" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="500" y="589" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >Diffusion 也可用概率流 ODE 采样；FM 的生成轨迹也不必是直线。</text>
<line x1="40" y1="633" x2="960" y2="633" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="662" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >FM 可选择扩散路径，也可选择其他概率路径；“线性条件插值”不等于每条生成轨迹都直。</text>
<text x="40" y="687" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >采样步数和速度取决于训练、路径、求解器与误差要求，不能仅凭曲线形状判断。</text></svg>
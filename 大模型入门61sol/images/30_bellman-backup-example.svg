<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">贝尔曼递推：眼前奖励 + 下一状态价值</title><desc id="desc">固定动作后，对各后继状态的即时奖励与折扣价值按转移概率加权。例中 γ=0.9，Qπ(s,a)=4.175。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="630" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 30</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >贝尔曼递推：眼前奖励 + 下一状态价值</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >一个动作、两个可能后继状态；用概率做加权平均</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<circle cx="153" cy="315" r="55" fill="#e4f1f0" stroke="#227d82" stroke-width="1.5"/>
<text x="153" y="325" font-size="34" fill="#227d82" text-anchor="middle" font-weight="400" >s</text>
<text x="153" y="411" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >固定动作 a</text>
<line x1="208" y1="302" x2="422" y2="230" stroke="#4c75a0" stroke-width="2" marker-end="url(#arrow-4c75a0)"/>
<line x1="208" y1="331" x2="422" y2="411" stroke="#b76343" stroke-width="2" marker-end="url(#arrow-b76343)"/>
<text x="302" y="224" font-size="19" fill="#4c75a0" text-anchor="middle" font-weight="400" >P = 0.75</text>
<text x="302" y="428" font-size="19" fill="#b76343" text-anchor="middle" font-weight="400" >P = 0.25</text>
<rect x="435" y="184" width="203" height="95" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="536.5" y="225" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >s₁：Vπ(s₁) = 4</text>
<text x="536.5" y="250" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >即时奖励 r = 2</text>
<rect x="435" y="369" width="203" height="95" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="536.5" y="410" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >s₂：Vπ(s₂) = 1</text>
<text x="536.5" y="435" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >即时奖励 r = −1</text>
<text x="679" y="221" font-size="21" fill="#4c75a0" text-anchor="start" font-weight="400" >2 + 0.9 × 4 = 5.6</text>
<text x="679" y="406" font-size="21" fill="#b76343" text-anchor="start" font-weight="400" >−1 + 0.9 × 1 = −0.1</text>
<rect x="121" y="497" width="758" height="49" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="500" y="529" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >Qπ(s, a) = 0.75 × 5.6 + 0.25 × (−0.1) = 4.175</text>
<line x1="40" y1="558" x2="960" y2="558" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="587" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >此例 γ = 0.9；下一状态价值已经包含之后全部折扣奖励，不需要展开无限长轨迹。</text>
<text x="40" y="612" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >Vπ(s) 再按 π(a | s) 对动作价值求平均；最优方程则在动作间取最大值。</text></svg>
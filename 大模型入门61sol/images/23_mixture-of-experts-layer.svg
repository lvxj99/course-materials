<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">MoE：每个 token 只调用少数专家</title><desc id="desc">四个 FFN 专家中为当前 token 选中两个，以归一化权重 0.65 和 0.35 汇总输出。专家不是预先指定的领域知识库。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="660" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 23</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >MoE：每个 token 只调用少数专家</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >示例共有 4 个 FFN 专家，路由选择 top-2；各 token 的选择可以不同</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="42" y="290" width="111" height="68" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="97.5" y="317.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >当前 token</text>
<text x="97.5" y="342.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >向量 x</text>
<line x1="153" y1="324" x2="201" y2="324" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="207" y="281" width="162" height="86" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="288" y="317.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >Router</text>
<text x="288" y="342.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >计算分数并选择</text>
<path d="M369,324 L404,324 L404,213 L477,213" stroke="#227d82" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="439" y="197" font-size="16" fill="#227d82" text-anchor="middle" font-weight="400" >0.52</text>
<rect x="484" y="186" width="158" height="54" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="563" y="219" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >专家 E1</text>
<path d="M642,213 L754,213 L754,324 L778,324" stroke="#227d82" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="697" y="193" font-size="17" fill="#227d82" text-anchor="middle" font-weight="400" >权重 .65</text>
<path d="M369,324 L404,324 L404,302 L477,302" stroke="#227d82" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="439" y="286" font-size="16" fill="#227d82" text-anchor="middle" font-weight="400" >0.28</text>
<rect x="484" y="275" width="158" height="54" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="563" y="308" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >专家 E2</text>
<path d="M642,302 L754,302 L754,324 L778,324" stroke="#227d82" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="697" y="282" font-size="17" fill="#227d82" text-anchor="middle" font-weight="400" >权重 .35</text>
<path d="M369,324 L404,324 L404,391 L477,391" stroke="#d9dfdf" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-d9dfdf)" stroke-dasharray="5 5"/>
<text x="439" y="375" font-size="16" fill="#647079" text-anchor="middle" font-weight="400" >0.12</text>
<rect x="484" y="364" width="158" height="54" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="563" y="397" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >专家 E3</text>
<text x="674" y="397" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >不执行</text>
<path d="M369,324 L404,324 L404,480 L477,480" stroke="#d9dfdf" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-d9dfdf)" stroke-dasharray="5 5"/>
<text x="439" y="464" font-size="16" fill="#647079" text-anchor="middle" font-weight="400" >0.08</text>
<rect x="484" y="453" width="158" height="54" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="563" y="486" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >专家 E4</text>
<text x="674" y="486" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >不执行</text>
<circle cx="804" cy="324" r="25" fill="#faeee7" stroke="#b76343" stroke-width="1.5"/>
<text x="804" y="333" font-size="26" fill="#b76343" text-anchor="middle" font-weight="400" >Σ</text>
<line x1="829" y1="324" x2="882" y2="324" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<text x="917" y="332" font-size="27" fill="#26343b" text-anchor="middle" font-weight="400" >y</text>
<text x="502" y="568" font-size="25" fill="#227d82" text-anchor="middle" font-weight="400" >y = 0.65 E₁(x) + 0.35 E₂(x)</text>
<line x1="40" y1="588" x2="960" y2="588" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="617" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >示例将选中权重重新归一化：0.52 / (0.52 + 0.28) = 0.65；不同架构可有不同路由规则。</text>
<text x="40" y="642" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >全部专家占用存储；每 token 激活较少专家仍有共享层、路由、通信与负载均衡开销。</text></svg>
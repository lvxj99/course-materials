<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">从预训练到使用：区分数据、信号与参数更新</title><desc id="desc">预训练建立基础能力，SFT 学习示范；DPO、基于奖励模型的 RL 和 RLVR 提供不同后训练路径，之后在固定权重下使用模型。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="720" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 20</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >从预训练到使用：区分数据、信号与参数更新</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >后训练可组合多种方法，实际流程不要求把所有分支依次执行</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="50" y="198" width="234" height="67" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="167" y="225" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >海量文本 / 代码等</text>
<text x="167" y="250" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >预测下一个 token</text>
<line x1="284" y1="231" x2="340" y2="231" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="347" y="198" width="244" height="67" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="469" y="225" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >预训练</text>
<text x="469" y="250" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >建立基础能力</text>
<line x1="591" y1="231" x2="645" y2="231" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="652" y="198" width="291" height="67" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="797.5" y="237.5" font-size="22" fill="#26343b" text-anchor="middle" font-weight="400" >基座模型</text>
<path d="M796,265 L796,298 L174,298 L174,339" stroke="#227d82" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<rect x="50" y="342" width="249" height="80" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="174.5" y="375.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >SFT：学习示范</text>
<text x="174.5" y="400.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >指令 + 高质量回答</text>
<line x1="299" y1="381" x2="357" y2="381" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="365" y="322" width="357" height="242" rx="6" fill="#fbfcfc" stroke="#d9dfdf" />
<text x="385" y="350" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >继续优化（可选 / 可组合）</text>
<rect x="385" y="365" width="317" height="51" rx="6" fill="#f0edf6" stroke="#d9dfdf" />
<text x="543.5" y="396.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >偏好对 → DPO</text>
<rect x="385" y="432" width="317" height="51" rx="6" fill="#f0edf6" stroke="#d9dfdf" />
<text x="543.5" y="463.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >偏好 → 奖励模型 → RL</text>
<rect x="385" y="499" width="317" height="51" rx="6" fill="#faeee7" stroke="#d9dfdf" />
<text x="543.5" y="530.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >可验证奖励 → RLVR</text>
<path d="M722,446 L795,446 L795,501" stroke="#227d82" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<rect x="757" y="506" width="186" height="58" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="850" y="541" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >可使用的模型</text>
<path d="M850,564 L850,606 L668,606" stroke="#647079" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-647079)"/>
<rect x="56" y="580" width="608" height="51" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="360" y="611.5" font-size="20" fill="#26343b" text-anchor="middle" font-weight="400" >推理：提示 + 材料 + 解码设置 → 回答 / 工具调用</text>
<line x1="40" y1="648" x2="960" y2="648" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="677" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >预训练、SFT、偏好优化和 RL 通常更新参数；普通推理与上下文学习通常保持参数固定。</text>
<text x="40" y="702" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >偏好信号关注相对可取性，可验证奖励关注可判定的结果；二者的目标不能混为一谈。</text></svg>
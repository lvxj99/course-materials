<text x="417.75" y="313.544" font-size="17" fill="#4c75a0" text-anchor="middle" font-weight="400" >64.4%</text>
<text x="417.75" y="502" font-size="18" fill="#647079" text-anchor="middle" font-weight="400" >A</text>
<rect x="456.75" y="418.754" width="37" height="54.246" rx="2" fill="#4c75a0" stroke="none" data-prob="0.23688281808991013"/>
<text x="475.25" y="406.754" font-size="17" fill="#4c75a0" text-anchor="middle" font-weight="400" >23.7%</text>

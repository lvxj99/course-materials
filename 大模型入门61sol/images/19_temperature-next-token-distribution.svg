<text x="905.25" y="502" font-size="18" fill="#647079" text-anchor="middle" font-weight="400" >D</text>
<line x1="40" y1="543" x2="960" y2="543" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="572" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >τ &gt; 0；低温使分布更集中，高温使分布更平坦，但不会改变各 logit 的排序。</text>
<text x="40" y="597" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >当 τ → 0⁺ 且最大 logit 唯一时趋于贪心选择；温度控制采样，不提高事实正确率。</text></svg>
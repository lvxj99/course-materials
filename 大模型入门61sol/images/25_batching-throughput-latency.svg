<text x="40" y="597" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >以上是教学成本模型，不是硬件实测，也不是某服务的价格或延迟保证。</text>
<text x="40" y="622" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >实际 P95 取决于到达负载、调度、序列长度与硬件；合批并非在所有条件下都会增加延迟。</text></svg>
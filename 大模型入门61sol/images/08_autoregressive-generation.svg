<text x="40" y="582" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >模型输出词表分布，再按贪心或采样规则选出一个 token；生成结束标记后停止。</text>
<text x="40" y="607" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >图中按词分组只是教学示意，真实切分由 tokenizer 决定；各步共用同一组模型权重。</text></svg>
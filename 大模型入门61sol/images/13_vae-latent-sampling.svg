<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685" role="img" aria-labelledby="title desc"><title id="title">VAE：编码成分布，再通过采样解码</title><desc id="desc">VAE 训练时由编码器给出均值和标准差，经重参数化采样后解码，同时最小化重建负对数似然与 KL；生成时直接从先验采样。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="685" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 13</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >VAE：编码成分布，再通过采样解码</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >训练使用 qφ(z | x)，生成使用先验 p(z)；两者不要混淆</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<text x="45" y="180" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >训练</text>
<rect x="48" y="223" width="92" height="62" rx="6" fill="#f5f7f7" stroke="#d9dfdf" />
<text x="94" y="260" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >输入 x</text>
<line x1="140" y1="254" x2="183" y2="254" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="187" y="210" width="147" height="90" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="260.5" y="248.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >Encoder</text>
<text x="260.5" y="273.5" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >μ(x), σ(x)</text>
<line x1="334" y1="255" x2="381" y2="255" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="387" y="216" width="242" height="78" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="508" y="248.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >z = μ + σ ⊙ ε</text>
<text x="508" y="273.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >ε ~ N(0, I)</text>
<line x1="629" y1="255" x2="674" y2="255" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="681" y="210" width="136" height="90" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="749" y="248.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >Decoder</text>
<text x="749" y="273.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >pθ(x | z)</text>
<line x1="817" y1="255" x2="866" y2="255" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<text x="910" y="262" font-size="27" fill="#26343b" text-anchor="middle" font-weight="400" >x̂</text>
<text x="507" y="329" font-size="18" fill="#4c75a0" text-anchor="middle" font-weight="400" >重参数化：随机性来自 ε，梯度流向 μ、σ</text>
<line x1="99" y1="520" x2="99" y2="525" stroke="#647079" stroke-width="1.5" />
<text x="99" y="544" font-size="15" fill="#647079" text-anchor="middle" font-weight="400" >-3</text>
<line x1="226" y1="520" x2="226" y2="525" stroke="#647079" stroke-width="1.5" />
<text x="226" y="544" font-size="15" fill="#647079" text-anchor="middle" font-weight="400" >0</text>
<line x1="353" y1="520" x2="353" y2="525" stroke="#647079" stroke-width="1.5" />
<text x="353" y="544" font-size="15" fill="#647079" text-anchor="middle" font-weight="400" >3</text>
<line x1="99" y1="400" x2="99" y2="520" stroke="#647079" stroke-width="1.5" />
<line x1="99" y1="520" x2="353" y2="520" stroke="#647079" stroke-width="1.5" />
<text x="226" y="573" font-size="17" fill="#647079" text-anchor="middle" font-weight="400" >潜在变量 z 的一维切片</text>

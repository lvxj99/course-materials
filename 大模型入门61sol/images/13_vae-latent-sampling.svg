<text x="95" y="383" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >p(z)</text>
<text x="257" y="383" font-size="17" fill="#227d82" text-anchor="start" font-weight="400" >qφ(z | x)</text>
<text x="431" y="403" font-size="21" fill="#26343b" text-anchor="start" font-weight="400" >目标 = 重建负对数似然 + KL(qφ ‖ p)</text>
<text x="432" y="462" font-size="18" fill="#227d82" text-anchor="start" font-weight="600" >生成</text>
<rect x="432" y="485" width="196" height="56" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="530" y="519" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >z ~ N(0, I)</text>
<line x1="628" y1="513" x2="674" y2="513" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="681" y="485" width="136" height="56" rx="6" fill="#faeee7" stroke="#b76343" />
<text x="749" y="519" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >Decoder</text>
<line x1="817" y1="513" x2="866" y2="513" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<text x="903" y="520" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >新样本</text>
<line x1="40" y1="613" x2="960" y2="613" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="642" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >KL 项鼓励编码分布接近先验，并非强制每个样本的后验完全相同。</text>
<text x="40" y="667" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >生成新样本时无需编码器；密度曲线是解析高斯示意，不是拟合结果。</text></svg>
<text x="40" y="582" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >Embedding 的形状是 |词表| × d；长度为 T 的 id 序列查表后得到 T × d。</text>
<text x="40" y="607" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >id 的数值大小不代表语义距离；嵌入向量由训练学习，位置关系还需另行编码。</text></svg>
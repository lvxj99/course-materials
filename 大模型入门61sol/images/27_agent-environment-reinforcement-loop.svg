<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="605" viewBox="0 0 1000 605" role="img" aria-labelledby="title desc"><title id="title">强化学习：动作改变环境，反馈改变策略</title><desc id="desc">Agent 按策略选择动作 aₜ，环境返回奖励 rₜ₊₁ 和下一状态 sₜ₊₁；强化学习优化期望折扣回报。</desc><defs><marker id="arrow-26343b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#26343b"/></marker><marker id="arrow-647079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#647079"/></marker><marker id="arrow-d9dfdf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d9dfdf"/></marker><marker id="arrow-ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#ffffff"/></marker><marker id="arrow-f5f7f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f5f7f7"/></marker><marker id="arrow-227d82" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#227d82"/></marker><marker id="arrow-e4f1f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#e4f1f0"/></marker><marker id="arrow-b76343" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#b76343"/></marker><marker id="arrow-faeee7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#faeee7"/></marker><marker id="arrow-4c75a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4c75a0"/></marker><marker id="arrow-eaf0f8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#eaf0f8"/></marker><marker id="arrow-7d6a9b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7d6a9b"/></marker><marker id="arrow-f0edf6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#f0edf6"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4f4f3"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#d9dedd" stroke-width="1"/></pattern></defs><style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif}svg{background:#fff}</style><rect width="1000" height="605" fill="white"/><text x="40" y="43" font-size="14" fill="#227d82" text-anchor="start" font-weight="650" >FIG 27</text>
<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >强化学习：动作改变环境，反馈改变策略</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >统一时间记号：在 sₜ 采取 aₜ，随后收到 rₜ₊₁ 与 sₜ₊₁</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="93" y="252" width="263" height="139" rx="6" fill="#e4f1f0" stroke="#227d82" />
<text x="224.5" y="302.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >Agent</text>
<text x="224.5" y="327.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >策略 πθ(a | s)</text>
<text x="224.5" y="352.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >根据状态选择动作</text>
<rect x="647" y="252" width="263" height="139" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="778.5" y="302.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >Environment</text>
<text x="778.5" y="327.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >状态转移 + 奖励</text>
<text x="778.5" y="352.5" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >响应当前动作</text>
<path d="M356,288 L468,288 L468,214 L779,214 L779,252" stroke="#227d82" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-227d82)"/>
<text x="540" y="194" font-size="21" fill="#227d82" text-anchor="start" font-weight="400" >动作 aₜ</text>
<path d="M647,352 L542,352 L542,437 L225,437 L225,391" stroke="#b76343" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b76343)"/>
<text x="380" y="479" font-size="22" fill="#b76343" text-anchor="middle" font-weight="400" >奖励 rₜ₊₁ + 下一状态 sₜ₊₁</text>
<text x="498" y="514" font-size="21" fill="#26343b" text-anchor="middle" font-weight="400" >最大化 E[Gₜ]，Gₜ = rₜ₊₁ + γ rₜ₊₂ + γ² rₜ₊₃ + …</text>
<line x1="40" y1="533" x2="960" y2="533" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="562" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >环境返回的是行动后果，通常没有逐动作的标准答案；训练依据长期累计奖励。</text>
<text x="40" y="587" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >部分可观测任务中，Agent 接收观测 oₜ，并可能需要记忆历史，而非直接看到完整状态。</text></svg>
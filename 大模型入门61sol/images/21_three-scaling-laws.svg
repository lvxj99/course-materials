<text x="40" y="83" font-size="29" fill="#26343b" text-anchor="start" font-weight="650" >扩展能力的三处计算预算</text>
<text x="40" y="116" font-size="17" fill="#647079" text-anchor="start" font-weight="400" >比较计算花在何时、改变什么；不是三条统一且必然成立的增长曲线</text>
<line x1="40" y1="137" x2="960" y2="137" stroke="#d9dfdf" stroke-width="1" />
<rect x="45" y="171" width="265" height="350" rx="6" fill="#ffffff" stroke="#d9dfdf" />
<text x="177" y="209" font-size="25" fill="#227d82" text-anchor="middle" font-weight="600" >预训练</text>
<rect x="367" y="171" width="265" height="350" rx="6" fill="#ffffff" stroke="#d9dfdf" />
<text x="499" y="209" font-size="25" fill="#4c75a0" text-anchor="middle" font-weight="600" >后训练</text>
<rect x="689" y="171" width="265" height="350" rx="6" fill="#ffffff" stroke="#d9dfdf" />
<text x="821" y="209" font-size="25" fill="#b76343" text-anchor="middle" font-weight="600" >推理时计算</text>
<rect x="78" y="360" width="29" height="65" rx="2" fill="#c1dbdc" stroke="#ffffff" />
<rect x="121" y="340" width="29" height="85" rx="2" fill="#9ec6c8" stroke="#ffffff" />
<rect x="164" y="320" width="29" height="105" rx="2" fill="#7ab1b4" stroke="#ffffff" />
<rect x="207" y="300" width="29" height="125" rx="2" fill="#579ca0" stroke="#ffffff" />
<text x="177" y="264" font-size="16" fill="#647079" text-anchor="middle" font-weight="400" >数据量 · 参数量 · 训练步数</text>
<text x="177" y="451" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >广泛任务与分布</text>
<text x="177" y="482" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >改变模型参数</text>
<text x="499" y="264" font-size="17" fill="#647079" text-anchor="middle" font-weight="400" >更好的示范、偏好与奖励</text>
<rect x="405" y="299" width="185" height="43" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="497.5" y="326.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >生成候选回答</text>
<line x1="498" y1="342" x2="498" y2="369" stroke="#647079" stroke-width="1.7" marker-end="url(#arrow-647079)"/>
<rect x="405" y="373" width="185" height="43" rx="6" fill="#eaf0f8" stroke="#4c75a0" />
<text x="497.5" y="400.5" font-size="18" fill="#26343b" text-anchor="middle" font-weight="400" >评价 → 更新</text>
<text x="499" y="451" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >对齐任务目标</text>
<text x="499" y="482" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >改变模型参数</text>
<text x="821" y="264" font-size="17" fill="#647079" text-anchor="middle" font-weight="400" >更深的推导，或更多候选</text>

<text x="821" y="451" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >一次任务内求解与验证</text>
<text x="821" y="482" font-size="19" fill="#26343b" text-anchor="middle" font-weight="400" >通常保持参数固定</text>
<line x1="40" y1="553" x2="960" y2="553" stroke="#d9dfdf" stroke-width="1" />
<text x="40" y="582" font-size="16" fill="#647079" text-anchor="start" font-weight="400" >收益受数据质量、任务难度、预算分配与验证器质量影响；更多计算不保证更好的结果。</text>
<text x="40" y="607" font-size="15" fill="#647079" text-anchor="start" font-weight="400" >训练计算主要影响模型获得的能力；推理预算影响本次任务怎样使用已有能力。</text></svg>
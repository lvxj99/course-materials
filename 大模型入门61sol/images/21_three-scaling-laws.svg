<line x1="741" y1="347" x2="790" y2="347" stroke="#b76343" stroke-width="1.7" marker-end="url(#arrow-b76343)"/>
<circle cx="799" cy="347" r="7" fill="#faeee7" stroke="#b76343" stroke-width="1.5"/>
<line x1="808" y1="347" x2="881" y2="347" stroke="#b76343" stroke-width="1.7" marker-end="url(#arrow-b76343)"/>
<line x1="741" y1="347" x2="790" y2="394" stroke="#b76343" stroke-width="1.7" marker-end="url(#arrow-b76343)"/>
<circle cx="799" cy="394" r="7" fill="#faeee7" stroke="#b76343" stroke-width="1.5"/>
<line x1="808" y1="394" x2="881" y2="347" stroke="#b76343" stroke-width="1.7" marker-end="url(#arrow-b76343)"/>

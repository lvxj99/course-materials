<text x="656.0" y="130.0" fill="#E07B2A" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">0.9</text>
<rect x="728.0" y="152.8" width="56.0" height="97.2" rx="3" fill="#E07B2A" fill-opacity="0.9" stroke="none"/>
<text x="756.0" y="268.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">第 3 步</text>
<text x="756.0" y="140.8" fill="#E07B2A" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">0.81</text>
<rect x="828.0" y="162.5" width="56.0" height="87.5" rx="3" fill="#E07B2A" fill-opacity="0.9" stroke="none"/>
<text x="856.0" y="268.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">第 4 步</text>
<text x="856.0" y="150.5" fill="#E07B2A" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">0.729</text>
<text x="512.0" y="308.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">前四项之和 3.439，无穷和 1/(1−γ) = 10.000</text>
<text x="28.0" y="360.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">γ = 0.5 时，前四项已经接近无穷和 2，更远的奖励几乎可以忽略。γ = 0.9 时无穷和是 10，前四项大约只有 3.44，后面的项仍占大头。</text>
<text x="28.0" y="377.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">折扣同时让无穷长的和有有限值。它也表达一种偏好：更早拿到的 1，权重大于更晚拿到的 1。</text>
</svg>

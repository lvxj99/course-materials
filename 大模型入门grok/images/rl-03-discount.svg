<text x="392.0" y="223.0" fill="#4C78A8" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">0.125</text>
<text x="48.0" y="308.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">前四项之和 1.875，无穷和 1/(1−γ) = 2.000</text>
<rect x="492.0" y="56.0" width="440.0" height="280.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>

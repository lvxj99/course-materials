<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435" role="img">
<title>Actor-Critic 把评价和决策分开</title>
<desc>λ 决定优势向后看一步，还是看到结局。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="36.0" y="48.0" width="250.0" height="90.0" rx="6" fill="#8E6899" fill-opacity="0.14" stroke="#8E6899" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="161.0" y="84.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">Critic</text>
<text x="161.0" y="104.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">估计 V(s)，评价当前状态</text>
<rect x="674.0" y="48.0" width="250.0" height="90.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="799.0" y="84.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">Actor</text>
<text x="799.0" y="104.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">输出 π(a | s)，真正做选择</text>
<rect x="330.0" y="56.0" width="300.0" height="74.0" rx="6" fill="#C4922A" fill-opacity="0.14" stroke="#C4922A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="480.0" y="84.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">优势</text>
<text x="480.0" y="104.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">做到的 − 预期的</text>
<line x1="286.0" y1="93.0" x2="330.0" y2="93.0" stroke="#8E6899" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8E6899)"/>
<line x1="630.0" y1="93.0" x2="674.0" y2="93.0" stroke="#C4922A" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mkC4922A)"/>
<text x="36.0" y="170.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">一步的时候，优势的估计就是 TD 误差</text>
<text x="36.0" y="198.0" fill="#1F2A30" fill-opacity="1.0" font-size="18" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">δ(t) = r(t+1) + γ V(s(t+1)) − V(s(t))</text>
<rect x="36.0" y="236.0" width="888.0" height="130.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="56.0" y="264.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">GAE 的 λ</text>
<line x1="56.0" y1="310.0" x2="880.0" y2="310.0" stroke="#E3E0DA" stroke-width="2" stroke-linecap="round"/>
<circle cx="56.0" cy="310.0" r="7.0" fill="#E07B2A" fill-opacity="1.0" stroke="#E07B2A" stroke-width="1.25"/>
<circle cx="880.0" cy="310.0" r="7.0" fill="#4C78A8" fill-opacity="1.0" stroke="#4C78A8" stroke-width="1.25"/>
<text x="56.0" y="286.0" fill="#E07B2A" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">λ = 0</text>
<text x="880.0" y="286.0" fill="#4C78A8" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="end">λ = 1</text>
<text x="56.0" y="336.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">只使用 δ_t，也就是只看下一步</text>
<text x="620.0" y="336.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">把后续 TD 误差按 γλ 加回去，直到结局</text>
<text x="28.0" y="386.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">λ = 1 且终止状态的价值记为 0 时，优势估计回到折扣蒙特卡洛回报减去 V(s_t)。λ = 0 就是单独的一步 TD 误差。</text>
<text x="28.0" y="403.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">中间的 λ 在偏差和方差之间取一个点：向后看得越远，越接近真实回报，也越容易被整段轨迹的噪声拉动。</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="485" viewBox="0 0 960 485" role="img">
<title>BPE 合并高频相邻片段</title>
<desc>数字是按合并规则数出来的，不是随便写的。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<text x="28.0" y="30.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">教学用语料。词尾用 &lt;/w&gt; 标出，所以词中间的 w 和词尾的 w 不是同一对。</text>
<text x="28.0" y="64.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">low &lt;/w&gt; × 5</text>
<text x="28.0" y="86.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">lower &lt;/w&gt; × 2</text>
<text x="28.0" y="108.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">new &lt;/w&gt; × 6</text>
<text x="28.0" y="130.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">newer &lt;/w&gt; × 3</text>
<rect x="280.0" y="52.0" width="200.0" height="120.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="294.0" y="76.0" fill="#E07B2A" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">第 1 次合并</text>
<text x="294.0" y="104.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">w  +  &lt;/w&gt;</text>
<text x="294.0" y="130.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">相邻 11 次，全场最多</text>
<text x="294.0" y="152.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">新符号  w&lt;/w&gt;</text>
<rect x="500.0" y="52.0" width="200.0" height="120.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="514.0" y="76.0" fill="#E07B2A" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">第 2 次合并</text>
<text x="514.0" y="104.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">n  +  e</text>
<text x="514.0" y="130.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">相邻 9 次，全场最多</text>
<text x="514.0" y="152.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">新符号  ne</text>
<rect x="720.0" y="52.0" width="200.0" height="120.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="734.0" y="76.0" fill="#E07B2A" fill-opacity="1.0" font-size="13" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">第 3 次合并</text>
<text x="734.0" y="104.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">l  +  o</text>
<text x="734.0" y="130.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">相邻 7 次，全场最多</text>
<text x="734.0" y="152.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">新符号  lo</text>
<text x="280.0" y="200.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">三次合并之后，这四条词变成</text>
<text x="280.0" y="224.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">lo  w&lt;/w&gt;    × 5</text>
<text x="280.0" y="248.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">lo  w  e  r  &lt;/w&gt;    × 2</text>
<text x="280.0" y="272.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">ne  w&lt;/w&gt;    × 6</text>
<text x="280.0" y="296.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">ne  w  e  r  &lt;/w&gt;    × 3</text>
<rect x="28.0" y="340.0" width="904.0" height="78.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="44.0" y="366.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">为什么是子词，而不是整词或单字</text>
<text x="44.0" y="392.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">整词表会因为词形变化胀得很大；单字又丢掉词内部的统计。BPE 停在中间。</text>
<text x="28.0" y="436.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">alignment 可能被切成 align 和 ment。这是讲义里的例子，不是上面这小份语料算出来的。</text>
<text x="28.0" y="453.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">次数并列时要规定先合并哪一对；这份语料前三次的冠军都是唯一的，所以没有用到并列规则。</text>
</svg>

<text x="28.0" y="380.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">更新方向是梯度上升：回报越高，log π(a_t | s_t) 被推得越大。时刻 t 之前已经拿到的奖励可以不放进这一项，期望梯度不变。</text>
<text x="28.0" y="397.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">再减去只依赖状态的基线，期望仍不变，方差通常会下降。优势就是扣掉这个基线之后的分量。</text>

<polyline points="98.0,166.0 124.0,153.6 150.0,153.8 176.0,140.9 202.0,139.0 228.0,127.0 254.0,120.0 258.0,159.0" fill="none" fill-opacity="1.0" stroke="#D4544E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mkD4544E)"/>
<polyline points="98.0,182.0 124.0,179.9 150.0,189.0 176.0,178.5 202.0,170.8 228.0,174.3 254.0,186.9 258.0,168.0" fill="none" fill-opacity="1.0" stroke="#D4544E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mkD4544E)"/>
<polyline points="98.0,198.0 124.0,200.2 150.0,197.3 176.0,210.6 202.0,197.9 228.0,207.9 254.0,202.1 258.0,177.0" fill="none" fill-opacity="1.0" stroke="#D4544E" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mkD4544E)"/>
<text x="44.0" y="300.0" fill="#1F2A30" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">同一起点可以有很多条轨迹。</text>
<text x="44.0" y="322.0" fill="#526068" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">步数通常更多。</text>
<text x="44.0" y="348.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">示意轨迹，不是数值积分的输出。</text>
<rect x="344.0" y="24.0" width="300.0" height="360.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="360.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(b)</text>
<text x="388.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">概率流 ODE</text>
<text x="360.0" y="72.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">去掉随机项后的漂移</text>
<circle cx="414.0" cy="180.0" r="28.0" fill="#8A847C" fill-opacity="0.18" stroke="#8A847C" stroke-width="1.4"/>
<text x="414.0" y="226.0" fill="#8A847C" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">噪声</text>
<circle cx="574.0" cy="180.0" r="28.0" fill="#4E8C46" fill-opacity="0.18" stroke="#4E8C46" stroke-width="1.4"/>
<text x="574.0" y="226.0" fill="#4E8C46" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">数据</text>
<path d="M 444 150 Q 499 88 542 156" fill="none" fill-opacity="1.0" stroke="#4C78A8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mk4C78A8)"/>
<path d="M 444 166 Q 499 104 542 165" fill="none" fill-opacity="1.0" stroke="#4C78A8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mk4C78A8)"/>
<path d="M 444 182 Q 499 120 542 174" fill="none" fill-opacity="1.0" stroke="#4C78A8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mk4C78A8)"/>
<path d="M 444 198 Q 499 136 542 183" fill="none" fill-opacity="1.0" stroke="#4C78A8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mk4C78A8)"/>
<text x="360.0" y="300.0" fill="#1F2A30" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">同一时刻的分布与左图一致。</text>
<text x="360.0" y="322.0" fill="#526068" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">轨迹是确定的曲线。</text>
<text x="360.0" y="348.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">示意轨迹，不是数值积分的输出。</text>
<rect x="660.0" y="24.0" width="300.0" height="360.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="676.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(c)</text>
<text x="704.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">Flow Matching</text>
<text x="676.0" y="72.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">直接学习速度场</text>
<circle cx="730.0" cy="180.0" r="28.0" fill="#8A847C" fill-opacity="0.18" stroke="#8A847C" stroke-width="1.4"/>
<text x="730.0" y="226.0" fill="#8A847C" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">噪声</text>
<circle cx="890.0" cy="180.0" r="28.0" fill="#4E8C46" fill-opacity="0.18" stroke="#4E8C46" stroke-width="1.4"/>
<text x="890.0" y="226.0" fill="#4E8C46" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">数据</text>
<line x1="730.0" y1="150.0" x2="882.0" y2="150.0" stroke="#4E8C46" stroke-width="1.5" stroke-linecap="round" marker-end="url(#mk4E8C46)"/>
<line x1="730.0" y1="166.0" x2="882.0" y2="159.0" stroke="#4E8C46" stroke-width="1.5" stroke-linecap="round" marker-end="url(#mk4E8C46)"/>
<line x1="730.0" y1="182.0" x2="882.0" y2="168.0" stroke="#4E8C46" stroke-width="1.5" stroke-linecap="round" marker-end="url(#mk4E8C46)"/>
<line x1="730.0" y1="198.0" x2="882.0" y2="177.0" stroke="#4E8C46" stroke-width="1.5" stroke-linecap="round" marker-end="url(#mk4E8C46)"/>
<text x="676.0" y="300.0" fill="#1F2A30" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">线性条件路径是直线。</text>
<text x="676.0" y="322.0" fill="#526068" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">往往可以用更少的步数。</text>
<text x="676.0" y="348.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">示意轨迹，不是数值积分的输出。</text>
<text x="28.0" y="404.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">扩散的前向过程是随机微分方程。概率流 ODE 去掉随机项，并调整漂移，使每个时刻的边缘分布保持不变。</text>
<text x="28.0" y="421.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">Flow Matching 直接拟合一条从噪声分布到数据分布的速度场。条件流匹配里常用直线插值；不是所有 flow 模型都只能走直线。</text>
</svg>

<rect x="748.0" y="88.0" width="36.0" height="120.0" rx="3" fill="#F4F1EA" fill-opacity="1.0" stroke="none"/>
<rect x="748.0" y="184.3" width="36.0" height="23.7" rx="3" fill="#3E9B96" fill-opacity="1.0" stroke="none"/>
<text x="766.0" y="224.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">看</text>
<text x="766.0" y="174.3" fill="#3E9B96" fill-opacity="1.0" font-size="11" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">19.8%</text>
<text x="640.0" y="250.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">分布更平</text>
<text x="28.0" y="278.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">温度不改变排序。贪心永远选“学”。τ 趋向 0 时接近贪心，趋向无穷时接近均匀。</text>
<rect x="28.0" y="310.0" width="904.0" height="150.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="44.0" y="334.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">另外两个旋钮会先丢掉候选，再重新归一化</text>
<text x="44.0" y="364.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">原分布  50%  25%  15%  10%</text>
<text x="44.0" y="392.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">top-k = 2：留下学、吃 → 66.7%  33.3%</text>
<text x="44.0" y="418.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">top-p = 0.8：50+25 还不到 0.8，于是再留下看 → 55.5%  27.8%  16.7%</text>
<text x="44.0" y="444.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">这个例子里两者留下的集合不同。玩在两种规则下都被丢掉。</text>
<text x="28.0" y="476.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">百分比按一位小数配平，使一行加起来是 100%。这些分布是为了把公式算清楚，不是模型的真实输出。</text>
<text x="28.0" y="493.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">top-p 取最小的一组候选，使累计概率达到阈值，然后只在这组里重新归一化。</text>
</svg>

<text x="466.0" y="186.0" fill="#4C78A8" fill-opacity="1.0" font-size="11" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">10.0%</text>
<text x="340.0" y="250.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">讲义里的例子</text>
<text x="640.0" y="64.0" fill="#E07B2A" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">τ = 2</text>

<text x="530.0" y="314.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">分词规则在训练前定死，使用时必须用同一套。</text>
<text x="28.0" y="360.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">整条链路是：prompt → tokenization → token id → embedding lookup → Transformer → logits。</text>
<text x="28.0" y="377.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">长度、上下文窗口和计费通常按 token 数，而不是按字符数。特殊符号如起始符也占一个 id。</text>

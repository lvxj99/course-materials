<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img">
<title>GRPO 用同一道题的一组回答做基线</title>
<desc>奖励 1, 0, 1, 0。组均值 0.5，总体标准差 0.5。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<text x="28.0" y="32.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">同一个提示采样四份回答。优势 = (奖励 − 0.5) / 0.5。</text>
<rect x="80.0" y="80.0" width="80.0" height="120.0" rx="3" fill="#4E8C46" fill-opacity="0.9" stroke="none"/>
<text x="120.0" y="222.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">回答 1</text>
<text x="120.0" y="244.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">奖励 1</text>
<text x="120.0" y="270.0" fill="#4E8C46" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">优势 +1</text>
<text x="340.0" y="222.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">回答 2</text>
<text x="340.0" y="244.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">奖励 0</text>
<text x="340.0" y="270.0" fill="#D4544E" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">优势 -1</text>
<rect x="520.0" y="80.0" width="80.0" height="120.0" rx="3" fill="#4E8C46" fill-opacity="0.9" stroke="none"/>
<text x="560.0" y="222.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">回答 3</text>
<text x="560.0" y="244.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">奖励 1</text>
<text x="560.0" y="270.0" fill="#4E8C46" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">优势 +1</text>
<text x="780.0" y="222.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">回答 4</text>
<text x="780.0" y="244.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">奖励 0</text>
<text x="780.0" y="270.0" fill="#D4544E" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">优势 -1</text>
<line x1="48.0" y1="140.0" x2="912.0" y2="140.0" stroke="#8E6899" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 3"/>
<text x="616.0" y="124.0" fill="#8E6899" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">组均值 0.5</text>
<text x="28.0" y="300.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">柱高是奖励。高于虚线的得到正优势，贴在零线上的得到负优势。</text>
<text x="28.0" y="328.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">只看最终对错时，一份回答里的各个 token 共用这一个优势。更新仍可用 PPO 的截断比率。</text>
<text x="28.0" y="366.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">这里的标准差是总体标准差：四个偏差平方的平均是 0.25，开方得 0.5。有的实现用样本标准差，或在分母上加一个很小的数以免除零。</text>
<text x="28.0" y="383.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">组内优势的平均是 0。奖励来自判定程序时，这套更新就属于可验证奖励的训练；GRPO 规定的是优势怎么算，不是奖励从哪来。</text>
</svg>

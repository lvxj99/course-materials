<text x="106.0" y="65.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">设</text>
<text x="106.0" y="85.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">动作</text>
<text x="106.0" y="128.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">即时奖励 0</text>
<line x1="184.0" y1="74.0" x2="198.0" y2="74.0" stroke="#8A847C" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8A847C)"/>
<rect x="206.0" y="48.0" width="140.0" height="52.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="276.0" y="65.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">x = 2</text>
<text x="276.0" y="85.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">动作</text>
<text x="276.0" y="128.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">即时奖励 0</text>
<line x1="354.0" y1="74.0" x2="368.0" y2="74.0" stroke="#8A847C" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8A847C)"/>
<rect x="376.0" y="48.0" width="140.0" height="52.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="446.0" y="65.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">则</text>
<text x="446.0" y="85.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">动作</text>
<text x="446.0" y="128.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">即时奖励 0</text>
<line x1="524.0" y1="74.0" x2="538.0" y2="74.0" stroke="#8A847C" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8A847C)"/>
<rect x="546.0" y="48.0" width="140.0" height="52.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="616.0" y="65.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">x² = 4</text>
<text x="616.0" y="85.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">动作</text>
<text x="616.0" y="128.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">即时奖励 0</text>
<rect x="720.0" y="48.0" width="200.0" height="52.0" rx="6" fill="#C4922A" fill-opacity="0.14" stroke="#C4922A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="820.0" y="65.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">检查通过</text>
<text x="820.0" y="85.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">序列奖励 +1</text>
<line x1="694.0" y1="74.0" x2="712.0" y2="74.0" stroke="#C4922A" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mkC4922A)"/>
<text x="36.0" y="176.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">策略梯度里，这一整段的优势会乘在每一个已生成 token 的 log π 上。</text>
<text x="36.0" y="208.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">(R − b) ∇ log π(y1) + (R − b) ∇ log π(y2) + …</text>
<text x="36.0" y="248.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">前三个 token 没有自己的即时奖励。它们是否该得分，要靠最终检查倒推。</text>
<text x="28.0" y="290.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">状态是已经写出来的上下文，动作是下一个 token，策略是语言模型。和第一节的延迟奖励是同一类信用分配，只是轨迹通常长得多。</text>
<text x="28.0" y="307.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">相对参考模型的 KL 也是按 token 的对数概率差相加，所以离开参考模型的代价会摊在每一个 token 上。</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="449" viewBox="0 0 960 449" role="img">
<title>DPO 里配分函数在比较中消去</title>
<desc>偏好对直接变成策略上的分类损失。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="36.0" y="48.0" width="200.0" height="70.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="136.0" y="74.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">更好的回答 y_w</text>
<text x="136.0" y="94.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">偏好数据里胜出的一方</text>
<rect x="280.0" y="48.0" width="200.0" height="70.0" rx="6" fill="#D4544E" fill-opacity="0.14" stroke="#D4544E" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="380.0" y="74.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">更差的回答 y_l</text>
<text x="380.0" y="94.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">同一提示下落败的一方</text>
<text x="36.0" y="150.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">最优策略下，奖励可以写回策略</text>
<text x="36.0" y="182.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">r(y) = β log(π*(y) / π_ref(y)) + β log Z(x)</text>
<rect x="36.0" y="214.0" width="888.0" height="120.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="56.0" y="242.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">两份回答相减</text>
<text x="56.0" y="274.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">r(y_w) − r(y_l) = β log π*(y_w)/π_ref(y_w) − β log π*(y_l)/π_ref(y_l)</text>
<text x="56.0" y="306.0" fill="#526068" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">两边的 β log Z(x) 相同，相减后消失。比较不再需要单独的奖励网络。</text>
<text x="36.0" y="364.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">训练时把 π* 换成正在学习的 π_θ，让这个差经过 sigmoid 之后接近 1。</text>
<text x="28.0" y="400.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">这里的 π* 是 KL 约束下的最优策略，π_ref 是参考模型。Z(x) 是把参考模型按 exp(r/β) 重新加权后的配分函数，它只依赖提示，不依赖哪一份回答。</text>
<text x="28.0" y="417.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">基本的 DPO 在固定的偏好数据上训练，训练过程中不再从更新后的策略继续采样。</text>
</svg>

<rect x="28.0" y="352.0" width="904.0" height="112.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="48.0" y="364.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">再对 Value 加权求和</text>
<text x="48.0" y="396.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">0.6×(2, 0) + 0.3×(0, 2) + 0.1×(2, 2) = (1.2, 0) + (0, 0.6) + (0.2, 0.2)</text>
<text x="48.0" y="428.0" fill="#E07B2A" fill-opacity="1.0" font-size="18" font-weight="700" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">= (1.4, 0.8)</text>
<text x="230.0" y="428.0" fill="#526068" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">这一位读到的上下文</text>
<text x="28.0" y="490.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">分数整体加一个常数，softmax 不变，所以最大的缩放点积写成 0，另外两个正好是 ln(1/2) 和 ln(1/6)。</text>
<text x="28.0" y="507.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">Value 的坐标是为了把加权求和算完而设的示意，不是模型里的真实向量。点积已经除过 √d_k。</text>

<rect x="36.0" y="70.0" width="170.0" height="90.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="121.0" y="106.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">实验曲线</text>
<text x="121.0" y="126.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">一张图像</text>
<line x1="58.0" y1="130.0" x2="110.0" y2="92.0" stroke="#4C78A8" stroke-width="1.6" stroke-linecap="round"/>
<line x1="58.0" y1="118.0" x2="150.0" y2="108.0" stroke="#E07B2A" stroke-width="1.6" stroke-linecap="round"/>
<rect x="36.0" y="190.0" width="170.0" height="70.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="121.0" y="216.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">比较两条曲线</text>
<text x="121.0" y="236.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">一句文字</text>
<line x1="206.0" y1="115.0" x2="270.0" y2="115.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<line x1="206.0" y1="225.0" x2="270.0" y2="160.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="270.0" y="80.0" width="180.0" height="70.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="360.0" y="106.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">视觉编码器</text>
<text x="360.0" y="126.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">图像或视频帧</text>
<rect x="270.0" y="190.0" width="180.0" height="70.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="360.0" y="216.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">分词 + 嵌入</text>
<text x="360.0" y="236.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">文字</text>
<line x1="450.0" y1="115.0" x2="520.0" y2="150.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<line x1="450.0" y1="225.0" x2="520.0" y2="190.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="520.0" y="140.0" width="160.0" height="70.0" rx="6" fill="#8E6899" fill-opacity="0.14" stroke="#8E6899" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="600.0" y="166.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">投影</text>
<text x="600.0" y="186.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">对齐到同一维度</text>
<line x1="680.0" y1="175.0" x2="740.0" y2="175.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="740.0" y="140.0" width="180.0" height="70.0" rx="6" fill="#3E9B96" fill-opacity="0.14" stroke="#3E9B96" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="830.0" y="166.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">语言模型</text>
<text x="830.0" y="186.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">一起读这些向量</text>
<text x="740.0" y="240.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">输出通常仍是文字</text>
<text x="36.0" y="300.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">视频是带时间的画面，可以走视觉这条路。音频用自己的编码器，再投影进来。</text>
<text x="36.0" y="328.0" fill="#526068" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">生成图像或语音要另接解码器，不是每个多模态模型都有。</text>
<text x="28.0" y="364.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">图对应讲义里的理解路径：曲线和句子一起成为输入。Qwen3-VL 这类模型把文字、图像和视频接到同一个骨干上。</text>
<text x="28.0" y="381.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">投影层的作用是把不同编码器的向量变到语言模型使用的维度，不是再做一次分词。</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="413" viewBox="0 0 960 413" role="img">
<title>多模态模型怎样接上语言模型</title>
<desc>各模态先变成向量，投影到同一维度，再进入骨干网络。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>

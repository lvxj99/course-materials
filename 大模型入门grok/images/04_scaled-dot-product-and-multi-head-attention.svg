<text x="817.0" y="303.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">回到 T × d</text>
<text x="28.0" y="340.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">常见等宽设计：d_k = d_v = d / h。原论文基础模型 d = 512，h = 8，所以每个头 64 维，前馈层宽 2048。</text>
<text x="28.0" y="384.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(c)</text>

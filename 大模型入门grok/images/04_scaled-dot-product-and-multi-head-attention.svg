<text x="820.0" y="458.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">T × d_v</text>
<line x1="690.0" y1="447.0" x2="720.0" y2="447.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<text x="28.0" y="508.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">T 和 S 可以不同，所以交叉注意力的分数矩阵不一定是方阵。对源序列没有因果遮挡，每个译文位置都能读全部原文。</text>
<text x="28.0" y="525.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">各头的分工是训练出来的，图里不给它们指定句法角色。</text>

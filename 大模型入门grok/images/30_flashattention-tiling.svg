<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="481" viewBox="0 0 960 481" role="img">
<title>FlashAttention 与显存墙</title>
<desc>标准注意力把 T×T 矩阵写入显存；分块算法把中间结果留在片上。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="28.0" y="24.0" width="448.0" height="390.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="44.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(a)</text>
<text x="72.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">标准实现</text>
<rect x="44.0" y="72.0" width="170.0" height="52.0" rx="6" fill="#8A847C" fill-opacity="0.14" stroke="#8A847C" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="129.0" y="89.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">HBM 里的 Q K V</text>
<text x="129.0" y="109.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">容量大，带宽紧</text>
<line x1="129.0" y1="124.0" x2="129.0" y2="148.0" stroke="#C4922A" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mkC4922A)"/>
<rect x="44.0" y="148.0" width="170.0" height="48.0" rx="6" fill="#C4922A" fill-opacity="0.14" stroke="#C4922A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="129.0" y="163.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">SRAM 算一小块</text>
<text x="129.0" y="183.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">很快，但很小</text>
<line x1="214.0" y1="172.0" x2="250.0" y2="172.0" stroke="#D4544E" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mkD4544E)"/>
<rect x="250.0" y="146.0" width="190.0" height="56.0" rx="6" fill="#D4544E" fill-opacity="0.14" stroke="#D4544E" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="345.0" y="165.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">整张 T × T</text>
<text x="345.0" y="185.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">写进 HBM 再读回</text>
<text x="250.0" y="224.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">中间矩阵落在慢速显存里。</text>
<text x="44.0" y="330.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">序列一长，搬运 T×T 矩阵的时间</text>
<text x="44.0" y="354.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">会盖过矩阵乘法本身。</text>
<text x="44.0" y="384.0" fill="#D4544E" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">算力在等数据。这就是 memory wall。</text>
<rect x="492.0" y="24.0" width="440.0" height="390.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="508.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(b)</text>
<text x="536.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">FlashAttention</text>
<rect x="508.0" y="78.0" width="180.0" height="70.0" rx="6" fill="#8A847C" fill-opacity="0.14" stroke="#8A847C" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="598.0" y="104.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">HBM 里只留</text>
<text x="598.0" y="124.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">Q、K、V 和输出 O</text>
<rect x="508.0" y="170.0" width="180.0" height="78.0" rx="6" fill="#C4922A" fill-opacity="0.14" stroke="#C4922A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="598.0" y="200.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">SRAM 里的一块</text>
<text x="598.0" y="220.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">这一块的 softmax 与累加</text>
<line x1="598.0" y1="148.0" x2="598.0" y2="170.0" stroke="#C4922A" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mkC4922A)"/>
<text x="708.0" y="100.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">按块读入</text>
<text x="708.0" y="196.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">不把整张</text>
<text x="708.0" y="214.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">T×T 写回去</text>
<text x="508.0" y="276.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">反向传播时中间分数没有保存，</text>
<text x="508.0" y="300.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">就再算一遍注意力。</text>
<text x="508.0" y="336.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">多算的那一点，远少于少搬一次大矩阵。</text>
<text x="508.0" y="368.0" fill="#4E8C46" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">结果与标准注意力相同。</text>
<text x="28.0" y="432.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">相同是指算法本身是精确的，差别只在浮点误差。它没有改变 Q、K、V 和 softmax 的定义，改变的是计算和存储的顺序。</text>
<text x="28.0" y="449.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">HBM 是显卡上的大显存，SRAM 是靠计算单元更近的小缓存。图里的方块表示存放位置，不是某一张真实的地址布局。</text>
</svg>

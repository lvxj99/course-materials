<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="449" viewBox="0 0 960 449" role="img">
<title>合批、吞吐与延迟</title>
<desc>权重复用提高吞吐；批次变大后延迟上升，吞吐会碰到上限。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="28.0" y="24.0" width="430.0" height="360.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="44.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(a)</text>
<text x="72.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">一次读出权重，服务多个序列</text>
<rect x="44.0" y="78.0" width="160.0" height="64.0" rx="6" fill="#8A847C" fill-opacity="0.14" stroke="#8A847C" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="124.0" y="101.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">模型权重</text>
<text x="124.0" y="121.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">从显存读一遍</text>
<line x1="204.0" y1="100.0" x2="248.0" y2="100.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<polyline points="204.0,120.0 232.0,120.0 232.0,176.0 250.0,176.0" fill="none" fill-opacity="1.0" stroke="#1F2A30" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<text x="250.0" y="86.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">批次 1</text>
<rect x="250.0" y="98.0" width="58.6" height="26.0" rx="5" fill="#E07B2A" fill-opacity="0.12" stroke="#E07B2A" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="279.3" y="111.0" fill="#1F2A30" fill-opacity="1.0" font-size="12" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">序列 A</text>
<text x="250.0" y="150.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">批次 B</text>
<rect x="250.0" y="164.0" width="58.6" height="26.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="279.3" y="177.0" fill="#1F2A30" fill-opacity="1.0" font-size="12" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">序列 A</text>
<rect x="336.0" y="164.0" width="58.6" height="26.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="365.3" y="177.0" fill="#1F2A30" fill-opacity="1.0" font-size="12" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">序列 B</text>
<rect x="250.0" y="198.0" width="58.6" height="26.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="279.3" y="211.0" fill="#1F2A30" fill-opacity="1.0" font-size="12" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">序列 C</text>
<rect x="336.0" y="198.0" width="58.6" height="26.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="365.3" y="211.0" fill="#1F2A30" fill-opacity="1.0" font-size="12" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">序列 D</text>
<text x="44.0" y="268.0" fill="#1F2A30" fill-opacity="1.0" font-size="13.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">权重的这次读取摊到 B 个序列上。</text>
<text x="44.0" y="292.0" fill="#1F2A30" fill-opacity="1.0" font-size="13.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">每个序列自己的 KV cache 仍要分别读。</text>
<text x="44.0" y="316.0" fill="#526068" fill-opacity="1.0" font-size="13.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">省下的是权重搬运，不是全部显存流量。</text>
<text x="44.0" y="348.0" fill="#526068" fill-opacity="1.0" font-size="13.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">单序列时，算力常常在等数据。</text>
<rect x="478.0" y="24.0" width="220.0" height="250.0" rx="6" fill="#FBFBFA" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<line x1="514.0" y1="40.0" x2="514.0" y2="246.0" stroke="#C9C4BC" stroke-width="1.1" stroke-linecap="round"/>
<line x1="514.0" y1="246.0" x2="684.0" y2="246.0" stroke="#C9C4BC" stroke-width="1.1" stroke-linecap="round"/>
<polyline points="517.4,229.5 537.8,184.2 558.2,138.9 582.0,97.7 607.5,68.8 633.0,58.5 656.8,56.5 677.2,56.5" fill="none" fill-opacity="1.0" stroke="#4C78A8" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
<text x="599.0" y="262.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">批次大小</text>
<text x="486.0" y="38.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">吞吐</text>
<circle cx="551.4" cy="153.3" r="4.5" fill="#E07B2A" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="557.4" y="167.3" fill="#E07B2A" fill-opacity="1.0" font-size="11.5" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">Fast</text>
<circle cx="646.6" cy="57.5" r="4.5" fill="#4C78A8" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="612.6" y="73.5" fill="#4C78A8" fill-opacity="1.0" font-size="11.5" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">标准</text>
<rect x="710.0" y="24.0" width="220.0" height="250.0" rx="6" fill="#FBFBFA" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<line x1="746.0" y1="40.0" x2="746.0" y2="246.0" stroke="#C9C4BC" stroke-width="1.1" stroke-linecap="round"/>
<line x1="746.0" y1="246.0" x2="916.0" y2="246.0" stroke="#C9C4BC" stroke-width="1.1" stroke-linecap="round"/>
<polyline points="752.8,213.0 780.0,192.4 807.2,163.6 834.4,130.6 865.0,93.6 895.6,56.5" fill="none" fill-opacity="1.0" stroke="#D4544E" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
<text x="831.0" y="262.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">批次大小</text>
<text x="718.0" y="38.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">P95 延迟</text>
<circle cx="786.8" cy="184.2" r="4.5" fill="#E07B2A" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="792.8" y="176.2" fill="#E07B2A" fill-opacity="1.0" font-size="11.5" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">Fast</text>
<circle cx="868.4" cy="89.4" r="4.5" fill="#D4544E" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="1.4"/>
<text x="832.4" y="77.4" fill="#D4544E" fill-opacity="1.0" font-size="11.5" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">标准</text>
<text x="478.0" y="300.0" fill="#526068" fill-opacity="1.0" font-size="12.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">两条曲线都是定性形状，不是测量数据，坐标也没有真实刻度。</text>
<text x="478.0" y="324.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">吞吐先升后平：算力或带宽打满之后，再加大批次不再提高吞吐。</text>
<text x="478.0" y="348.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">延迟随批次上升，因为要等凑批，单步计算也更久。</text>
<text x="28.0" y="400.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">标准档把批次做大，单位 token 的成本低。Fast 档主动限制批次、减少排队，延迟更好，同样的权重搬运被更少的 token 分摊，所以单价更高。</text>
<text x="28.0" y="417.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">P95 指较慢的那部分请求。图上的点只标出两种经营方式落在曲线的哪一侧。</text>
</svg>

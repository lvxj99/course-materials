<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="329" viewBox="0 0 960 329" role="img">
<title>投机解码</title>
<desc>小模型先写一段草稿，主模型用一次前向验收。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<text x="28.0" y="36.0" fill="#526068" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">草稿模型较快，一次写几个 token</text>
<rect x="28.0" y="56.0" width="36.3" height="32.0" rx="5" fill="#8A847C" fill-opacity="0.12" stroke="#8A847C" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="46.1" y="72.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">习</text>
<line x1="74.0" y1="72.0" x2="90.0" y2="72.0" stroke="#8A847C" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8A847C)"/>
<rect x="106.0" y="56.0" width="36.3" height="32.0" rx="5" fill="#8A847C" fill-opacity="0.12" stroke="#8A847C" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="124.1" y="72.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">惯</text>
<line x1="152.0" y1="72.0" x2="168.0" y2="72.0" stroke="#8A847C" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8A847C)"/>
<rect x="184.0" y="56.0" width="36.3" height="32.0" rx="5" fill="#8A847C" fill-opacity="0.12" stroke="#8A847C" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="202.1" y="72.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">上</text>
<line x1="230.0" y1="72.0" x2="246.0" y2="72.0" stroke="#8A847C" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk8A847C)"/>
<rect x="262.0" y="56.0" width="36.3" height="32.0" rx="5" fill="#8A847C" fill-opacity="0.12" stroke="#8A847C" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="280.1" y="72.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">下</text>
<text x="360.0" y="72.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">串行，但是便宜</text>
<rect x="28.0" y="112.0" width="300.0" height="36.0" rx="6" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.25" stroke-opacity="1.0"/>
<text x="178.0" y="130.0" fill="#4C78A8" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">主模型一次前向，并行看这四步</text>
<text x="28.0" y="176.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">按接受规则留下前缀，第一处不一致就改写，后面的草稿作废</text>
<rect x="28.0" y="200.0" width="120.0" height="56.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="88.0" y="219.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">习</text>
<text x="88.0" y="239.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">留下</text>
<rect x="164.0" y="200.0" width="120.0" height="56.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="224.0" y="219.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">惯</text>
<text x="224.0" y="239.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">留下</text>
<rect x="300.0" y="200.0" width="120.0" height="56.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="360.0" y="219.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">中</text>
<text x="360.0" y="239.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">改写</text>
<rect x="436.0" y="200.0" width="120.0" height="56.0" rx="6" fill="#D4544E" fill-opacity="0.14" stroke="#D4544E" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="496.0" y="219.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">下</text>
<text x="496.0" y="239.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">丢弃</text>
<text x="28.0" y="280.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">标准的接受—拒绝规则保证：这样采样的分布和主模型自己逐步采样相同，只是串行的步数更少。</text>
<text x="28.0" y="297.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">图里的“习 / 惯 / 中”是示意的接受结果，不是一次真实推理。多 token 预测可以为主模型提供这种草稿。</text>
</svg>

<text x="28.0" y="377.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">等 s2 的价值被学到 1 附近，下一次访问 s1 时，TD 目标才会变成 0.9。价值是倒着、一步一步传回去的。</text>

<text x="48.0" y="292.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">结局是好的。向北、开门、拿钥匙、到达，各分到多少功劳？</text>
<text x="28.0" y="328.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">这是信用分配问题。监督学习在每一步都有目标；这里的学习信号要等轨迹结束后才出现，而且并不自带“哪一步造成了它”的标注。</text>

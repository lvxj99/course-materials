<title>智能体与环境</title>
<desc>动作进入环境，环境返回奖励和下一状态。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="48.0" y="36.0" width="300.0" height="180.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="198.0" y="64.0" fill="#4C78A8" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">智能体</text>
<text x="198.0" y="96.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">看见状态  s_t</text>
<text x="198.0" y="122.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">按策略  π(a | s)  选动作</text>
<text x="198.0" y="148.0" fill="#E07B2A" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">动作  a_t</text>
<text x="198.0" y="176.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">策略本身可以是随机的</text>
<rect x="560.0" y="36.0" width="340.0" height="180.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="730.0" y="64.0" fill="#4E8C46" fill-opacity="1.0" font-size="16" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">环境</text>
<text x="730.0" y="100.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">收下 a_t</text>
<text x="730.0" y="128.0" fill="#C4922A" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">给出奖励  r(t+1)</text>
<text x="730.0" y="156.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">进入下一状态  s(t+1)</text>
<text x="730.0" y="184.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">转移也可以是随机的</text>
<line x1="360.0" y1="90.0" x2="548.0" y2="90.0" stroke="#E07B2A" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mkE07B2A)"/>
<text x="454.0" y="78.0" fill="#E07B2A" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">a_t</text>
<line x1="548.0" y1="160.0" x2="360.0" y2="160.0" stroke="#4E8C46" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mk4E8C46)"/>
<text x="454.0" y="148.0" fill="#4E8C46" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">r(t+1) ,  s(t+1)</text>
<text x="48.0" y="250.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">一条轨迹把这些接起来</text>
<rect x="48.0" y="268.0" width="37.7" height="32.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="66.8" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">s0</text>
<rect x="93.7" y="268.0" width="37.7" height="32.0" rx="5" fill="#E07B2A" fill-opacity="0.12" stroke="#E07B2A" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="112.5" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">a0</text>
<rect x="139.4" y="268.0" width="34.3" height="32.0" rx="5" fill="#C4922A" fill-opacity="0.12" stroke="#C4922A" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="156.5" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">r1</text>
<rect x="181.7" y="268.0" width="34.3" height="32.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="198.8" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">s1</text>
<rect x="224.0" y="268.0" width="34.3" height="32.0" rx="5" fill="#E07B2A" fill-opacity="0.12" stroke="#E07B2A" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="241.2" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">a1</text>
<rect x="266.3" y="268.0" width="37.7" height="32.0" rx="5" fill="#C4922A" fill-opacity="0.12" stroke="#C4922A" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="285.2" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">r2</text>
<rect x="312.0" y="268.0" width="37.7" height="32.0" rx="5" fill="#4C78A8" fill-opacity="0.12" stroke="#4C78A8" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="330.8" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">s2</text>
<rect x="357.7" y="268.0" width="29.8" height="32.0" rx="5" fill="#8A847C" fill-opacity="0.12" stroke="#8A847C" stroke-width="1.2" stroke-opacity="1.0"/>
<text x="372.6" y="284.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="500" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">…</text>
<text x="48.0" y="330.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">从 t 往后的折扣回报</text>
<text x="48.0" y="358.0" fill="#1F2A30" fill-opacity="1.0" font-size="18" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">G(t) = r(t+1) + γ r(t+2) + γ² r(t+3) + …</text>
<text x="48.0" y="390.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">γ 越接近 1，越在乎以后；越接近 0，越只看眼前。</text>
<text x="28.0" y="424.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">奖励写成 r(t+1)，和后文公式一致：先做动作 a(t)，再收到奖励并到达 s(t+1)。</text>
<text x="28.0" y="441.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">要优化的是回报的期望。状态价值 V 和动作价值 Q 是这个期望在不同条件下的名字，见下文。</text>
</svg>

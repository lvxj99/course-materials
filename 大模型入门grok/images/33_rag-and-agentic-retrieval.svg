<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="461" viewBox="0 0 960 461" role="img">
<title>检索增强，以及把检索交给模型</title>
<desc>文档留在模型外面；模型每次只把用到的片段放进上下文。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="28.0" y="24.0" width="446.0" height="300.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="44.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(a)</text>
<text x="72.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">经典 RAG</text>
<rect x="60.0" y="78.0" width="360.0" height="42.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="240.0" y="99.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">问题</text>
<line x1="240.0" y1="120.0" x2="240.0" y2="136.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="60.0" y="136.0" width="360.0" height="42.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="240.0" y="157.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">检索相关片段</text>
<line x1="240.0" y1="178.0" x2="240.0" y2="194.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="60.0" y="194.0" width="360.0" height="42.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="240.0" y="215.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">片段和问题一起进入上下文</text>
<line x1="240.0" y1="236.0" x2="240.0" y2="252.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="60.0" y="252.0" width="360.0" height="42.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="240.0" y="273.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">按资料生成回答</text>
<rect x="490.0" y="24.0" width="442.0" height="300.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="506.0" y="48.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start" dominant-baseline="middle">(b)</text>
<text x="534.0" y="48.0" fill="#1F2A30" fill-opacity="1.0" font-size="15" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">由模型决定查什么</text>
<rect x="540.0" y="80.0" width="300.0" height="48.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="690.0" y="104.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">模型看过当前结果</text>
<line x1="690.0" y1="128.0" x2="690.0" y2="156.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="540.0" y="156.0" width="300.0" height="48.0" rx="6" fill="#3E9B96" fill-opacity="0.14" stroke="#3E9B96" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="690.0" y="180.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">再调用搜索、grep 或数据库</text>
<line x1="690.0" y1="204.0" x2="690.0" y2="232.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="540.0" y="232.0" width="300.0" height="48.0" rx="6" fill="#8E6899" fill-opacity="0.14" stroke="#8E6899" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="690.0" y="256.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">决定还要不要再查</text>
<text x="28.0" y="348.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">资料更新时改的是文档，不是模型权重。</text>
<text x="28.0" y="376.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">稳定、可预期的查询用经典 RAG 更省；要多步核对时，把“查什么”交给模型更灵活。</text>
<text x="28.0" y="412.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">检索可以是关键词，也可以是把问题和片段都编成向量再比相似度。两种做法都能给经典 RAG 用。</text>
<text x="28.0" y="429.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">模型决定查询之后，真正的查找仍可以由一个专门的检索器完成。</text>
</svg>

<text x="28.0" y="382.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">z = μ + σ⊙ε 是重参数化：随机性来自 ε，μ 和 σ 仍能收到梯度。生成时直接从先验抽样，不再把某张输入编码一遍。</text>
<text x="28.0" y="399.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">训练损失是讲义里的重建负对数概率加上 KL，也就是在最小化负 ELBO。</text>

<text x="28.0" y="342.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">图里不画每一步的概率，避免把示意分布误当成模型输出。温度、top-k 和 top-p 决定“怎样从分布里选”，见后文。</text>
<text x="28.0" y="359.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">训练时可以用右移一位的整句同时算所有位置的损失；真正生成时必须等新 token 接回去，才能算下一步。</text>

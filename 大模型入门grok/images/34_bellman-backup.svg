<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="481" viewBox="0 0 960 481" role="img">
<title>贝尔曼方程的一步回溯</title>
<desc>当前价值等于这一步的期望奖励，加上折扣后的下一状态价值。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="40.0" y="150.0" width="120.0" height="64.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="100.0" y="173.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">状态 s</text>
<text x="100.0" y="193.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">现在在这里</text>
<line x1="160.0" y1="166.0" x2="250.0" y2="100.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<line x1="160.0" y1="198.0" x2="250.0" y2="250.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="250.0" y="70.0" width="140.0" height="52.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="320.0" y="87.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">动作 a</text>
<text x="320.0" y="107.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">按 π 选出</text>
<rect x="250.0" y="230.0" width="140.0" height="52.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="320.0" y="247.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">另一个动作</text>
<text x="320.0" y="267.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">π 给出概率</text>
<line x1="390.0" y1="96.0" x2="500.0" y2="96.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<line x1="390.0" y1="256.0" x2="500.0" y2="256.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="500.0" y="70.0" width="180.0" height="52.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="590.0" y="87.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">s′</text>
<text x="590.0" y="107.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">R + γ V(s′)</text>
<rect x="500.0" y="230.0" width="180.0" height="52.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="590.0" y="247.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">s″</text>
<text x="590.0" y="267.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">R + γ V(s″)</text>
<text x="40.0" y="330.0" fill="#1F2A30" fill-opacity="1.0" font-size="16" font-weight="400" font-style="italic" font-family="Georgia, 'Palatino Linotype', 'Songti SC', serif" text-anchor="start">V(s) = Σ_a π(a|s) Σ_s′ P(s′|s,a) [ R(s,a,s′) + γ V(s′) ]</text>
<text x="40.0" y="366.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">图里只展开了两个动作、各自一个下一状态。公式里的求和把其余分支也算进去。</text>
<text x="40.0" y="396.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">它没有新的假设：只是把 G(t) = r(t+1) + γ G(t+1) 取了期望。</text>
<text x="28.0" y="432.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">最优方程把对动作的加权平均换成 max。价值方法用这个递归做动态规划或时序差分，就不必真的把无限长的回报加到底。</text>
<text x="28.0" y="449.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">P 和 R 是环境的转移和奖励。策略 π 决定动作的概率。</text>
</svg>

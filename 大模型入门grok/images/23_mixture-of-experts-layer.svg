<rect x="370.0" y="264.0" width="3.9" height="22.0" rx="3" fill="#E7E3DC" fill-opacity="1.0" stroke="none"/>
<text x="538.0" y="275.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">专家 7</text>
<rect x="370.0" y="300.0" width="3.9" height="22.0" rx="3" fill="#E7E3DC" fill-opacity="1.0" stroke="none"/>
<text x="538.0" y="311.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start" dominant-baseline="middle">专家 8</text>
<text x="370.0" y="348.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">图中 8 选 2，只为看清路由。</text>
<text x="370.0" y="370.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">选中的输出按权重加起来。</text>
<rect x="700.0" y="48.0" width="230.0" height="250.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="716.0" y="76.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">始终要算的部分</text>
<text x="716.0" y="108.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">注意力和其他共享层</text>
<text x="716.0" y="132.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">每个 token 都经过。</text>
<text x="716.0" y="170.0" fill="#4C78A8" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">DeepSeek-V4-Pro</text>
<text x="716.0" y="198.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">总参数约 1.6T</text>
<text x="716.0" y="220.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">每 token 激活约 49B</text>
<text x="716.0" y="250.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">1 个共享专家</text>
<text x="716.0" y="272.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">384 个路由专家里选 6 个</text>
<text x="28.0" y="400.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">专家是一起训练出来的子网络，分工随数据形成，不是事先指定的学科。专家之间还要通信，负载不均会吃掉稀疏结构的收益。</text>
<text x="28.0" y="417.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">左侧的 8 选 2 不是 V4-Pro 的配置。右侧数字来自该模型的公开说明，用来区分总参数和激活参数。</text>
</svg>

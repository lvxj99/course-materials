<text x="470.0" y="246.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">分析数据并写成报告</text>
<text x="28.0" y="430.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">观察会回到下一轮的感知。执行可以是读文件、跑代码、检索或检查结果；模型负责理解和生成。</text>
<text x="28.0" y="447.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">五个词按讲义的顺序：感知、推理、规划、执行、观察。箭头是直线，画在圆周上，避免挡住文字。</text>

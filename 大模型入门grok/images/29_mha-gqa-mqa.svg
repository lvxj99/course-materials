<text x="28.0" y="407.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">Query 头保持较多，不同头仍可以有自己的查询；共享的是被读取的 Key 和 Value。</text>

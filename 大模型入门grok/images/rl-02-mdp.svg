<text x="848.0" y="323.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">折扣</text>
<text x="28.0" y="368.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">马尔可夫性说的是：给定现在的状态和动作，下一步的分布不再依赖更早的历史。它是建模时的选择。语言模型里，我们把当前上下文当作这个状态。</text>

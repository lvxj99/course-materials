<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="373" viewBox="0 0 960 373" role="img">
<title>预训练、后训练、再使用</title>
<desc>先从材料里学规律，再用示范和评价把行为调准。</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="mk1F2A30" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1F2A30"/></marker><marker id="mk3E9B96" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#3E9B96"/></marker><marker id="mk4C78A8" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4C78A8"/></marker><marker id="mk4E8C46" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#4E8C46"/></marker><marker id="mk8A847C" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8A847C"/></marker><marker id="mk8E6899" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8E6899"/></marker><marker id="mkC4922A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C4922A"/></marker><marker id="mkC9C4BC" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#C9C4BC"/></marker><marker id="mkD4544E" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#D4544E"/></marker><marker id="mkE07B2A" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="8" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#E07B2A"/></marker></defs>
<rect x="28.0" y="70.0" width="168.0" height="48.0" rx="6" fill="#4C78A8" fill-opacity="0.14" stroke="#4C78A8" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="112.0" y="94.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">预训练</text>
<text x="112.0" y="142.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">海量文本上的</text>
<text x="112.0" y="162.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">下一 token</text>
<text x="112.0" y="192.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">得到基座模型</text>
<line x1="196.0" y1="94.0" x2="214.0" y2="94.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="214.0" y="70.0" width="168.0" height="48.0" rx="6" fill="#3E9B96" fill-opacity="0.14" stroke="#3E9B96" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="298.0" y="94.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">指令微调</text>
<text x="298.0" y="142.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">问题配一份</text>
<text x="298.0" y="162.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">示范回答</text>
<text x="298.0" y="192.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">学会按要求答</text>
<line x1="382.0" y1="94.0" x2="400.0" y2="94.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="400.0" y="70.0" width="168.0" height="48.0" rx="6" fill="#E07B2A" fill-opacity="0.14" stroke="#E07B2A" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="484.0" y="94.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">偏好优化</text>
<text x="484.0" y="142.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">同一问题的</text>
<text x="484.0" y="162.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">两个回答比一比</text>
<text x="484.0" y="192.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">更可取的更常出现</text>
<line x1="568.0" y1="94.0" x2="586.0" y2="94.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="586.0" y="70.0" width="168.0" height="48.0" rx="6" fill="#4E8C46" fill-opacity="0.14" stroke="#4E8C46" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="670.0" y="94.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">可验证奖励</text>
<text x="670.0" y="142.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">答案、测试、</text>
<text x="670.0" y="162.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">格式能判定</text>
<text x="670.0" y="192.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">可判定的题更稳</text>
<line x1="754.0" y1="94.0" x2="772.0" y2="94.0" stroke="#1F2A30" stroke-width="1.55" stroke-linecap="round" marker-end="url(#mk1F2A30)"/>
<rect x="772.0" y="70.0" width="168.0" height="48.0" rx="6" fill="#8A847C" fill-opacity="0.14" stroke="#8A847C" stroke-width="1.35" stroke-opacity="1.0"/>
<text x="856.0" y="94.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="600" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle">使用</text>
<text x="856.0" y="142.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">权重保持不动</text>
<text x="856.0" y="162.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">条件来自上下文</text>
<text x="856.0" y="192.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">任务放进这一次的输入</text>
<line x1="28.0" y1="230.0" x2="754.0" y2="230.0" stroke="#3E9B96" stroke-width="1.5" stroke-linecap="round"/>
<text x="28.0" y="252.0" fill="#3E9B96" fill-opacity="1.0" font-size="14" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">后训练：指令、偏好、可验证奖励可以组合，不必三选一。</text>
<text x="28.0" y="286.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">使用时不再改权重。提示、材料和例子都只是这一次的条件。</text>
<text x="28.0" y="324.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">预训练的损失是每个位置的下一 token 负对数概率。文本自己提供输入和目标。</text>
<text x="28.0" y="341.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">基座模型会续写；后训练把它继续训练成更能按要求回答的模型。</text>
</svg>

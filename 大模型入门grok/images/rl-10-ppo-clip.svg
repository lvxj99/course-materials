<text x="724.0" y="330.0" fill="#526068" fill-opacity="1.0" font-size="12" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="middle">概率比率  π_new / π_old</text>
<text x="28.0" y="384.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">变平的那一段对比率的梯度是 0：正优势不再鼓励把概率提得更高，负优势也不再鼓励把概率压得更低。</text>
<text x="28.0" y="401.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">这限制的是旧样本继续把策略往外推的动力。它并不是在采样之前把比率硬性限制在区间里。ε = 0.2 是常用默认值，不是定理给出的唯一常数。</text>

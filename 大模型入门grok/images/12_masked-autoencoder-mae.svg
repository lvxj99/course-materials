<text x="520.0" y="190.0" fill="#D4544E" fill-opacity="1.0" font-size="13" font-weight="650" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">损失主要算在被遮住的位置。</text>
<text x="520.0" y="214.0" fill="#526068" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">也就是这 27 个打叉的 patch。</text>
<rect x="250.0" y="250.0" width="470.0" height="78.0" rx="10" fill="#F6F5F2" fill-opacity="1.0" stroke="#E3E0DA" stroke-width="1" stroke-opacity="1.0"/>
<text x="266.0" y="276.0" fill="#1F2A30" fill-opacity="1.0" font-size="14" font-weight="700" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">和去噪自编码器的差别</text>
<text x="266.0" y="302.0" fill="#1F2A30" fill-opacity="1.0" font-size="13" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">去噪：整张图都进编码器。MAE：编码器看不到被遮住的 patch。</text>
<text x="28.0" y="348.0" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">75% 是 MAE 论文里常见的遮挡比例，不是必须唯一的数字。可见 patch 的位置在图里是固定挑的，用来数清楚 9 和 27。</text>
<text x="28.0" y="365.5" fill="#526068" fill-opacity="1.0" font-size="11.5" font-weight="400" font-style="normal" font-family="'Segoe UI', 'Microsoft YaHei', Helvetica, Arial, sans-serif" text-anchor="start">解码器要有位置编码，否则它不知道该把哪一块填回哪个格子。</text>
</svg>

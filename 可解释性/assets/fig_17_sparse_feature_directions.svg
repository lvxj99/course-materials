<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" width="960" height="534" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">把一条激活向量拆成少量方向</title>
<desc id="desc">字典里有三个方向。这次取两个方向，各自乘上激活量再相加。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="534" fill="#f7f9fc"/>
<rect x="36" y="24" width="64" height="38" rx="9" fill="#e7f0fa"/>
<text x="68" y="50" fill="#2866a0" font-size="19" font-weight="650" text-anchor="middle">图 17</text>
<text x="117" y="53" fill="#172b44" font-size="33" font-weight="700">把一条激活向量拆成少量方向</text>
<text x="36" y="94" fill="#485e75" font-size="22" font-weight="500">字典里有三个方向。这次取两个方向，各自乘上激活量再相加。</text>
<rect x="36" y="125" width="432" height="328" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/>
<rect x="492" y="125" width="432" height="328" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/>
<text x="57" y="165" fill="#172b44" font-size="25" font-weight="650">沿两个方向相加</text>
<rect x="99" y="198" width="325" height="213" fill="#ffffff"/><line x1="119" y1="198" x2="119" y2="411" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="219" y1="198" x2="219" y2="411" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="319" y1="198" x2="319" y2="411" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="419" y1="198" x2="419" y2="411" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="99" y1="381" x2="424" y2="381" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="99" y1="301" x2="424" y2="301" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="99" y1="221" x2="424" y2="221" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/>
<line x1="119" y1="411" x2="119" y2="198" stroke="#91a4b7" stroke-width="1.5" stroke-linecap="round"/>
<line x1="99" y1="381" x2="424" y2="381" stroke="#91a4b7" stroke-width="1.5" stroke-linecap="round"/>
<line x1="119" y1="381" x2="379" y2="301" stroke="#2866a0" stroke-width="3.4" stroke-linecap="round"/><polyline points="371.07,310 379,301 367.38,298.01" fill="none" stroke="#2866a0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="119" y1="381" x2="319" y2="381" stroke="#087e78" stroke-width="3.4" stroke-linecap="round"/><polyline points="308.77,387.27 319,381 308.77,374.73" fill="none" stroke="#087e78" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="319" y1="381" x2="379" y2="301" stroke="#66529d" stroke-width="3.4" stroke-linecap="round"/><polyline points="377.88,312.95 379,301 367.84,305.42" fill="none" stroke="#66529d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="99" y1="198" x2="99" y2="411" stroke="#91a4b7" stroke-width="1.6" stroke-linecap="round"/><line x1="99" y1="411" x2="424" y2="411" stroke="#91a4b7" stroke-width="1.6" stroke-linecap="round"/><text x="119" y="439" fill="#485e75" font-size="20" font-weight="500" text-anchor="middle">0</text><text x="219" y="439" fill="#485e75" font-size="20" font-weight="500" text-anchor="middle">0.5</text><text x="319" y="439" fill="#485e75" font-size="20" font-weight="500" text-anchor="middle">1</text><text x="419" y="439" fill="#485e75" font-size="20" font-weight="500" text-anchor="middle">1.5</text><text x="86" y="388" fill="#485e75" font-size="20" font-weight="500" text-anchor="end">0</text><text x="86" y="308" fill="#485e75" font-size="20" font-weight="500" text-anchor="end">0.4</text><text x="86" y="228" fill="#485e75" font-size="20" font-weight="500" text-anchor="end">0.8</text>
<circle cx="119" cy="381" r="4.5" fill="#172b44"/>
<text x="212" y="329" fill="#2866a0" font-size="21" font-weight="650" text-anchor="middle">h = (1.3, 0.4)</text>
<text x="227" y="405" fill="#087e78" font-size="20" font-weight="650" text-anchor="middle">1.0 d₁</text>
<text x="364" y="364" fill="#66529d" font-size="20" font-weight="650">0.5 d₃</text>
<text x="513" y="165" fill="#172b44" font-size="25" font-weight="650">这次亮了哪几项</text>
<text x="625" y="204" fill="#485e75" font-size="21" font-weight="500" text-anchor="middle">字典方向</text>
<text x="817" y="204" fill="#485e75" font-size="21" font-weight="500" text-anchor="middle">激活量</text>
<rect x="512" y="218" width="390" height="54" rx="9" fill="#dff4ef"/><text x="625" y="253" fill="#087e78" font-size="24" font-weight="650" text-anchor="middle">d₁ = (1, 0)</text><text x="817" y="253" fill="#087e78" font-size="24" font-weight="650" text-anchor="middle">z₁ = 1.0</text>
<rect x="512" y="288" width="390" height="54" rx="9" fill="#f7f9fc"/><text x="625" y="323" fill="#485e75" font-size="24" font-weight="650" text-anchor="middle">d₂ = (0, 1)</text><text x="817" y="323" fill="#485e75" font-size="24" font-weight="650" text-anchor="middle">z₂ = 0.0</text>
<rect x="512" y="358" width="390" height="54" rx="9" fill="#eee8f8"/><text x="625" y="393" fill="#66529d" font-size="24" font-weight="650" text-anchor="middle">d₃ = (0.6, 0.8)</text><text x="817" y="393" fill="#66529d" font-size="24" font-weight="650" text-anchor="middle">z₃ = 0.5</text>
<rect x="36" y="468" width="888" height="51" rx="11" fill="#eee8f8"/><text x="480" y="501" fill="#66529d" font-size="23" font-weight="600" text-anchor="middle">把 z₃ 设为 0，从 h 中减去 0.5 d₃，得到 h′ = (1, 0)</text></svg>

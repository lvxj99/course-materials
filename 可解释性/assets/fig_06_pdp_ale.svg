<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" width="960" height="542" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">把一列改成同一个值，还是只在附近比较？</title>

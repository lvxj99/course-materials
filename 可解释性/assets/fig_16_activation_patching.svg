<text x="117" y="53" fill="#172b44" font-size="33" font-weight="700">只替换一格，再看答案分数</text>
<text x="36" y="94" fill="#485e75" font-size="22" font-weight="500">把参考运行中读到的向量，放进对照运行的同一层、同一位置。</text>

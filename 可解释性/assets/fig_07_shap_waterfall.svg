<rect x="36" y="445" width="888" height="51" rx="11" fill="#dff4ef"/><text x="480" y="478" fill="#087e78" font-size="23" font-weight="600" text-anchor="middle">0.8  +  0.7  +  0.5  =  2.0 nm</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 514" width="960" height="514" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">换个加入顺序，再平均每一项的贡献</title>
<desc id="desc">从低温、中心的参照走到高温、边缘的当前预测。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="514" fill="#f7f9fc"/>
<rect x="36" y="24" width="64" height="38" rx="9" fill="#e7f0fa"/>
<text x="68" y="50" fill="#2866a0" font-size="19" font-weight="650" text-anchor="middle">图 7</text>
<text x="117" y="53" fill="#172b44" font-size="33" font-weight="700">换个加入顺序，再平均每一项的贡献</text>
<text x="36" y="94" fill="#485e75" font-size="22" font-weight="500">从低温、中心的参照走到高温、边缘的当前预测。</text>
<rect x="36" y="125" width="449" height="305" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/>
<rect x="505" y="125" width="419" height="305" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/>

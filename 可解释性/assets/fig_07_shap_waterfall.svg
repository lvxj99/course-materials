<line x1="58" y1="273" x2="463" y2="273" stroke="#dce5ef" stroke-width="1.4" stroke-linecap="round"/>
<text x="59" y="313" fill="#172b44" font-size="25" font-weight="650">先放入位置</text><rect x="72" y="351" width="66" height="47" rx="8" fill="#e7f0fa"/><text x="105" y="382" fill="#2866a0" font-size="24" font-weight="650" text-anchor="middle">0.8</text><rect x="230" y="351" width="66" height="47" rx="8" fill="#f7f9fc"/><text x="263" y="382" fill="#2866a0" font-size="24" font-weight="650" text-anchor="middle">1.0</text><rect x="387" y="351" width="66" height="47" rx="8" fill="#e7f0fa"/><text x="420" y="382" fill="#2866a0" font-size="24" font-weight="650" text-anchor="middle">2.0</text><line x1="144" y1="375" x2="224" y2="375" stroke="#66529d" stroke-width="2.6" stroke-linecap="round"/><polyline points="213.77,381.27 224,375 213.77,368.73" fill="none" stroke="#66529d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="184" y="351" fill="#66529d" font-size="19" font-weight="600" text-anchor="middle">位置 +0.2</text><line x1="302" y1="375" x2="381" y2="375" stroke="#087e78" stroke-width="2.6" stroke-linecap="round"/><polyline points="370.77,381.27 381,375 370.77,368.73" fill="none" stroke="#087e78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="341.5" y="351" fill="#087e78" font-size="19" font-weight="600" text-anchor="middle">温度 +1.0</text>
<text x="525" y="167" fill="#172b44" font-size="25" font-weight="650">按顺序平均后的贡献</text>

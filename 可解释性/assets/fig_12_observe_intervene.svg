<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" width="960" height="546" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">工况占比一变，总平均的方向也会变</title>
<desc id="desc">把不同工况混在一起看，与让两组面对同样工况，得到两个方向。</desc>

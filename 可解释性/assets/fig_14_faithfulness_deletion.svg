<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" width="960" height="492" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">按解释指出的顺序替换，分数降得多快？</title>
<desc id="desc">固定一条样本和一个模型，每次再把一项替换成参照值 0。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>

<line x1="642" y1="143" x2="670" y2="143" stroke="#66529d" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round"/><text x="680" y="151" fill="#485e75" font-size="21" font-weight="500">随机顺序平均</text>
<rect x="118" y="167" width="747" height="226" fill="#ffffff"/><line x1="141.34" y1="167" x2="141.34" y2="393" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="374.78" y1="167" x2="374.78" y2="393" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="608.22" y1="167" x2="608.22" y2="393" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="841.66" y1="167" x2="841.66" y2="393" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="118" y1="366.92" x2="865" y2="366.92" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="118" y1="308.97" x2="865" y2="308.97" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="118" y1="251.03" x2="865" y2="251.03" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/><line x1="118" y1="193.08" x2="865" y2="193.08" stroke="#dce5ef" stroke-width="1.2" stroke-linecap="round"/>
<polyline points="141.34,193.08 374.78,308.97 608.22,366.92 841.66,366.92" fill="none" stroke="#2866a0" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

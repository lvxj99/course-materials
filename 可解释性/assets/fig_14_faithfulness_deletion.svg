<rect x="36" y="24" width="64" height="38" rx="9" fill="#e7f0fa"/>
<text x="68" y="50" fill="#2866a0" font-size="19" font-weight="650" text-anchor="middle">图 14</text>
<text x="117" y="53" fill="#172b44" font-size="33" font-weight="700">按解释指出的顺序替换，分数降得多快？</text>
<text x="36" y="94" fill="#485e75" font-size="22" font-weight="500">固定一条样本和一个模型，每次再把一项替换成参照值 0。</text>
<text x="118" y="151" fill="#485e75" font-size="21" font-weight="500">预测残差（nm）</text>

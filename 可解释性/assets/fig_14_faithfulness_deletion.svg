<circle cx="608.22" cy="308.97" r="7.6" fill="#ffffff" stroke="#66529d" stroke-width="2.6"/><circle cx="608.22" cy="366.92" r="5.3" fill="#2866a0" stroke="#ffffff" stroke-width="0.9"/>

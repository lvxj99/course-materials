<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">权重乘上值，才是传来的量</title>
<desc id="desc">一个注意力头读两个位置。用标量演示一次加权求和。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="960" height="464" fill="#f7f9fc"/>
<rect x="36" y="24" width="64" height="38" rx="9" fill="#e7f0fa"/>
<text x="68" y="50" fill="#2866a0" font-size="19" font-weight="650" text-anchor="middle">图 11</text>
<text x="117" y="53" fill="#172b44" font-size="33" font-weight="700">权重乘上值，才是传来的量</text>
<text x="36" y="94" fill="#485e75" font-size="22" font-weight="500">一个注意力头读两个位置。用标量演示一次加权求和。</text>
<text x="338" y="153" fill="#485e75" font-size="24" font-weight="650" text-anchor="middle">权重 aᵢ</text>
<text x="548" y="153" fill="#485e75" font-size="24" font-weight="650" text-anchor="middle">值 vᵢ</text>
<text x="764" y="153" fill="#485e75" font-size="24" font-weight="650" text-anchor="middle">乘积 aᵢvᵢ</text>
<rect x="36" y="173" width="888" height="92" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/><text x="63" y="226" fill="#172b44" font-size="25" font-weight="650">位置 1</text><text x="338" y="216" fill="#2866a0" font-size="29" font-weight="700" text-anchor="middle">0.80</text><rect x="273" y="231" width="130" height="10" rx="5" fill="#e7f0fa"/><rect x="273" y="231" width="104" height="10" rx="5" fill="#2866a0"/><text x="441" y="222" fill="#6d8093" font-size="27" font-weight="500" text-anchor="middle">×</text><text x="548" y="216" fill="#087e78" font-size="29" font-weight="700" text-anchor="middle">0.20</text><rect x="483" y="231" width="130" height="10" rx="5" fill="#dff4ef"/><rect x="483" y="231" width="13" height="10" rx="5" fill="#087e78"/><text x="656" y="222" fill="#6d8093" font-size="27" font-weight="500" text-anchor="middle">=</text><text x="764" y="216" fill="#66529d" font-size="29" font-weight="700" text-anchor="middle">0.16</text><rect x="699" y="231" width="130" height="10" rx="5" fill="#eee8f8"/><rect x="699" y="231" width="41.6" height="10" rx="5" fill="#66529d"/>
<rect x="36" y="277" width="888" height="92" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/><text x="63" y="330" fill="#172b44" font-size="25" font-weight="650">位置 2</text><text x="338" y="320" fill="#2866a0" font-size="29" font-weight="700" text-anchor="middle">0.20</text><rect x="273" y="335" width="130" height="10" rx="5" fill="#e7f0fa"/><rect x="273" y="335" width="26" height="10" rx="5" fill="#2866a0"/><text x="441" y="326" fill="#6d8093" font-size="27" font-weight="500" text-anchor="middle">×</text><text x="548" y="320" fill="#087e78" font-size="29" font-weight="700" text-anchor="middle">2.00</text><rect x="483" y="335" width="130" height="10" rx="5" fill="#dff4ef"/><rect x="483" y="335" width="130" height="10" rx="5" fill="#087e78"/><text x="656" y="326" fill="#6d8093" font-size="27" font-weight="500" text-anchor="middle">=</text><text x="764" y="320" fill="#66529d" font-size="29" font-weight="700" text-anchor="middle">0.40</text><rect x="699" y="335" width="130" height="10" rx="5" fill="#eee8f8"/><rect x="699" y="335" width="104" height="10" rx="5" fill="#66529d"/>
<rect x="36" y="390" width="888" height="51" rx="11" fill="#eee8f8"/><text x="480" y="423" fill="#66529d" font-size="23" font-weight="600" text-anchor="middle">相加得到这个头的输出  0.16 + 0.40 = 0.56</text></svg>

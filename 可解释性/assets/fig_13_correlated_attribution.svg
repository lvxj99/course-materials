<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 482" width="960" height="482" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">重复的温度信息，分到两列以后</title>
<desc id="desc">A 只用温度。B 同时用温度和完全相同的备份。两个模型的原始 MSE 都为 0。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;font-variant-numeric:tabular-nums}</style>

<text x="57" y="356" fill="#66529d" font-size="23" font-weight="500">模型 B · 两列成组</text><rect x="281" y="333" width="538" height="30" rx="4" fill="#66529d"/><text x="831" y="356" fill="#66529d" font-size="23" font-weight="650">18</text>

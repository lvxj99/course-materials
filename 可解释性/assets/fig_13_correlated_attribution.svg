<text x="68" y="50" fill="#2866a0" font-size="19" font-weight="650" text-anchor="middle">图 13</text>
<text x="117" y="53" fill="#172b44" font-size="33" font-weight="700">重复的温度信息，分到两列以后</text>
<text x="36" y="94" fill="#485e75" font-size="22" font-weight="500">A 只用温度。B 同时用温度和完全相同的备份。两个模型的原始 MSE 都为 0。</text>
<rect x="36" y="119" width="888" height="343" rx="14" fill="#ffffff" stroke="#dce5ef" stroke-width="1.4"/>

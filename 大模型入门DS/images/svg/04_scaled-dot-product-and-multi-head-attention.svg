<text x="40.00" y="462.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">图中画了 4 个头，实际 h 由模型决定（原论文 h = 8）。</text>

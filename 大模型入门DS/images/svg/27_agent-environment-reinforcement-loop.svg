<text x="120.00" y="366.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="14" text-anchor="start" fill="#1f2a33">Gₜ = rₜ₊₁ + γ·rₜ₊₂ + γ²·rₜ₊₃ + …</text>
<text x="120.00" y="396.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">训练目标是最大化期望回报 E[G_t]；γ ∈ [0, 1) 越接近 1，越在乎远期结果。V(s) 与 Q(s, a) 分别描述“在状态 s 下”“在 s 先做 a 再按 π 行动”的期望回报。</text>
<text x="120.00" y="418.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">与监督学习的差别：没有每一步的标准答案，只有行动之后的评价；奖励可能延迟、稀疏，且由环境或规则给出。</text>

<text x="40.00" y="352.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">合批让同一份权重同时服务多条序列，算术强度上升、单位成本下降；代价是排队等待与单步墙钟时间变长。</text>
<text x="40.00" y="372.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">吞吐 = batch ÷ 单步延迟；当延迟的增长快过 batch，边际收益就变负——所以 Fast / 标准两种模式按业务选。</text>
<text x="40.00" y="400.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#b6c1ca">P95 取的是尾部：平均值还好看时，最慢的那 5% 请求可能已经超时。</text>

<text x="396.00" y="172.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e">两次 Norm 各有自己的可学习参数：LayerNorm 有 γ、β，RMSNorm 只有缩放 g。</text>
<text x="396.00" y="190.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e">残差把 H 原样抄进下一行：信息与梯度都沿这条恒等通路逐层累积。</text>

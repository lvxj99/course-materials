<text x="40.00" y="526.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">Pre-Norm 把残差留成一条从输入直通输出的恒等通路，深层网络更容易优化；Post-Norm 让每层输出都被归一化，训练通常需要 warmup。</text>
<text x="40.00" y="544.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">残差相加要求形状一致（都是 T × d）；两次 Norm 的参数互不共享，换成 RMSNorm 只是去掉均值中心化、省下一部分开销。</text>
</svg>
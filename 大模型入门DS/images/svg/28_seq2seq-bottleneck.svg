<text x="46.00" y="214.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">h_t：编码器在第 t 步的隐藏状态，只沿序列向前传递</text>
<text x="490.00" y="214.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">每一步都读取上一步的输出（teacher forcing 时读真实的前一词）</text>
<text x="46.00" y="272.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#44525e">句子越长，需要塞进 c 的细节越多；而 c 的维数固定，信息只能被压缩。读取时也没有“看哪里”的选择。</text>
<text x="46.00" y="294.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#44525e">这正是注意力机制要改的地方：把每个位置的隐藏状态都保留下来，让解码器在每一步按需读取（7.1 节）。</text>
<text x="46.00" y="326.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#7c8a97">注意力版本里，编码器交出的是 T 个向量 h₁ … h_T，解码器每一步为它们分配权重，再汇总；seq2seq 的交出物只有一个 c。</text>
</svg>
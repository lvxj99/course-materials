<text x="150.00" y="356.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">掩码加在 softmax 之前的打分上：允许的位置 +0，禁止的位置 −∞。经过 softmax，−∞ 变成 0，未来位置就完全不会被读到。</text>
<text x="150.00" y="376.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#7c8a97">补齐序列长度时插入的 padding 位置也用同样的办法排除；它和位置编码解决的是两个问题——一个管“能读谁”，一个管“相对多远”。</text>

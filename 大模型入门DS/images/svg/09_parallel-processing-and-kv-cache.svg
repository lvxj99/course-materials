<text x="40.00" y="366.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">T 个 Query 行在同一次前向里并行算完 → 决定 TTFT（首 token 延迟）。</text>

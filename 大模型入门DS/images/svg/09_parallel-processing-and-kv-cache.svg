<text x="252.51" y="444.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="13" text-anchor="start" fill="#1f2a33" font-style="italic">b</text>
<text x="263.53" y="444.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="13" text-anchor="start" fill="#1f2a33" font-style="italic">字节</text>
<text x="40.00" y="468.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#7c8a97">2 = K 与 V；B 批大小，L 层数，T 序列长度，H_kv KV 头数（GQA 时小于头数），d_head 每头维度，b 每元素字节（fp16 为 2）。</text>
<text x="40.00" y="500.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">训练 / prefill 不需要缓存：T 个位置本来就一次算完，K、V 现算现用；只有自回归解码才需要把历史存下来。</text>
</svg>
<polygon points="250.00,210.00 245.00,206.90 245.00,213.10" fill="#b6c1ca"/>
<text x="200.00" y="202.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#7c8a97">π=0.3</text>

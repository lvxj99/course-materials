<polygon points="250.00,130.00 244.14,130.54 247.88,135.49" fill="#b6c1ca"/>
<text x="200.00" y="162.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#7c8a97">π=0.5</text>

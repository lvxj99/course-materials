<text x="300.00" y="214.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="middle" fill="#3a6ea5" font-style="italic">a₂</text>
<text x="390.00" y="214.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#44525e">Q = 0.50</text>
<line x1="144.00" y1="210.00" x2="246.61" y2="287.44" stroke="#b6c1ca" stroke-width="1.3" stroke-linecap="round"/>
<polygon points="250.00,290.00 247.88,284.51 244.14,289.46" fill="#b6c1ca"/>
<text x="200.00" y="242.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#7c8a97">π=0.2</text>
<rect x="258.00" y="270.00" width="150.00" height="40.00" rx="5" fill="#edf3f9" stroke="#c9dcee" stroke-width="1"/>
<text x="300.00" y="294.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="middle" fill="#3a6ea5" font-style="italic">a₃</text>
<text x="390.00" y="294.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="end" fill="#44525e">Q = 0.20</text>
<line x1="258.00" y1="340.00" x2="408.00" y2="340.00" stroke="#dde5ec" stroke-width="1" stroke-linecap="butt"/>
<text x="258.00" y="366.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">V(s) = Σ π(a|s)·Q(s,a) = 0.5×0.8 + 0.3×0.5 + 0.2×0.2 = 0.59</text>
<text x="258.00" y="386.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#7c8a97">V 是这个状态的「平均分」；再给每个动作打分，就是优势。</text>
<text x="620.00" y="70.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1f2a33" font-weight="600">A(s,a) = Q(s,a) − V(s)</text>

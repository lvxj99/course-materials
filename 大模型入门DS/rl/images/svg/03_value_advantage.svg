<text x="40.00" y="34.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#44525e" font-weight="600">同一个状态下的三个动作：价值衡量「多好」，优势衡量「比平均水平好多少」</text>

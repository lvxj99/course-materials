<text x="620.00" y="330.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#7c8a97">正值：比当前策略的平均表现更好，应该被提高；</text>
<text x="620.00" y="348.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#7c8a97">负值：拉低平均，应该被压低。</text>
<text x="40.00" y="412.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#7c8a97">策略梯度里真正该乘的不是回报 G，而是优势 A：把一个动作的收益，与「这个状态下通常会怎样」作比较。</text>

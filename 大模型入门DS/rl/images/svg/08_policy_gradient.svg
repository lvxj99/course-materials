<text x="94.00" y="276.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="10" text-anchor="middle" fill="#44525e" font-style="italic">a₁</text>
<rect x="140.00" y="110.00" width="48.00" height="150.00" rx="2" fill="#edf3f9" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="164.00" y="102.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#3a6ea5">0.55</text>
<text x="164.00" y="276.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="10" text-anchor="middle" fill="#44525e" font-style="italic">a₂</text>
<rect x="210.00" y="191.82" width="48.00" height="68.18" rx="2" fill="#eef4f8" stroke="#dde5ec" stroke-width="1"/>

<text x="725.25" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33"> Σ</text>
<text x="734.47" y="156.64" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="7.92" text-anchor="start" fill="#1f2a33" font-style="italic">t</text>
<text x="737.55" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33"> ∇</text>
<text x="746.43" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">log</text>
<text x="761.99" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33"> </text>
<text x="764.63" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">π</text>
<text x="771.85" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">(</text>
<text x="776.83" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">a</text>
<text x="782.69" y="156.64" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="7.92" text-anchor="start" fill="#1f2a33" font-style="italic">t</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
<rect width="960" height="470" fill="#ffffff"/>

<text x="40.00" y="34.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#44525e" font-weight="600">策略梯度：不学价值，直接调「选动作的概率」</text>
<text x="60.00" y="80.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10" text-anchor="start" fill="#7c8a97">当前策略 πθ(a|s)</text>

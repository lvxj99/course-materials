<text x="794.73" y="156.64" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="7.92" text-anchor="start" fill="#1f2a33" font-style="italic">t</text>
<text x="797.81" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">) · </text>
<text x="811.46" y="154.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">G</text>
<text x="818.79" y="156.64" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="7.92" text-anchor="start" fill="#1f2a33" font-style="italic">t</text>
<text x="640.00" y="186.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#7c8a97">减去基线 b(s)：</text>
<text x="640.00" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">∇</text>
<text x="646.24" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">J</text>
<text x="649.92" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33"> ≈ ∇</text>
<text x="670.27" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">log</text>
<text x="685.83" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33"> </text>
<text x="688.47" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">π</text>
<text x="695.70" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">(</text>
<text x="700.68" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">a</text>
<text x="706.54" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">|</text>
<text x="710.33" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">s</text>
<text x="715.49" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">) · (</text>
<text x="734.12" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">G</text>
<text x="741.45" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33"> − </text>
<text x="755.70" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">b</text>
<text x="762.27" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">(</text>
<text x="767.25" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33" font-style="italic">s</text>
<text x="772.41" y="212.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="start" fill="#1f2a33">))</text>
<text x="640.00" y="242.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#7c8a97">不影响期望，但能大幅降低方差。</text>
<text x="640.00" y="268.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#6f63a5">b(s) 最简单的取法就是 V(s)——这就是 actor-critic。</text>
<text x="40.00" y="396.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e">为什么是 log 项？因为 ∂π/∂θ = π · ∂log π/∂θ：只要「采样到」某个动作，就能无偏地估计它概率的梯度。</text>
<text x="40.00" y="418.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">代价是方差大、样本效率低；而且更新幅度受步长影响，策略可能一步走坏——这才有了信任域与 PPO。</text>
</svg>
<text x="234.00" y="276.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="10" text-anchor="middle" fill="#44525e" font-style="italic">a₃</text>
<text x="232.00" y="186.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="start" fill="#3a6ea5">采样到 a₂</text>
<line x1="232.00" y1="192.00" x2="219.83" y2="211.13" stroke="#3a6ea5" stroke-width="1" stroke-linecap="round"/>
<polygon points="218.00,214.00 222.24,211.96 218.06,209.29" fill="#3a6ea5"/>
<line x1="60.00" y1="260.00" x2="290.00" y2="260.00" stroke="#44525e" stroke-width="1" stroke-linecap="butt"/>
<text x="60.00" y="304.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#3a6ea5">采样 a₂ → 得到一条轨迹 → 算出 G（或优势 A）</text>
<text x="400.00" y="80.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e" font-weight="600">按结果调整概率</text>
<rect x="400.00" y="96.00" width="200.00" height="92.00" rx="8" fill="#edf5ec" stroke="#c6dcc4" stroke-width="1"/>
<text x="414.00" y="120.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#4f8552" font-weight="600">如果 G &gt; 0（比预期好）</text>
<text x="414.00" y="142.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#44525e">π(a₂) ↑，其它动作 ↓</text>
<text x="414.00" y="162.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#7c8a97">更新方向：∇log π(a₂|s) × G</text>
<rect x="400.00" y="204.00" width="200.00" height="92.00" rx="8" fill="#faeeee" stroke="#eccbcd" stroke-width="1"/>
<text x="414.00" y="228.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#b04a4e" font-weight="600">如果 G &lt; 0（比预期差）</text>
<text x="414.00" y="250.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#44525e">π(a₂) ↓</text>
<text x="414.00" y="270.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#7c8a97">梯度反号，同一个 log 项的系数变负</text>
<text x="640.00" y="120.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e" font-weight="600">梯度估计（REINFORCE）</text>

<text x="660.00" y="192.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">· 好动作（A&gt;0）把概率提到 1+ε 就够了，</text>
<text x="660.00" y="210.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">  再提也不给额外奖励，避免一步走太远；</text>
<text x="660.00" y="232.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">· 坏动作（A&lt;0）把概率压到 1−ε 就够，</text>
<text x="660.00" y="250.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">  再压也不额外奖励。</text>
<text x="660.00" y="282.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6f63a5">KL 惩罚 / 信任域的作用类似：</text>
<text x="660.00" y="300.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#6f63a5">让新策略别离旧策略太远。</text>
<text x="40.00" y="424.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">PPO 仍然用重要性采样复用旧策略采到的数据，但用 clip 把「复用」限制在信任域内；实现上通常跑多个 epoch、几个 minibatch。</text>

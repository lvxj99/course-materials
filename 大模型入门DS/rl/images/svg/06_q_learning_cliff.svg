<text x="560.00" y="330.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#44525e">同一条悬崖路：Q-learning 用 max 学「最优」，</text>
<text x="560.00" y="348.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#44525e">SARSA 用实际采样的 a′ 学「当前策略」，</text>
<text x="560.00" y="366.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#7c8a97">所以后者会为了避免随机探索掉下去而绕远。</text>
<text x="40.00" y="410.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e">on-policy（SARSA）：用自己正在执行的动作去更新；off-policy（Q-learning）：用最优动作去更新，可以学别人的数据。</text>
<text x="40.00" y="432.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">代价：max 会让估计系统性偏高（maximization bias），常配合 Double Q-learning 修正。</text>

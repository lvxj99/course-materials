<text x="40.00" y="392.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">这解释了为什么 RL 后 pass@1 涨得很快：不是「学会了新解法」，而是「更常选到已经会的解法」。</text>
<text x="40.00" y="412.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">也解释了它的天花板：基座模型采样不到的正确解法，RL 也采样不出来（除非奖励信号足够细）。</text>
<text x="40.00" y="438.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#b6c1ca">曲线为示意；实验上常见的是 pass@1 上升、pass@k（k 很大）上升有限甚至下降。</text>

<text x="110.00" y="304.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#44525e" font-weight="600">自举</text>
<rect x="288.00" y="274.00" width="124.00" height="52.00" rx="8" fill="#eef4f8" stroke="#dde5ec" stroke-width="1"/>
<text x="350.00" y="304.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#44525e" font-weight="600">off-policy</text>
<line x1="230.00" y1="92.00" x2="110.00" y2="300.00" stroke="#b6c1ca" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="110.00" y1="300.00" x2="350.00" y2="300.00" stroke="#b6c1ca" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<line x1="350.00" y1="300.00" x2="230.00" y2="92.00" stroke="#b6c1ca" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<text x="230.00" y="214.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b04a4e" font-weight="600">致命三角</text>
<text x="230.00" y="232.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#b04a4e">误差被反复放大 → 发散</text>
<rect x="530.00" y="92.00" width="390.00" height="76.00" rx="8" fill="#ffffff" stroke="#dde5ec" stroke-width="1"/>
<rect x="530.00" y="92.00" width="4.00" height="76.00" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1"/>
<text x="548.00" y="118.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#3a6ea5" font-weight="600">经验回放 replay</text>
<text x="548.00" y="140.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">把历史样本存起来随机抽，打破样本相关性；也让同一批数据被反复使用。</text>
<rect x="530.00" y="188.00" width="390.00" height="76.00" rx="8" fill="#ffffff" stroke="#dde5ec" stroke-width="1"/>
<rect x="530.00" y="188.00" width="4.00" height="76.00" rx="2" fill="#6f63a5" stroke="none" stroke-width="1"/>
<text x="548.00" y="214.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#6f63a5" font-weight="600">目标网络 target net</text>
<text x="548.00" y="236.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">用一份「慢半拍」的旧参数算自举目标，别让目标和预测一起跑。</text>
<rect x="530.00" y="284.00" width="390.00" height="76.00" rx="8" fill="#ffffff" stroke="#dde5ec" stroke-width="1"/>
<rect x="530.00" y="284.00" width="4.00" height="76.00" rx="2" fill="#2f8b7f" stroke="none" stroke-width="1"/>
<text x="548.00" y="310.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" fill="#2f8b7f" font-weight="600">奖励 / 梯度裁剪</text>
<text x="548.00" y="332.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.6" text-anchor="start" fill="#44525e">把奖励压到合理范围，控制 TD 误差的尺度，避免大梯度冲击。</text>
<text x="530.00" y="74.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#44525e" font-weight="600">DQN 的三处工程修正</text>
<text x="40.00" y="392.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">这三项不是理论上的解法，而是让「深度 + 自举 + 离策略」在小规模上能跑起来的工程手段；更根本的稳定性要靠在策略方法（第 9 节起）。</text>
</svg>
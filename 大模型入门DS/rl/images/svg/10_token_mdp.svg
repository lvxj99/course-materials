<text x="135.00" y="154.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#7c8a97">s₀</text>
<text x="278.00" y="154.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#7c8a97">s1</text>
<text x="358.00" y="154.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#7c8a97">s2</text>
<text x="438.00" y="154.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#7c8a97">s3</text>
<text x="518.00" y="154.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#7c8a97">s4</text>
<text x="598.00" y="154.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#7c8a97">s5</text>
<text x="50.00" y="176.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#7c8a97">状态 sₜ = 已经生成的前缀（长度随 t 增长）</text>
<rect x="700.00" y="86.00" width="210.00" height="52.00" rx="6" fill="#edf5ec" stroke="#c6dcc4" stroke-width="1"/>
<text x="805.00" y="106.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#4f8552" font-weight="600">奖励 r</text>
<text x="805.00" y="124.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="8.6" text-anchor="middle" fill="#4f8552">由奖励模型或验证器给出</text>
<line x1="628.00" y1="112.00" x2="691.75" y2="112.00" stroke="#4f8552" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="696.00,112.00 691.00,108.90 691.00,115.10" fill="#4f8552"/>
<text x="805.00" y="152.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="8.8" text-anchor="middle" fill="#7c8a97">只在回合结束给一次 → 稀疏</text>
<line x1="250.00" y1="212.00" x2="520.00" y2="212.00" stroke="#4f8552" stroke-width="2" stroke-linecap="butt"/>
<line x1="385.00" y1="212.00" x2="385.00" y2="190.25" stroke="#4f8552" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="385.00,186.00 381.90,191.00 388.10,191.00" fill="#4f8552"/>
<line x1="250.00" y1="186.00" x2="520.00" y2="186.00" stroke="#4f8552" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="250.00" y1="186.00" x2="250.00" y2="178.00" stroke="#4f8552" stroke-width="1.2" stroke-linecap="butt"/>
<line x1="520.00" y1="186.00" x2="520.00" y2="178.00" stroke="#4f8552" stroke-width="1.2" stroke-linecap="butt"/>
<text x="532.00" y="216.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="start" fill="#4f8552">同一个优势 Â 广播给这一段里的每个 token（最简单的信用分配）</text>
<line x1="50.00" y1="246.00" x2="910.00" y2="246.00" stroke="#dde5ec" stroke-width="1" stroke-linecap="butt"/>
<text x="50.00" y="272.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#44525e">每个 token 还有一项 KL 约束：把新策略拉在参考策略附近，别为了拿分把语言能力改坏。</text>
<text x="50.00" y="292.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="9.5" text-anchor="start" fill="#7c8a97">−β · KL( πθ(·|sₜ) ‖ πref(·|sₜ) )，对所有 t 求和</text>
<text x="50.00" y="332.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">与经典 RL 的差别：动作空间是整个词表（几万维）、回合很长（几千步）、奖励几乎总在最后——信用分配因此更难。</text>
<text x="50.00" y="354.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#7c8a97">更细的做法：用 critic 估计每个位置的价值（PPO），或者引入过程奖励（process reward）；GRPO 则干脆用组内相对分数代替 critic。</text>
<text x="50.00" y="386.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#b6c1ca">注意：这里的「状态」是模型自己写出来的前缀，转移是确定的——所以 LLM 的 RL 里没有环境噪声，只有采样噪声。</text>
</svg>
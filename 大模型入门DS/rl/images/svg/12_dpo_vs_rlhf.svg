<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
<rect width="960" height="440" fill="#ffffff"/>

<text x="40.00" y="34.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#44525e" font-weight="600">DPO：把「先训奖励模型、再跑 RL」这一步代数地消掉</text>
<text x="40.00" y="76.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6f63a5" font-weight="600">RLHF / PPO 路线</text>
<rect x="60.00" y="96.00" width="150.00" height="46.00" rx="6" fill="#f0eef8" stroke="#d6d0ea" stroke-width="1"/>
<text x="135.00" y="123.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">偏好对 (y_w, y_l)</text>
<rect x="250.00" y="96.00" width="150.00" height="46.00" rx="6" fill="#f0eef8" stroke="#d6d0ea" stroke-width="1"/>
<text x="325.00" y="123.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">训练 RM：r_φ</text>
<rect x="440.00" y="96.00" width="160.00" height="46.00" rx="6" fill="#f0eef8" stroke="#d6d0ea" stroke-width="1"/>
<text x="520.00" y="123.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">PPO：用 r_φ 打分</text>
<rect x="640.00" y="96.00" width="150.00" height="46.00" rx="6" fill="#f0eef8" stroke="#d6d0ea" stroke-width="1"/>
<text x="715.00" y="123.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">得到 πθ</text>
<line x1="212.00" y1="119.00" x2="244.60" y2="119.00" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="248.00,119.00 244.00,116.52 244.00,121.48" fill="#b6c1ca"/>
<line x1="402.00" y1="119.00" x2="434.60" y2="119.00" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="438.00,119.00 434.00,116.52 434.00,121.48" fill="#b6c1ca"/>
<line x1="602.00" y1="119.00" x2="634.60" y2="119.00" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="638.00,119.00 634.00,116.52 634.00,121.48" fill="#b6c1ca"/>
<text x="40.00" y="214.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#2f8b7f" font-weight="600">DPO 路线</text>
<rect x="60.00" y="234.00" width="150.00" height="46.00" rx="6" fill="#e9f5f2" stroke="#bfe0d9" stroke-width="1"/>
<text x="135.00" y="261.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">偏好对 (y_w, y_l)</text>
<rect x="250.00" y="234.00" width="340.00" height="46.00" rx="6" fill="#e9f5f2" stroke="#bfe0d9" stroke-width="1"/>
<text x="420.00" y="253.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">直接优化 πθ：让好回答的相对概率上升</text>
<text x="420.00" y="269.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="8.2" text-anchor="middle" fill="#2f8b7f">loss = −log σ( β·log(πθ(y_w)/πref(y_w)) − β·log(πθ(y_l)/πref(y_l)) )</text>
<line x1="212.00" y1="257.00" x2="244.60" y2="257.00" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="248.00,257.00 244.00,254.52 244.00,259.48" fill="#b6c1ca"/>
<line x1="592.00" y1="257.00" x2="634.60" y2="257.00" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="638.00,257.00 634.00,254.52 634.00,259.48" fill="#b6c1ca"/>
<rect x="640.00" y="234.00" width="150.00" height="46.00" rx="6" fill="#e9f5f2" stroke="#bfe0d9" stroke-width="1"/>
<text x="715.00" y="261.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="middle" fill="#44525e">得到 πθ</text>
<rect x="60.00" y="312.00" width="730.00" height="56.00" rx="6" fill="#f6f9fb" stroke="#dde5ec" stroke-width="1"/>
<text x="76.00" y="334.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#44525e">关键一步：在 KL 正则的目标下，最优策略有闭式解 π*(y|x) ∝ πref(y|x)·exp(r(x,y)/β)，</text>
<text x="76.00" y="354.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#44525e">把它反解出来，奖励就可以写成 r(x,y) = β·log(π*(y|x)/πref(y|x)) + 常数——奖励被「表示」成了策略本身。</text>
<text x="40.00" y="396.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">于是不需要单独训 RM、也不需要在线采样：把上式代入 Bradley–Terry 似然，奖励项直接消掉，只剩策略的对数概率比。</text>
<text x="40.00" y="418.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10" text-anchor="start" fill="#7c8a97">代价：DPO 是离线的，只用到固定的偏好对；探索与在线反馈的优势就没有了。</text>
</svg>
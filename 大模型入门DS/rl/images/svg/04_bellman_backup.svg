<text x="260.00" y="352.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#7c8a97">对下一状态 s′ 按转移概率加权</text>
<text x="540.00" y="46.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6f63a5" font-weight="600">② 最优价值：把加权平均换成 max</text>
<text x="540.00" y="64.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#7c8a97">不再问「按当前策略会怎样」，而是问「最好能怎样」</text>
<rect x="670.00" y="96.00" width="140.00" height="40.00" rx="6" fill="#edf3f9" stroke="#c9dcee" stroke-width="1"/>
<text x="740.00" y="121.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="middle" fill="#3a6ea5" font-style="italic">V(s)</text>
<line x1="740.00" y1="138.00" x2="613.28" y2="173.09" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>
<polygon points="610.00,174.00 614.52,175.32 613.19,170.54" fill="#b6c1ca"/>
<rect x="558.00" y="174.00" width="104.00" height="40.00" rx="5" fill="#f0eef8" stroke="#d6d0ea" stroke-width="1"/>
<text x="610.00" y="198.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="10" text-anchor="middle" fill="#6f63a5" font-style="italic">Q(s,a1)</text>
<line x1="740.00" y1="138.00" x2="740.00" y2="170.60" stroke="#b6c1ca" stroke-width="1.1" stroke-linecap="round"/>

<line x1="870.00" y1="216.00" x2="742.94" y2="290.28" stroke="#b6c1ca" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<polygon points="740.00,292.00 744.70,292.12 742.20,287.84" fill="#b6c1ca" opacity="0.8"/>
<rect x="662.00" y="292.00" width="156.00" height="40.00" rx="6" fill="#e9f5f2" stroke="#bfe0d9" stroke-width="1"/>
<text x="740.00" y="317.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="12" text-anchor="middle" fill="#2f8b7f" font-style="italic">V(s′)</text>
<text x="740.00" y="352.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="middle" fill="#7c8a97">对下一状态 s′ 按转移概率加权</text>
<text x="40.00" y="396.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.8" text-anchor="start" fill="#44525e">贝尔曼方程做的事：把「无限长的回报求和」改写成一个「自指」的等式。只要下一层的 V 是对的，这一层的 V 就能用一次期望算出来。</text>
<text x="40.00" y="418.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#7c8a97">于是求解 V 变成一个不动点问题：反复用右边更新左边（动态规划），或者从采样中估计右边（TD）。</text>
<text x="40.00" y="444.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.8" text-anchor="start" fill="#b6c1ca">※ 图中每个 Q 只画了一条到 V(s′) 的边，实际要对所有下一状态按转移概率加权。</text>
</svg>
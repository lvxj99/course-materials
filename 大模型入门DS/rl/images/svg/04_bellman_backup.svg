<text x="774.00" y="152.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9" text-anchor="start" fill="#1f2a33" font-weight="600">取 max</text>
<line x1="610.00" y1="216.00" x2="737.06" y2="290.28" stroke="#b6c1ca" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<polygon points="740.00,292.00 737.80,287.84 735.30,292.12" fill="#b6c1ca" opacity="0.8"/>

<text x="60.00" y="72.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="9.2" text-anchor="start" fill="#3a6ea5">一条采样轨迹：每步 −0.04，最后一步拿到 +1</text>
<text x="400.00" y="74.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1f2a33" font-weight="600">五元组  M = (S, A, P, R, γ)</text>
<text x="400.00" y="108.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="start" fill="#3a6ea5" font-weight="600" font-style="italic">S</text>
<text x="422.00" y="108.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">状态：网格里的位置（含起终点、墙、陷阱）</text>
<text x="400.00" y="138.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="start" fill="#3a6ea5" font-weight="600" font-style="italic">A</text>
<text x="422.00" y="138.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">动作：上 / 下 / 左 / 右</text>
<text x="400.00" y="168.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="start" fill="#3a6ea5" font-weight="600" font-style="italic">P</text>
<text x="422.00" y="168.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">转移：P(s′|s,a)，撞墙留在原地</text>
<text x="400.00" y="198.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="start" fill="#3a6ea5" font-weight="600" font-style="italic">R</text>
<text x="422.00" y="198.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">奖励：每步 −0.04，进入终点 +1，陷阱 −1</text>
<text x="400.00" y="228.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="11" text-anchor="start" fill="#3a6ea5" font-weight="600" font-style="italic">γ</text>
<text x="422.00" y="228.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#44525e">折扣：让近期奖励更重要，γ∈[0,1)</text>
<text x="400.00" y="282.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6f63a5">策略 π(a|s)：在每个状态给出动作分布。</text>
<text x="400.00" y="300.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6f63a5">轨迹 τ = (s₀,a₀,r₁,s₁,…)：数据由「当前策略」采样得到，</text>
<text x="400.00" y="318.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.2" text-anchor="start" fill="#6f63a5">所以策略一变，数据分布也跟着变。</text>
<text x="400.00" y="356.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1f2a33">目标：找到 π，使期望回报 E_π[G₀] 最大，</text>
<text x="400.00" y="376.00" font-family="'Cambria Math','Times New Roman',Georgia,serif" font-size="10.5" text-anchor="start" fill="#1f2a33">G₀ = r₁ + γr₂ + γ²r₃ + …</text>
<text x="40.00" y="442.00" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#7c8a97">与监督学习的三点不同：没有逐时刻的正确答案；奖励可能延迟且稀疏；训练数据的分布由自己的策略决定。</text>
